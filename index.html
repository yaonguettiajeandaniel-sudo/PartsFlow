    '<p class="muted" style="margin-top:0;">Véhicule : <b class="mono">'+esc(veh?veh.immatriculation:"—")+'</b> · Statut : '+pill(d.statut)+" · Date : "+fmtDate(d.date)+(d.dureeEstimeeJours?" · Durée estimée : "+d.dureeEstimeeJours+" j":"")+"</p>"+
    '<table class="lines-table"><thead><tr><th>Ligne</th><th>Qté</th><th>P.U.</th><th>Montant</th></tr></thead><tbody>'+lignesHtml+"</tbody></table>"+
    '<div class="lines-total"><span class="muted">Total devis</span><b>'+fmtMoney(total)+"</b></div>"+
    (d.factureId ? '<div class="callout"><span class="lbl">Converti</span><p>Ce devis a été converti directement en facture.</p></div>' : "")+
    (d.orId ? '<div class="callout"><span class="lbl">À l\'atelier</span><p>Ce devis a été envoyé à l\'atelier sous forme d\'ordre de réparation.</p></div>' : "");

  const statusButtons = [];
  if(!d.factureId && !d.orId){
    if(d.statut==="brouillon") statusButtons.push('<button class="btn" id="toEnvoye">Marquer envoyé</button>');
    if(d.statut==="envoye"){ statusButtons.push('<button class="btn" id="toAccepte">Marquer accepté</button>'); statusButtons.push('<button class="btn danger" id="toRefuse">Marquer refusé</button>'); }
    statusButtons.push('<button class="btn" id="toAtelier">Envoyer à l\'atelier</button>');
    statusButtons.push('<button class="btn primary" id="toFacture">Facturer directement</button>');
  }
  openModal("Devis "+d.numero, body, {
    wide:true,
    footHtml: '<button class="btn ghost" id="cl">Fermer</button><button class="btn" id="printDev">Imprimer / PDF</button>'+statusButtons.join("")+(isAdmin() ? '<button class="btn danger" id="deleteDev">Supprimer</button>' : ""),
    onMount(back, close){
      back.querySelector("#cl").addEventListener("click", close);
      back.querySelector("#printDev").addEventListener("click", ()=> printDocument("devis", d, veh));
      const delB = back.querySelector("#deleteDev");
      if(delB) delB.addEventListener("click", async ()=>{
        const ok = await askConfirm("Supprimer définitivement le devis "+d.numero+" ? Cette action est irréversible — à réserver aux données de test.", "Supprimer définitivement");
        if(!ok) return;
        await state.db.doc("devis/"+d.id).delete();
        await logAudit("Suppression devis", d.numero, "");
        close(); toast("Devis supprimé."); renderView();
      });
      const setStatut = (s)=> async ()=>{ await state.db.doc("devis/"+d.id).update({statut:s}); close(); renderView(); };
      const teB = back.querySelector("#toEnvoye"); if(teB) teB.addEventListener("click", setStatut("envoye"));
      const taB = back.querySelector("#toAccepte"); if(taB) taB.addEventListener("click", setStatut("accepte"));
      const trB = back.querySelector("#toRefuse"); if(trB) trB.addEventListener("click", setStatut("refuse"));
      const tf = back.querySelector("#toFacture");
      if(tf) tf.addEventListener("click", async ()=>{
        const ok = await askConfirm("Convertir le devis "+d.numero+" en facture ? Les pièces seront décomptées du stock.", "Convertir");
        if(!ok) return;
        const lignes = (d.lignes||[]).map(l=>({...l, montant: computeLigneMontant(l)}));
        const montantTotal = lignes.reduce((s,l)=>s+l.montant,0);
        const numero = await nextNumero("facture","FAC");
        const factureRef = await state.db.collection("factures").add({
          numero, devisId:d.id, orId:null, vehiculeId:d.vehiculeId, date: todayIso(),
          lignes, montantTotal, montantRegle:0, statutPaiement:"impayee", reglements:[],
          createdAt: todayIso(), createdBy: actingUserName()
        });
        for(const l of lignes){
          if(l.type!=="main_oeuvre" && l.articleId){
            await ajusterStock(l.articleId, -Math.abs(l.quantite||0), "sortie", "facture", numero, "Vente sur devis "+d.numero);
          }
        }
        await state.db.doc("devis/"+d.id).update({ statut:"accepte", factureId: factureRef.id });
        await logAudit("Conversion devis en facture", d.numero+" → "+numero, "");
        close(); toast("Facture "+numero+" créée."); setView("facture-detail", { id: factureRef.id });
      });
      const toAt = back.querySelector("#toAtelier");
      if(toAt) toAt.addEventListener("click", async ()=>{
        const choix = await openEnvoyerAtelierForm(d);
        if(!choix) return;
        const lignes = d.lignes||[];
        const numero = await nextNumero("or","OR");
        const pieces = lignes.filter(l=>l.type!=="main_oeuvre" && l.articleId).map(l=>({
          articleId:l.articleId, reference:l.reference, designation:l.designation, quantite:l.quantite, prixUnitaire:l.prixUnitaire
        }));
        const moAvecTech = lignes.filter(l=>l.type==="main_oeuvre" && l.technicienId);
        const moSansTech = lignes.filter(l=>l.type==="main_oeuvre" && !l.technicienId);
        const interventions = moAvecTech.map(l=>({
          id: Math.random().toString(36).slice(2), technicienId:l.technicienId, technicienNom:l.technicienNom, metier:l.metier,
          description:l.designation, montant:Number(l.prixUnitaire)||0, date: todayIso()
        }));
        const orRef = await state.db.collection("ordres").add({
          numero, vehiculeId:d.vehiculeId, statut:"ouvert", dateOuverture: todayIso(), dateCloture:null,
          km:null, technicienIds: interventions.map(i=>i.technicienId), pieces, interventions, factureId:null,
          technicienResponsableId: choix.technicienResponsableId, technicienResponsableNom: choix.technicienResponsableNom,
          devisId: d.id, createdAt: todayIso(), createdBy: actingUserName()
        });
        for(const p of pieces){
          await ajusterStock(p.articleId, -Math.abs(p.quantite||0), "sortie", "or", numero, "Pose sur "+numero+" (depuis devis "+d.numero+")");
        }
        await state.db.doc("devis/"+d.id).update({ statut:"accepte", orId: orRef.id });
        await marquerVehiculeImmobiliseSiNecessaire(d.vehiculeId);
        await logAudit("Envoi devis vers atelier", d.numero+" → "+numero, choix.technicienResponsableNom||"");
        close();
        toast(moSansTech.length ? "OR "+numero+" créé — "+moSansTech.length+" ligne(s) de main d'œuvre sans technicien à ajouter manuellement." : "OR "+numero+" créé.");
        setView("atelier-detail", { id: orRef.id });
      });
    }
  });
}

function openFactureDirecteForm(vehicules){

function openReglementForm(facture, resteDefault){
  const body =
    '<div class="field-row" style="grid-template-columns:1fr 1fr;">'+
      '<div class="field"><label>Montant</label><input id="f_montant" type="number" value="'+resteDefault+'"></div>'+
      '<div class="field"><label>Date</label><input id="f_date" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div>'+
    "</div>"+
    '<div class="field-row" style="grid-template-columns:1fr 1fr;">'+
      '<div class="field"><label>Mode de paiement</label><select id="f_mode">'+
        ["Espèces","Virement","Mobile money","Chèque"].map(m=>'<option value="'+m+'">'+m+"</option>").join("")+
      "</select></div>"+
      '<div class="field"><label>Référence (optionnel)</label><input id="f_refpay" placeholder="N° de transaction, chèque…"></div>'+
    "</div>";
  const { close } = openModal("Ajouter un règlement — "+facture.numero, body, {
    footHtml: '<button class="btn ghost" id="cancel">Annuler</button><button class="btn primary" id="save">Enregistrer</button>',
    onMount(back, close){
      back.querySelector("#cancel").addEventListener("click", close);
      back.querySelector("#save").addEventListener("click", async ()=>{
        const montant = Number(back.querySelector("#f_montant").value);
        if(!montant || montant<=0){ toast("Montant invalide.", "danger"); return; }
        const reglement = {
          date: back.querySelector("#f_date").value || todayIso(),
          montant, mode: back.querySelector("#f_mode").value,
          reference: back.querySelector("#f_refpay").value.trim(),
          utilisateur: actingUserName()
        };
        const reglements = [...(facture.reglements||[]), reglement];
        const montantRegle = (facture.montantRegle||0) + montant;
        const statutPaiement = statutPaiement2(facture.montantTotal, montantRegle);
        await state.db.doc("factures/"+facture.id).update({ reglements, montantRegle, statutPaiement });
        await logAudit("Règlement facture", facture.numero, fmtMoney(montant)+" ("+reglement.mode+")");
        close(); toast("Règlement enregistré."); setView("facture-detail",{id:facture.id});
      });
    }
  });
}
function statutPaiement2(total, regle){ return statutPaiement(total, regle); }

          numero, vehiculeId, statut:"ouvert", dateOuverture: todayIso(), dateCloture:null,
          km: Number(back.querySelector("#f_km").value)||null, technicienIds:[],
          technicienResponsableId: tech?tech.id:null, technicienResponsableNom: tech?tech.nom:null,
          pieces:[], interventions:[], factureId:null,
          createdAt: todayIso(), createdBy: actingUserName()
        });
        await marquerVehiculeImmobiliseSiNecessaire(vehiculeId);
        await logAudit("Ouverture OR", numero, tech?tech.nom:"");
        close(); toast("Ordre de réparation ouvert."); setView("atelier-detail",{id:ref.id});
      });
    }
  });
}

/* ---- Prise en charge (triage) -------------------------------------------
   Aide à la décision, pas une décision automatique : la file est construite
   à partir du statut réel de chaque véhicule (immobilisé, pas déjà en
   réparation) — elle se met donc à jour automatiquement dès qu'un véhicule
   change de statut. Pour chaque véhicule de la file, si un devis accepté
   est prêt à partir, on vérifie si les pièces nécessaires sont réellement
   disponibles — en tenant compte de ce que les véhicules plus anciens dans
   la file ont déjà "réservé" avant lui — et si l'atelier a une place libre
   (nombre d'OR ouverts vs capacité configurée). Le résultat est une
   recommandation affichée, jamais un accès bloqué : le chef d'atelier
   garde toujours la main via "Envoyer à l'atelier" sur le devis, ou peut
   déclencher une commande urgente pour les pièces qui manquent. */
VIEWS.triage = async function(view){
  const [devis, vehicules, articles, ordres] = await Promise.all([
    getAll("devis"), getAll("vehicules"), getAll("articles"), getAll("ordres")
  ]);
  const vehiculesEnReparation = new Set(ordres.filter(o=>o.statut==="ouvert").map(o=>o.vehiculeId));
  const queue = vehicules
    .filter(v=>v.statut==="immobilise" && !vehiculesEnReparation.has(v.id))
    .sort((a,b)=> new Date(a.immobiliseDepuis||0) - new Date(b.immobiliseDepuis||0));

  const stockSim = {};
  articles.forEach(a=>{ stockSim[a.id] = Number(a.stockQte)||0; });

  const capacite = Number(state.config.capaciteAtelier)||5;
  const orOuvertsCount = ordres.filter(o=>o.statut==="ouvert").length;
  let placesRestantes = Math.max(0, capacite - orOuvertsCount);

  const rows = queue.map(veh=>{
    const d = devis
      .filter(x=>x.vehiculeId===veh.id && x.statut==="accepte" && !x.orId && !x.factureId)
      .sort((a,b)=> new Date(a.date)-new Date(b.date))[0];

    const referenceDate = veh.immobiliseDepuis || (d ? d.date : null);
    const joursAttente = referenceDate ? Math.max(0, Math.floor((Date.now() - new Date(referenceDate).getTime()) / 86400000)) : 0;

    let statut, raison, manquants = [];
    if(!d){
      statut = "sans_devis";
      raison = "Aucun devis accepté en attente" + (veh.motifInactivite ? " — "+(MOTIFS_INACTIVITE[veh.motifInactivite]||veh.motifInactivite)+(veh.detailInactivite ? " : "+veh.detailInactivite : "") : "");
    } else {
      const pieceLignes = (d.lignes||[]).filter(l=>l.type!=="main_oeuvre" && l.articleId);
      pieceLignes.forEach(l=>{
        const dispo = stockSim[l.articleId]!=null ? stockSim[l.articleId] : 0;
        if((Number(l.quantite)||0) > dispo){
          const art = articles.find(a=>a.id===l.articleId);
          manquants.push({ articleId:l.articleId, reference: art?art.reference:(l.reference||"?"), designation: art?art.designation:(l.designation||""), besoin:Number(l.quantite)||0, dispo, prixUnitaire: art?(art.prixAchat||0):0 });
        }
      });
      const okStock = manquants.length===0;
      pieceLignes.forEach(l=>{
        const dispo = stockSim[l.articleId]!=null ? stockSim[l.articleId] : 0;
        stockSim[l.articleId] = Math.max(0, dispo - (Number(l.quantite)||0));
      });
      if(!okStock){
        statut = "bloque";
        raison = "Pièce(s) manquante(s) : " + manquants.map(m=>m.reference+" (besoin "+m.besoin+", dispo "+m.dispo+")").join(" · ");
      } else if(placesRestantes <= 0){
        statut = "attente_capacite";
        raison = "Atelier à pleine capacité ("+orOuvertsCount+"/"+capacite+" OR ouverts)";
      } else {
        statut = "pret";
        raison = "Pièces disponibles, atelier a de la place";
        placesRestantes--;
      }
      if(d.dureeEstimeeJours) raison += " · Durée estimée : "+d.dureeEstimeeJours+" j";
    }
    return { devis:d, vehicule:veh, joursAttente, statut, raison, manquants };
  });

  const nbPret = rows.filter(r=>r.statut==="pret").length;
  const nbBloque = rows.filter(r=>r.statut==="bloque").length;
  const nbAttenteCap = rows.filter(r=>r.statut==="attente_capacite").length;
  const nbSansDevis = rows.filter(r=>r.statut==="sans_devis").length;
  const STATUT_LABEL = { pret:"Peut être pris en charge", bloque:"Bloqué", attente_capacite:"Atelier complet", sans_devis:"Devis à préparer" };
  const STATUT_CLASS = { pret:"accepte", bloque:"refuse", attente_capacite:"partielle", sans_devis:"brouillon" };

  view.innerHTML =
    '<div class="view-head"><div><p class="lede">File d\'attente des véhicules immobilisés, triée par ancienneté, avec vérification automatique du stock et de la capacité de l\'atelier — se met à jour dès qu\'un véhicule change de statut.</p></div>'+
      '<button class="btn primary" id="newDevisShortcut">+ Nouveau devis</button></div>'+
    '<div class="kpi-grid">'+
      '<div class="kpi good-top"><div class="lbl">Peuvent être pris en charge</div><div class="val">'+nbPret+'</div></div>'+
      '<div class="kpi danger-top"><div class="lbl">Bloqués (stock)</div><div class="val '+(nbBloque>0?"danger":"")+'">'+nbBloque+'</div></div>'+
      '<div class="kpi amber-top"><div class="lbl">En attente d\'une place</div><div class="val '+(nbAttenteCap>0?"amber":"")+'">'+nbAttenteCap+'</div></div>'+
      '<div class="kpi"><div class="lbl">Devis à préparer</div><div class="val '+(nbSansDevis>0?"amber":"")+'">'+nbSansDevis+'</div></div>'+
      '<div class="kpi"><div class="lbl">Capacité atelier</div><div class="val">'+orOuvertsCount+' / '+capacite+'</div><div class="sub">OR ouverts / capacité configurée</div></div>'+
    '</div>'+
    (queue.length===0 ? '<div class="callout"><span class="lbl">File vide</span><p>Aucun véhicule immobilisé n\'attend de prise en charge pour le moment.</p></div>' : '')+
    '<div class="table-wrap"><table class="grid"><thead><tr><th>Véhicule</th><th>Devis</th><th class="num">Attente</th><th>Statut</th><th>Détail</th><th></th></tr></thead><tbody>'+
      rows.map((r,i)=>{
        const actions =
          (r.statut==="pret" ? '<button class="btn small primary" data-dev-open="'+r.devis.id+'">Envoyer à l\'atelier</button>' : "")+
          (r.statut!=="pret" && r.devis ? '<button class="btn small ghost" data-dev-open="'+r.devis.id+'">Voir le devis</button>' : "")+
          (r.statut==="sans_devis" ? '<button class="btn small primary" data-devis-veh="'+r.vehicule.id+'">Créer un devis</button>' : "")+
          ((r.statut==="bloque" || r.statut==="sans_devis") ? '<button class="btn small danger" data-cmd-idx="'+i+'">Commande urgente</button>' : "");
        return (
        '<tr>'+
          '<td class="mono clickable" data-veh="'+r.vehicule.id+'">'+esc(r.vehicule.immatriculation)+'</td>'+
          (r.devis ? '<td class="mono clickable" data-dev="'+r.devis.id+'">'+esc(r.devis.numero)+'</td>' : '<td class="mono faint">—</td>')+
          '<td class="num mono">'+r.joursAttente+' j</td>'+
          '<td><span class="pill '+STATUT_CLASS[r.statut]+'">'+STATUT_LABEL[r.statut]+'</span></td>'+
          '<td class="faint" style="max-width:360px;">'+esc(r.raison)+'</td>'+
          '<td class="row-actions">'+actions+'</td>'+
        '</tr>'
        );
      }).join("")+
    "</tbody></table></div>";

  view.querySelector("#newDevisShortcut").addEventListener("click", ()=>openDevisForm(vehicules));
  view.querySelectorAll("[data-veh]").forEach(td=>td.addEventListener("click", ()=>setView("vehicule-detail",{id:td.getAttribute("data-veh")})));
  view.querySelectorAll("[data-dev]").forEach(td=>td.addEventListener("click", ()=>openDevisDetail(td.getAttribute("data-dev"))));
  view.querySelectorAll("[data-dev-open]").forEach(b=>b.addEventListener("click", ()=>openDevisDetail(b.getAttribute("data-dev-open"))));
  view.querySelectorAll("[data-devis-veh]").forEach(b=>b.addEventListener("click", ()=>openDevisForm(vehicules, b.getAttribute("data-devis-veh"))));
  view.querySelectorAll("[data-cmd-idx]").forEach(b=>b.addEventListener("click", async ()=>{
    const r = rows[Number(b.getAttribute("data-cmd-idx"))];
    const veh = r.vehicule;
    const [fournisseurs, arts] = await Promise.all([getAll("fournisseurs"), getAll("articles")]);
    openCommandeForm(fournisseurs, arts, {
      urgente: true,
      vehiculeId: veh.id,
      note: "Immobilisation "+veh.immatriculation+" — "+(MOTIFS_INACTIVITE[veh.motifInactivite]||veh.motifInactivite||"motif non précisé")+(veh.detailInactivite ? " : "+veh.detailInactivite : ""),
      prefillLignes: r.manquants.map(m=>({ articleId:m.articleId, reference:m.reference, designation:m.designation, quantite: Math.max(1, m.besoin-m.dispo), prixUnitaire:m.prixUnitaire }))
    });
  }));
};

        '<tr class="clickable" data-profile="'+x.id+'"><td>'+esc(x.nom)+'</td><td>'+esc(METIERS[x.metier]||x.metier)+'</td><td>'+esc(x.telephone||"—")+'</td><td>'+pill(x.statut||"actif")+'</td><td class="row-actions"><button class="btn small" data-edit="'+x.id+'">Modifier</button></td></tr>'
      ).join("") : '<tr class="empty-row"><td colspan="5">Aucun technicien ne correspond.</td></tr>';
      document.querySelectorAll("#techTbody [data-profile]").forEach(tr=>tr.addEventListener("click", ()=>setView("technicien-detail",{id:tr.getAttribute("data-profile")})));
      document.querySelectorAll("#techTbody [data-edit]").forEach(b=>b.addEventListener("click", (e)=>{
        e.stopPropagation();
        openTechnicienForm(techniciens.find(x=>x.id===b.getAttribute("data-edit")));
      }));
    }
    draw();
    document.getElementById("techSearch").addEventListener("input", draw);
    document.getElementById("newTech").addEventListener("click", ()=>openTechnicienForm());
  }
  async function drawSynthese(){
    const [ordres, factures] = await Promise.all([getAll("ordres"), getAll("factures")]);
    const now = new Date();
    const monthDefault = now.toISOString().slice(0,7);
    document.getElementById("tabBody").innerHTML =
      '<div class="view-head"><div><p class="lede">Total des montants de main d\'œuvre par technicien, pour la paie de fin de mois — ordres de réparation et factures directes confondus.</p></div>'+
        '<div class="row-actions"><input type="month" id="monthPick" value="'+monthDefault+'"><button class="btn" id="exportCsv">Exporter en CSV</button></div></div>'+
      '<div id="syntheseBody"></div>';
    function renderMonth(month){
      const [y,m] = month.split("-").map(Number);
      const rows = [];
      ordres.forEach(o=>{
        (o.interventions||[]).forEach(i=>{
          const d = new Date(i.date);
          if(d.getFullYear()===y && (d.getMonth()+1)===m){
            rows.push({ technicien:i.technicienNom, metier: METIERS[i.metier]||i.metier, or:o.numero, description:i.description, date:i.date, montant:Number(i.montant)||0 });
          }
        });
      });
      /* Main-d'œuvre facturée hors OR (devis converti directement, ou facture
         comptoir) : comptée ici seulement quand un technicien est assigné et
         qu'aucun OR n'a déjà porté cette même ligne (orId null), pour éviter
         un double comptage avec la boucle ci-dessus. */
      factures.forEach(f=>{
        if(f.orId || f.statutPaiement==="annulee") return;
        (f.lignes||[]).forEach(l=>{
          if(l.type!=="main_oeuvre" || !l.technicienId) return;
          const d = new Date(f.date);
          if(d.getFullYear()===y && (d.getMonth()+1)===m){
            rows.push({ technicien:l.technicienNom, metier: METIERS[l.metier]||l.metier||"", or:f.numero, description:l.designation, date:f.date, montant:Number(l.montant!=null?l.montant:computeLigneMontant(l))||0 });
          }
        });
      });
      const parTech = {};
      rows.forEach(r=>{ parTech[r.technicien] = (parTech[r.technicien]||0) + r.montant; });
      const totalGeneral = rows.reduce((s,r)=>s+r.montant,0);
      document.getElementById("syntheseBody").innerHTML =
        '<div class="table-wrap"><table class="grid"><thead><tr><th>Technicien</th><th class="num">Nb. interventions</th><th class="num">Total dû</th></tr></thead><tbody>'+
          (Object.keys(parTech).length ? Object.entries(parTech).sort((a,b)=>b[1]-a[1]).map(([nom,total])=>
            '<tr><td>'+esc(nom)+'</td><td class="num">'+rows.filter(r=>r.technicien===nom).length+'</td><td class="num mono">'+fmtMoney(total)+"</td></tr>"
          ).join("") : '<tr class="empty-row"><td colspan="3">Aucune intervention ce mois-ci.</td></tr>')+
          '<tr><td colspan="2" style="font-weight:700;">Total général</td><td class="num mono" style="font-weight:700;">'+fmtMoney(totalGeneral)+"</td></tr>"+
        "</tbody></table></div>"+
        '<h3 class="section-title">Détail des interventions</h3>'+
        '<div class="table-wrap"><table class="grid"><thead><tr><th>Date</th><th>Technicien</th><th>OR</th><th>Description</th><th class="num">Montant</th></tr></thead><tbody>'+
          (rows.length ? rows.sort((a,b)=>new Date(a.date)-new Date(b.date)).map(r=>
            '<tr><td>'+fmtDate(r.date)+'</td><td>'+esc(r.technicien)+'</td><td class="mono">'+esc(r.or)+'</td><td>'+esc(r.description)+'</td><td class="num mono">'+fmtMoney(r.montant)+"</td></tr>"
          ).join("") : '<tr class="empty-row"><td colspan="5">—</td></tr>')+
        "</tbody></table></div>";
      document.getElementById("exportCsv").onclick = ()=>{
        let csv = "Technicien;Metier;OR;Description;Date;Montant\n";
        rows.forEach(r=>{ csv += [r.technicien,r.metier,r.or,r.description.replace(/;/g,","),fmtDate(r.date),r.montant].join(";")+"\n"; });
        downloadFile("synthese-main-oeuvre-"+month+".csv", csv);
        toast("Export téléchargé.");
      };
    }
    renderMonth(monthDefault);
    document.getElementById("monthPick").addEventListener("change", e=>renderMonth(e.target.value));
  }
  drawListe();
  view.querySelectorAll(".tabs button").forEach(b=>{
    b.addEventListener("click", ()=>{
      view.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      if(b.getAttribute("data-tab")==="liste") drawListe(); else drawSynthese();
    });
  });
};

function openTechnicienForm(existing){
  const t = existing || {};
  const statutActuel = t.statut || "actif";
  const body =
    '<div class="field-row" style="grid-template-columns:1fr 1fr;">'+
      '<div class="field"><label>Nom</label><input id="f_nom" value="'+esc(t.nom||"")+'"></div>'+
      '<div class="field"><label>Métier</label><select id="f_metier">'+
        Object.entries(METIERS).map(([k,v])=>'<option value="'+k+'" '+(t.metier===k?"selected":"")+'>'+v+"</option>").join("")+
      "</select></div>"+
    "</div>"+
    '<div class="field-row" style="grid-template-columns:1fr 1fr;">'+
      '<div class="field"><label>Téléphone</label><input id="f_tel" value="'+esc(t.telephone||"")+'"></div>'+
      '<div class="field"><label>Statut</label><select id="f_statut">'+
        Object.entries(TECHNICIEN_STATUTS).map(([k,v])=>'<option value="'+k+'" '+(statutActuel===k?"selected":"")+'>'+v+"</option>").join("")+
      "</select></div>"+
    "</div>"+
    '<div class="field-row" id="f_sanction_row" style="grid-template-columns:2fr 1fr;'+(statutActuel==="actif"?"display:none;":"")+'">'+
      '<div class="field"><label>Motif (sanction / licenciement)</label><input id="f_motif" value="'+esc(t.motifSanction||"")+'" placeholder="ex. absences répétées, faute professionnelle…"></div>'+
      '<div class="field"><label>Date</label><input id="f_date_sanction" type="date" value="'+esc((t.dateSanction||"").slice(0,10))+'"></div>'+
    "</div>"+
    (existing ? '<p class="faint" style="margin-top:0;">Suspendre ou licencier ne supprime rien : les interventions déjà réalisées par ce technicien restent dans son historique et dans la synthèse mensuelle.</p>' : "");
  const { close } = openModal(existing ? "Modifier le technicien" : "Nouveau technicien", body, {
    wide:true,
    footHtml: '<button class="btn ghost" id="cancel">Annuler</button><button class="btn primary" id="save">Enregistrer</button>',
    onMount(back, close){
      const statutSel = back.querySelector("#f_statut");
      const sanctionRow = back.querySelector("#f_sanction_row");
      statutSel.addEventListener("change", ()=>{
        sanctionRow.style.display = statutSel.value==="actif" ? "none" : "";
      });
      back.querySelector("#cancel").addEventListener("click", close);
      back.querySelector("#save").addEventListener("click", async ()=>{
        const nom = back.querySelector("#f_nom").value.trim();
        if(!nom){ toast("Le nom est obligatoire.", "danger"); return; }
        const statut = statutSel.value;
        const data = {
          nom, metier: back.querySelector("#f_metier").value, telephone: back.querySelector("#f_tel").value.trim(),
          statut,
          motifSanction: statut!=="actif" ? back.querySelector("#f_motif").value.trim() : null,
          dateSanction: statut!=="actif" ? (back.querySelector("#f_date_sanction").value || todayIso()) : null,
        };
        if(existing){
          await state.db.doc("techniciens/"+existing.id).update(data);
          await logAudit(statut==="actif" ? "Réactivation technicien" : (statut==="licencie" ? "Licenciement technicien" : "Suspension technicien"), nom, data.motifSanction||"");
        } else {
          await state.db.collection("techniciens").add(data);
          await logAudit("Création technicien", nom, "");
        }
        close(); toast("Technicien enregistré."); renderView();
      });
    }
  });
}

/* ---- Profil technicien --------------------------------------------------
   Le "profil" demandé n'est pas un compte de connexion : c'est cette fiche,
   qui rassemble tout ce qui atterrit chez ce mécanicien — les OR dont il est
   responsable (assignés dès l'envoi du devis à l'atelier, ou à l'ouverture
   directe d'un OR) et son historique d'interventions déjà facturées. */
VIEWS["technicien-detail"] = async function(view, params){
  const t = await getOne("techniciens", params.id);
  if(!t){ view.innerHTML = '<p class="faint">Technicien introuvable.</p>'; return; }
  const [ordres, vehicules] = await Promise.all([getAll("ordres"), getAll("vehicules")]);
  const mesOR = ordres.filter(o=>o.technicienResponsableId===t.id).sort((a,b)=>new Date(b.dateOuverture)-new Date(a.dateOuverture));
  const orEnCours = mesOR.filter(o=>o.statut==="ouvert");
  const orClotures = mesOR.filter(o=>o.statut==="cloture");

  const interventions = [];
  ordres.forEach(o=>{
    (o.interventions||[]).forEach(i=>{
      if(i.technicienId===t.id) interventions.push({ ...i, orNumero:o.numero, orId:o.id });
    });
  });
  interventions.sort((a,b)=>new Date(b.date)-new Date(a.date));
  const totalMO = interventions.reduce((s,i)=>s+(Number(i.montant)||0),0);

  view.innerHTML =
    '<button class="back-link" id="back">&larr; Retour aux techniciens</button>'+
    '<div class="view-head"><div><h2 style="font-size:1.6rem;">'+esc(t.nom)+'</h2>'+
      '<p class="lede">'+esc(METIERS[t.metier]||t.metier)+(t.telephone?" · "+esc(t.telephone):"")+'</p></div>'+
      '<div class="row-actions">'+pill(t.statut||"actif")+'<button class="btn" id="editTech">Modifier</button></div></div>'+
    (t.statut && t.statut!=="actif" ? '<div class="callout '+(t.statut==="licencie"?"danger":"amber")+'"><span class="lbl">'+esc(TECHNICIEN_STATUTS[t.statut]||t.statut)+'</span><p>'+(t.motifSanction?esc(t.motifSanction):"Aucun motif renseigné.")+(t.dateSanction?" — "+fmtDate(t.dateSanction):"")+'</p></div>' : "")+
    '<div class="kpi-grid">'+
      '<div class="kpi"><div class="lbl">OR en cours (responsable)</div><div class="val">'+orEnCours.length+'</div></div>'+
      '<div class="kpi"><div class="lbl">OR clôturés (responsable)</div><div class="val">'+orClotures.length+'</div></div>'+
      '<div class="kpi"><div class="lbl">Total main d\'œuvre facturée</div><div class="val">'+fmtMoney(totalMO)+'</div><div class="sub">'+interventions.length+' intervention(s), toutes périodes</div></div>'+
    "</div>"+
    '<h3 class="section-title">OR dont il est responsable</h3>'+
    '<div class="table-wrap"><table class="grid"><thead><tr><th>N°</th><th>Véhicule</th><th>Ouverture</th><th>Statut</th></tr></thead><tbody>'+
      (mesOR.length ? mesOR.map(o=>{
        const veh = vehicules.find(v=>v.id===o.vehiculeId);
        return '<tr class="clickable" data-or="'+o.id+'"><td class="mono">'+esc(o.numero)+'</td><td class="mono">'+esc(veh?veh.immatriculation:"—")+'</td><td>'+fmtDate(o.dateOuverture)+'</td><td>'+pill(o.statut)+"</td></tr>";
      }).join("") : '<tr class="empty-row"><td colspan="4">Aucun OR assigné à ce technicien pour le moment.</td></tr>')+
    "</tbody></table></div>"+
    '<h3 class="section-title">Interventions récentes</h3>'+
    '<div class="table-wrap"><table class="grid"><thead><tr><th>Date</th><th>OR</th><th>Description</th><th class="num">Montant</th></tr></thead><tbody>'+
      (interventions.length ? interventions.slice(0,25).map(i=>
        '<tr class="clickable" data-or="'+i.orId+'"><td>'+fmtDate(i.date)+'</td><td class="mono">'+esc(i.orNumero)+'</td><td>'+esc(i.description)+'</td><td class="num mono">'+fmtMoney(i.montant)+"</td></tr>"
      ).join("") : '<tr class="empty-row"><td colspan="4">Aucune intervention enregistrée.</td></tr>')+
    "</tbody></table></div>";

  view.querySelector("#back").addEventListener("click", ()=>setView("techniciens"));
  view.querySelector("#editTech").addEventListener("click", ()=>openTechnicienForm(t));
  view.querySelectorAll("[data-or]").forEach(tr=>tr.addEventListener("click", ()=>setView("atelier-detail",{id:tr.getAttribute("data-or")})));
};

/* ---- Comptage de stock -------------------------------------------------- */
VIEWS.comptage = async function(view){
  const articles = await getAll("articles");
  view.innerHTML =
    '<div class="view-head"><div><p class="lede">Comptage tournant : saisissez la quantité physique trouvée, les écarts sont mis en évidence avant validation.</p></div></div>'+
    '<div class="callout"><span class="lbl">Principe</span><p>Aucun ajustement n\'est appliqué tant que le comptage n\'est pas validé — et seul un administrateur peut valider un écart.</p></div>'+
    '<div class="toolbar"><input type="search" id="cptSearch" placeholder="Rechercher une référence…"></div>'+
    '<div class="table-wrap"><table class="grid"><thead><tr><th>Référence</th><th class="num">Stock théorique</th><th class="num">Quantité comptée</th><th class="num">Écart</th></tr></thead><tbody id="tb"></tbody></table></div>'+
    '<button class="btn primary" id="validate">Valider le comptage</button>';
  document.getElementById("tb").innerHTML = articles.map(a=>
    '<tr data-row="'+a.id+'"><td>'+esc(a.reference)+" — "+esc(a.designation)+'</td><td class="num mono">'+(a.stockQte||0)+'</td>'+
    '<td class="num"><input type="number" data-count="'+a.id+'" value="'+(a.stockQte||0)+'" style="width:90px;"></td>'+
    '<td class="num mono" data-ecart="'+a.id+'">0</td></tr>'
  ).join("");
  document.getElementById("cptSearch").addEventListener("input", (e)=>{
    const t = e.target.value.toLowerCase();
    document.querySelectorAll("[data-row]").forEach(tr=>{
      const a = articles.find(x=>x.id===tr.getAttribute("data-row"));
      tr.style.display = (!t || (a.reference||"").toLowerCase().includes(t) || (a.designation||"").toLowerCase().includes(t)) ? "" : "none";
    });
  });
  document.querySelectorAll("[data-count]").forEach(inp=>{
    inp.addEventListener("input", ()=>{
      const id = inp.getAttribute("data-count");
      const a = articles.find(x=>x.id===id);
      const ecart = Number(inp.value) - (a.stockQte||0);
      const cell = document.querySelector('[data-ecart="'+id+'"]');
      cell.textContent = (ecart>0?"+":"")+ecart;
      cell.style.color = ecart!==0 ? "var(--danger)" : "var(--ink-muted)";
    });
  });
  document.getElementById("validate").addEventListener("click", async ()=>{
    if(!isAdmin()){ toast("Seul un administrateur peut valider un comptage.", "danger"); return; }
    const lignes = [];
    let ecartsCount = 0;
    document.querySelectorAll("[data-count]").forEach(inp=>{
      const id = inp.getAttribute("data-count");
      const a = articles.find(x=>x.id===id);
      const compte = Number(inp.value)||0;
      const ecart = compte - (a.stockQte||0);
      if(ecart!==0) ecartsCount++;
      lignes.push({ articleId:id, reference:a.reference, stockTheorique:a.stockQte||0, stockCompte:compte, ecart });
    });
    const ok = await askConfirm(ecartsCount+" écart(s) détecté(s). Valider et ajuster le stock en conséquence ?", "Valider");
    if(!ok) return;
    for(const l of lignes){
      if(l.ecart!==0) await ajusterStock(l.articleId, l.ecart, "ajustement", "comptage", "—", "Comptage du "+fmtDate(todayIso()));
    }
    await state.db.collection("comptages").add({ date: todayIso(), statut:"valide", lignes, validePar: actingUserName(), dateValidation: todayIso() });
    await logAudit("Validation comptage", "", ecartsCount+" écart(s)");
    toast("Comptage validé, stock ajusté."); renderView();
  });
};

    const devise = document.getElementById("f_devise").value.trim() || "FCFA";
    const entreprise = document.getElementById("f_entreprise").value.trim();
    const capaciteAtelier = Number(document.getElementById("f_capacite").value)||5;
    await state.db.doc("config/general").set({ devise, entreprise, capaciteAtelier });

};

/* ---- Réinitialisation complète (admin) ---------------------------------
   Vide les tables d'exploitation via la fonction Postgres reset_all_data()
   (security definer, réservée aux admins) plutôt que des suppressions
   ligne par ligne côté client : plus rapide (une seule requête même avec
   des centaines de véhicules) et atomique. La confirmation demande de
   retaper un mot précis pour éviter un clic accidentel sur une action
   irréversible. */
function openResetConfirm(){
  const body =
    '<div class="callout danger"><span class="lbl">Action irréversible</span><p>Toutes les données suivantes seront supprimées définitivement : véhicules, stock/catalogue, fournisseurs, commandes, devis, ordres de réparation, factures, mouvements de stock, comptages et journal d\'activité. Les numéros de documents repartiront de 1.</p></div>'+
    '<p class="muted">Ne sont <b>pas</b> supprimés : les comptes utilisateurs, les fiches techniciens et les paramètres généraux (nom de l\'entreprise, devise, capacité atelier).</p>'+
    '<div class="field"><label>Tapez <span class="mono">REINITIALISER</span> pour confirmer</label><input id="f_confirm" autocomplete="off" placeholder="REINITIALISER"></div>';
  const { close } = openModal("Réinitialiser l'application", body, {
    footHtml: '<button class="btn ghost" id="cancel">Annuler</button><button class="btn danger" id="doReset" disabled>Réinitialiser définitivement</button>',
    onMount(back, close){
      const input = back.querySelector("#f_confirm");
      const btn = back.querySelector("#doReset");
      input.addEventListener("input", ()=>{ btn.disabled = input.value.trim().toUpperCase()!=="REINITIALISER"; });
      back.querySelector("#cancel").addEventListener("click", close);
      btn.addEventListener("click", async ()=>{
        btn.disabled = true; btn.textContent = "Réinitialisation en cours…";
        try{
          const { error } = await sb.rpc("reset_all_data", {});
          if(error) throw error;
        }catch(e){
          toast("Erreur : "+describeError(e), "danger");
          btn.disabled = false; btn.textContent = "Réinitialiser définitivement";
          return;
        }
        await logAudit("Réinitialisation complète des données", "", "");
        close();
        toast("Application réinitialisée.");
        setView("dashboard");
      });
    }
  });
}

function openUtilisateurForm(existing){
  const u = existing || { role:"agent", tabs: DEFAULT_AGENT_TABS, active:true };
  const tabsHtml = ASSIGNABLE_TABS.map(key=>{
    const label = (NAV.find(n=>n.key===key)||{}).label || key;
    return '<label><input type="checkbox" value="'+key+'" '+((u.tabs||[]).includes(key)?"checked":"")+'> '+esc(label)+'</label>';
  }).join("");
  const body =
    (existing ? "" : '<div class="callout"><span class="lbl">Étape 1</span><p>Crée d\'abord le compte de connexion dans Supabase : <b>Authentication → Users → Add user</b>. Mets un email au format <span class="mono">identifiant@cambouis.local</span> (ex. <span class="mono">jkouassi@cambouis.local</span>), coche <b>Auto Confirm User</b>, choisis un mot de passe et donne-le à la personne concernée. Copie ensuite le <b>User UID</b> généré et colle-le ci-dessous.</p></div>')+
    '<div class="field-row" style="grid-template-columns:1fr 1fr;">'+
      '<div class="field"><label>Nom</label><input id="f_nom" value="'+esc(u.nom||"")+'"></div>'+
      '<div class="field"><label>Identifiant</label><input id="f_ident" value="'+esc(u.identifiant||"")+'" placeholder="ex. jkouassi" autocomplete="off" '+(existing?"disabled":"")+'></div>'+
    '</div>'+
    (existing ? "" : '<div class="field"><label>User UID Supabase</label><input id="f_uid" placeholder="ex. af546bdc-ada8-47b4-81c8-819236e9d252" autocomplete="off"></div>')+
    '<div class="field-row" style="grid-template-columns:1fr 1fr;">'+
      '<div class="field"><label>Rôle</label><select id="f_role">'+
        Object.entries(ROLES).map(([k,v])=>'<option value="'+k+'" '+(u.role===k?"selected":"")+'>'+v+"</option>").join("")+
      "</select></div>"+
      (existing ? '<div class="field"><label>Statut</label><label class="checkbox-row" style="margin-top:9px;"><input type="checkbox" id="f_active" '+(u.active!==false?"checked":"")+'> Compte actif (décochez pour révoquer)</label></div>' : '<div></div>')+
    "</div>"+
    '<div class="field" id="tabsField"><label>Onglets accessibles (agent uniquement — un administrateur voit tout)</label><div class="tabs-grid">'+tabsHtml+'</div></div>'+
    (existing ? '<p class="faint" style="margin-top:10px;">Pour changer le mot de passe de ce compte, fais-le dans Supabase : Authentication → Users → (le compte) → Reset password.</p>' : "");
  const { close } = openModal(existing ? "Modifier le compte" : "Nouvel utilisateur", body, {
    wide:true,
    footHtml: '<button class="btn ghost" id="cancel">Annuler</button><button class="btn primary" id="save">Enregistrer</button>',
    onMount(back, close){
      const roleSel = back.querySelector("#f_role");
      const tabsField = back.querySelector("#tabsField");
      function syncTabsVisibility(){ tabsField.style.display = roleSel.value==="admin" ? "none" : ""; }
      syncTabsVisibility();
      roleSel.addEventListener("change", syncTabsVisibility);
      back.querySelector("#cancel").addEventListener("click", close);
      back.querySelector("#save").addEventListener("click", async ()=>{
        const nom = back.querySelector("#f_nom").value.trim();
        const identifiant = back.querySelector("#f_ident").value.trim().toLowerCase();
        if(!nom){ toast("Le nom est obligatoire.", "danger"); return; }
        if(!/^[a-z0-9._-]{3,20}$/.test(identifiant)){ toast("L'identifiant doit contenir 3 à 20 caractères (lettres, chiffres, . _ -).", "danger"); return; }
        const role = roleSel.value;
        const tabs = Array.from(back.querySelectorAll('#tabsField input[type=checkbox]:checked')).map(c=>c.value);
        const data = { nom, identifiant, role, tabs };
        if(existing){
          const activeInput = back.querySelector("#f_active");
          data.active = activeInput.checked;
          if(existing.id===state.actingUser.id && role!=="admin"){ toast("Vous ne pouvez pas retirer votre propre statut administrateur.", "danger"); return; }
          if(existing.id===state.actingUser.id && !activeInput.checked){ toast("Vous ne pouvez pas révoquer votre propre compte.", "danger"); return; }
          try{
            await state.db.doc("utilisateurs/"+existing.id).update(data);
          }catch(e){ toast("Erreur : "+e.message, "danger"); return; }
          await logAudit("Modification compte", nom, role);
        } else {
          const uid = back.querySelector("#f_uid").value.trim();
          if(!/^[0-9a-f-]{20,40}$/i.test(uid)){ toast("Colle le User UID Supabase du compte créé à l'étape 1.", "danger"); return; }
          data.active = true;
          try{
            await state.db.doc("utilisateurs/"+uid).set(data);
          }catch(e){ toast("Erreur : "+e.message+" — vérifie que le UID est correct et que l'identifiant n'est pas déjà pris.", "danger"); return; }
          await logAudit("Création compte", nom, role);
        }
        close(); toast("Compte enregistré."); renderView();
      });
    }
  });
}

/* ---------------------------------------------------------------- session
   Real authentication now: Supabase Auth holds the password (hashed,
   server-side), identified internally by "<identifiant>@cambouis.local"
   since Supabase's auth system is email-shaped and staff don't need a
   real inbox. The `profiles` row (role, tabs, active) is looked up right
   after sign-in and re-checked live via Realtime, so an admin revoking a
   session in Paramètres logs that person out within seconds. */
let profileChannel = null;
function showApp(){
  document.getElementById("loginScreen").hidden = true;
  document.getElementById("loginScreen").innerHTML = "";
  document.getElementById("app").hidden = false;
}
function showLogin(message){
  if(profileChannel){ sb.removeChannel(profileChannel); profileChannel = null; }
  document.getElementById("app").hidden = true;
  document.getElementById("loginScreen").hidden = false;
  renderLoginScreen(message);
}
async function logout(message){
  if(profileChannel){ sb.removeChannel(profileChannel); profileChannel = null; }
  state.actingUser = null;
  try{ await sb.auth.signOut(); }catch(e){}
  showLogin(message);
}
function watchProfile(userId){
  if(profileChannel) sb.removeChannel(profileChannel);
  profileChannel = sb.channel("profile-"+userId)
    .on("postgres_changes", { event:"*", schema:"public", table:"profiles", filter:"id=eq."+userId }, (payload)=>{
      if(payload.eventType === "DELETE" || payload.new.active===false){
        logout("Votre accès a été révoqué par un administrateur.");
        return;
      }
      state.actingUser = rowToCamel(payload.new);
      renderNav();
      renderTopbarUser();
    })
    .subscribe();
}
function renderTopbarUser(){
  const box = document.getElementById("topbarUser");
  if(!state.actingUser){ box.innerHTML = ""; return; }
  box.innerHTML =
    '<span class="topbar-user"><span class="name">'+esc(state.actingUser.nom)+'</span>'+
    '<span class="rolebadge '+esc(state.actingUser.role)+'">'+esc(ROLES[state.actingUser.role]||state.actingUser.role)+'</span>'+
    '<button class="btn small ghost" id="logoutBtn">Déconnexion</button></span>';
  box.querySelector("#logoutBtn").addEventListener("click", ()=> logout());
}
async function enterApp(authUser){
  const profile = await getOne("utilisateurs", authUser.id);
  if(!profile || profile.active===false){
    await logout("Ce compte n'a pas (ou plus) accès à PartsFlow. Contactez un administrateur.");
    return;
  }
  state.actingUser = profile;
  watchProfile(authUser.id);
  showApp();
  renderTopbarUser();
  const hash = location.hash.replace("#","");
  const [name, id] = hash.split("/");
  const initial = (NAV.find(n=>n.key===name) && hasTab(name)) ? name : (NAV.find(n=>hasTab(n.key))||{key:"dashboard"}).key;
  state.view = { name: initial, params: id ? {id} : {} };
  renderNav();
  await renderView();
}
function renderLoginScreen(message){
  const screen = document.getElementById("loginScreen");
  screen.innerHTML =
    '<div class="login-card">'+
      '<div class="brand" style="justify-content:center;"><span class="mark"></span><span>PartsFlow</span></div>'+
      '<div class="brand-sub">Connexion</div>'+
      (message ? '<div class="login-msg">'+esc(message)+'</div>' : '')+
      '<div class="field"><label>Identifiant</label><input id="loginId" autocomplete="username" autofocus></div>'+
      '<div class="field"><label>Mot de passe</label><input id="loginPw" type="password" autocomplete="current-password"></div>'+
      '<div class="login-error" id="loginErr" hidden></div>'+
      '<button class="btn primary" id="loginBtn" style="width:100%; margin-top:6px;">Se connecter</button>'+
    '</div>';
  const idInput = screen.querySelector("#loginId");
  const pwInput = screen.querySelector("#loginPw");
  const err = screen.querySelector("#loginErr");
  idInput.focus();
  async function attempt(){
    const identifiant = idInput.value.trim().toLowerCase();
    const password = pwInput.value;
    if(!identifiant || !password) return;
    err.hidden = true;
    const { data, error } = await sb.auth.signInWithPassword({ email: identifiant + AUTH_EMAIL_DOMAIN, password });
    if(error || !data.user){
      err.hidden = false; err.textContent = "Identifiant ou mot de passe incorrect.";
      pwInput.value = ""; pwInput.focus();
      return;
    }
    try{
      await enterApp(data.user);
    }catch(e){
      console.error(e);
      err.hidden = false; err.textContent = "Erreur après connexion : " + (e.message||e);
    }
  }
  screen.querySelector("#loginBtn").addEventListener("click", attempt);
  pwInput.addEventListener("keydown", e=>{ if(e.key==="Enter") attempt(); });
  idInput.addEventListener("keydown", e=>{ if(e.key==="Enter") pwInput.focus(); });
}

/* -------------------------------------------------------------- bootstrap */
async function init(){
  state.db = makeDbShim(sb);
  try{
    const cfg = await getOne("config","general");
    if(cfg && cfg.devise) state.config.devise = cfg.devise;
    if(cfg && cfg.entreprise) state.config.entreprise = cfg.entreprise;
    if(cfg && cfg.capaciteAtelier!=null) state.config.capaciteAtelier = cfg.capaciteAtelier;
  }catch(e){ /* config falls back to defaults, non-blocking */ }

  const { data: { session } } = await sb.auth.getSession();
  if(session && session.user){
    try{
      await enterApp(session.user);
    }catch(e){
      showFatalError("init/enterApp", e);
      showLogin("Erreur au chargement : " + (e.message||e));
    }
  } else {
    showLogin();
  }
}
init().catch(e=> showFatalError("init", e));
})();
</script>
