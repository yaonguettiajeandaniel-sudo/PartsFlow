    onMount(back, close){
      const statutSel = back.querySelector("#f_statut");
      const inactRow = back.querySelector("#f_inactivite_row");
      const sinRow = back.querySelector("#f_sinistre_row");
      const sinRow2 = back.querySelector("#f_sinistre_row2");
      function syncRows(){
        inactRow.style.display = ETATS_A_LA_BASE.includes(statutSel.value) ? "" : "none";
        sinRow.style.display = sinRow2.style.display = statutSel.value==="sinistre" ? "" : "none";
      }
      statutSel.addEventListener("change", syncRows);
      back.querySelector("#cancel").addEventListener("click", close);
      back.querySelector("#save").addEventListener("click", async ()=>{
        const immat = back.querySelector("#f_immat").value.trim().toUpperCase();
        if(!immat){ toast("L'immatriculation est obligatoire.", "danger"); return; }
        const nouveauStatut = statutSel.value;
        if(ETATS_A_LA_BASE.includes(nouveauStatut) && !back.querySelector("#f_motif").value){
          toast("Choisissez un motif de présence à la base.", "danger"); return;
        }
        if(nouveauStatut==="sinistre" && (!back.querySelector("#f_assureur").value.trim() || !back.querySelector("#f_garage").value.trim())){
          toast("Renseignez l'assureur et le garage destinataire.", "danger"); return;
        }
        const data = {
          immatriculation: immat,
          statut: nouveauStatut,
          marque: back.querySelector("#f_marque").value.trim(),
          modele: back.querySelector("#f_modele").value.trim(),
          groupe: back.querySelector("#f_groupe").value.trim(),
          type: back.querySelector("#f_type").value.trim(),
          contrat: back.querySelector("#f_contrat").value.trim(),
          chauffeurNom: back.querySelector("#f_chauffeur").value.trim(),
          chauffeurTelephone: back.querySelector("#f_tel").value.trim(),
        };
        if(ETATS_A_LA_BASE.includes(nouveauStatut)){
          data.motifInactivite = back.querySelector("#f_motif").value;
          data.detailInactivite = back.querySelector("#f_detail").value.trim();
        } else {
          data.motifInactivite = null;
          data.detailInactivite = null;
        }
        if(nouveauStatut==="sinistre"){
          data.sinistreAssureur = back.querySelector("#f_assureur").value.trim();
          data.sinistreGarage = back.querySelector("#f_garage").value.trim();
          data.sinistreDate = back.querySelector("#f_datesinistre").value || todayIso();
          data.sinistreRetourEstime = back.querySelector("#f_retourestime").value || null;
        } else {
          data.sinistreAssureur = null; data.sinistreGarage = null;
          data.sinistreDate = null; data.sinistreRetourEstime = null;
        }
        // Track "depuis quand à la base" pour le dossier de prise en charge —
        // stampé au moment où le véhicule entre en Entrée/Inactif, effacé à la
        // sortie ; inchangé lors d'une simple escalade Entrée→Inactif (le
        // véhicule n'a jamais quitté la base entre les deux).
        const etaitALaBase = existing && ETATS_A_LA_BASE.includes(existing.statut);
        const estALaBase = ETATS_A_LA_BASE.includes(nouveauStatut);
        const entreeEnBase = estALaBase && !etaitALaBase;
        const sortieDeLaBase = etaitALaBase && !estALaBase;
        if(entreeEnBase) data.immobiliseDepuis = todayIso();
        if(!estALaBase) data.immobiliseDepuis = null;
        // Dossier de prise en charge (signalement → diagnostic) : ouvert au moment
        // où le véhicule entre à la base ("fiche de réception" remplie ici
        // même si c'est un agent qui saisit ce que le chauffeur a constaté),
        // effacé dès qu'on en sort.
        if(entreeEnBase){
          data.etapePriseEnCharge = "signale";
          data.receptionPar = actingUserName();
          data.receptionDate = todayIso();
          data.diagnosticTechnicienId = null; data.diagnosticTechnicienNom = null;
          data.diagnosticAssigneDate = null; data.diagnosticConfirme = null; data.diagnosticConfirmeDate = null;
        } else if(!estALaBase){
          data.etapePriseEnCharge = null; data.receptionPar = null; data.receptionDate = null;
          data.diagnosticTechnicienId = null; data.diagnosticTechnicienNom = null;
          data.diagnosticAssigneDate = null; data.diagnosticConfirme = null; data.diagnosticConfirmeDate = null;
        }
        let vehiculeId = existing ? existing.id : null;
        if(existing){
          await state.db.doc("vehicules/"+existing.id).update(data);
          await logAudit("Modification véhicule", immat, "");
        } else {
          data.createdAt = todayIso();
          const ref = await state.db.collection("vehicules").add(data);
          vehiculeId = ref.id;
          await logAudit("Création véhicule", immat, "");
        }
        if(entreeEnBase) await ouvrirHistoriqueImmobilisation(vehiculeId, data.motifInactivite, data.detailInactivite);
        else if(sortieDeLaBase) await clorreHistoriqueImmobilisation(vehiculeId);
        close();
        toast("Véhicule enregistré.");
        renderView();
      });
    }
  });
}

/* ---- Fiche de réception ---------------------------------------------------
   Le formulaire dédié à l'agent qui accueille le chauffeur : plus léger que
   la fiche véhicule complète (pas de marque/modèle/contrat à toucher), il ne
   demande que ce qui compte à cet instant précis — quel véhicule, pourquoi,
   et ce que le chauffeur a constaté. Valider ouvre le dossier de prise en
   charge (étape "Signalé") exactement comme le ferait la fiche véhicule. */
function openReceptionForm(vehicules){
  const body =
    '<div class="field"><label>Véhicule</label><div id="vehSlot"></div></div>'+
    '<div id="vehWarn"></div>'+
    '<div class="field"><label>Motif</label><select id="f_motif">'+
      '<option value="">— à préciser —</option>'+
      Object.entries(MOTIFS_INACTIVITE).map(([k,l])=>'<option value="'+k+'">'+l+"</option>").join("")+
    "</select></div>"+
    '<div class="field"><label>Constat du chauffeur</label><textarea id="f_constat" rows="3" placeholder="ce que le chauffeur a signalé — ex. bruit au freinage, voyant moteur allumé…"></textarea></div>';
  const { close } = openModal("Réception d'un véhicule", body, {
    footHtml: '<button class="btn ghost" id="cancel">Annuler</button><button class="btn primary" id="save">Enregistrer la réception</button>',
    onMount(back, close){
      let vehiculeChoisi = null;
      const saveBtn = back.querySelector("#save");
      const warnBox = back.querySelector("#vehWarn");
      mountSearchableSelect(back.querySelector("#vehSlot"), {
        items: vehicules, getId:v=>v.id, getLabel:v=>v.immatriculation+" — "+(v.chauffeurNom||""), placeholder:"Rechercher une immatriculation…",
        onChange:(id)=>{
          vehiculeChoisi = vehicules.find(v=>v.id===id) || null;
          if(vehiculeChoisi && (vehiculeChoisi.statut==="entree" || vehiculeChoisi.statut==="immobilise" || vehiculeChoisi.statut==="sinistre")){
            warnBox.innerHTML = '<div class="callout amber"><span class="lbl">Déjà en cours</span><p>'+esc(vehiculeChoisi.immatriculation)+' est déjà '+(vehiculeChoisi.statut==="sinistre"?"marqué sinistré":"en cours de prise en charge")+'. <a href="#" id="goVeh">Voir sa fiche</a> plutôt que d\'ouvrir un nouveau signalement.</p></div>';
            saveBtn.disabled = true;
            const goLink = warnBox.querySelector("#goVeh");
            if(goLink) goLink.addEventListener("click", (e)=>{ e.preventDefault(); close(); setView("vehicule-detail",{id:vehiculeChoisi.id}); });
          } else {
            warnBox.innerHTML = "";
            saveBtn.disabled = false;
          }
        }
      });
      back.querySelector("#cancel").addEventListener("click", close);
      saveBtn.addEventListener("click", async ()=>{
        if(!vehiculeChoisi){ toast("Choisissez un véhicule.", "danger"); return; }
        const motif = back.querySelector("#f_motif").value;
        if(!motif){ toast("Choisissez un motif.", "danger"); return; }
        const constat = back.querySelector("#f_constat").value.trim();
        await state.db.doc("vehicules/"+vehiculeChoisi.id).update({
          statut:"entree", motifInactivite: motif, detailInactivite: constat,
          immobiliseDepuis: todayIso(),
          etapePriseEnCharge:"signale", receptionPar: actingUserName(), receptionDate: todayIso(),
          diagnosticTechnicienId:null, diagnosticTechnicienNom:null, diagnosticAssigneDate:null,
          diagnosticConfirme:null, diagnosticConfirmeDate:null
        });
        await ouvrirHistoriqueImmobilisation(vehiculeChoisi.id, motif, constat);
        await logAudit("Réception véhicule", vehiculeChoisi.immatriculation, motif);
        close();
        toast("Réception enregistrée — "+vehiculeChoisi.immatriculation+" entré à la base.");
        setView("vehicule-detail",{id:vehiculeChoisi.id});
      });
    }
  });
}

function openDiagnosticAssignerForm(v, techniciens){
  const body =
    '<div class="field"><label>Technicien assigné pour le diagnostic</label><div id="techSlot"></div></div>'+
    '<div class="field"><label>Diagnostic confirmé (si déjà fait)</label><textarea id="f_diag" rows="3" placeholder="Laissez vide si le mécanicien doit encore examiner le véhicule"></textarea></div>';
  const { close } = openModal("Diagnostic — "+v.immatriculation, body, {
    footHtml: '<button class="btn ghost" id="cancel">Annuler</button><button class="btn primary" id="save">Enregistrer</button>',
    onMount(back, close){
      const techPicker = mountSearchableSelect(back.querySelector("#techSlot"), {
        items: techniciens, getId:t=>t.id, getLabel:technicienLabel, placeholder:"Rechercher un technicien…"
      });
      back.querySelector("#cancel").addEventListener("click", close);
      back.querySelector("#save").addEventListener("click", async ()=>{
        const tech = techniciens.find(t=>t.id===techPicker.getValue());
        if(!tech){ toast("Choisissez un technicien.", "danger"); return; }
        const diagnostic = back.querySelector("#f_diag").value.trim();
        const data = {
          diagnosticTechnicienId: tech.id, diagnosticTechnicienNom: tech.nom, diagnosticAssigneDate: todayIso(),
        };
        if(diagnostic){
          data.etapePriseEnCharge = "diagnostic_confirme";
          data.diagnosticConfirme = diagnostic;
          data.diagnosticConfirmeDate = todayIso();
        } else {
          data.etapePriseEnCharge = "diagnostic_en_cours";
        }
        await state.db.doc("vehicules/"+v.id).update(data);
        await logAudit("Diagnostic assigné", v.immatriculation, tech.nom);
        close(); toast("Diagnostic mis à jour."); renderView();
      });
    }
  });
}

function openDiagnosticConfirmerForm(v){
  const body =
    '<div class="field"><label>Diagnostic confirmé</label><textarea id="f_diag" rows="4" placeholder="Réparations à effectuer, confirmées après examen du véhicule">'+esc(v.diagnosticConfirme||"")+'</textarea></div>'+
    '<div class="field"><label>Pièces suspectées (facultatif — préremplira le devis)</label>'+
      '<div class="field-row" style="grid-template-columns:2fr 1fr auto;align-items:end;">'+
        '<div class="field" style="margin-bottom:0;"><div id="artSlot"></div></div>'+
        '<div class="field" style="margin-bottom:0;"><input id="f_qte" type="number" value="1" min="1" placeholder="Qté"></div>'+
        '<button type="button" class="btn small" id="addPieceDiag">+ Ajouter</button>'+
      "</div>"+
      '<div id="piecesListe" style="margin-top:8px;"></div>'+
    "</div>";
  const { close } = openModal("Confirmer le diagnostic — "+v.immatriculation, body, {
    wide:true,
    footHtml: '<button class="btn ghost" id="cancel">Annuler</button><button class="btn primary" id="save">Confirmer</button>',
    async onMount(back, close){
      const articles = await getAll("articles");
      let pieces = (v.diagnosticPiecesSuggerees||[]).slice();
      const artPicker = mountSearchableSelect(back.querySelector("#artSlot"), {
        items: articles, getId:a=>a.id, getLabel:a=>a.reference+" — "+a.designation, placeholder:"Rechercher une pièce du catalogue…"
      });
      function drawPieces(){
        back.querySelector("#piecesListe").innerHTML = pieces.length
          ? '<ul style="margin:0;padding-left:18px;">'+pieces.map((p,i)=>
              '<li>'+esc(p.reference)+" — "+esc(p.designation)+" (x"+p.quantite+') <button type="button" class="btn small ghost" data-rm="'+i+'" style="padding:1px 6px;">Retirer</button></li>'
            ).join("")+"</ul>"
          : '<p class="faint" style="margin:0;">Aucune pièce ajoutée.</p>';
        back.querySelectorAll("[data-rm]").forEach(b=>b.addEventListener("click", ()=>{ pieces.splice(Number(b.getAttribute("data-rm")),1); drawPieces(); }));
      }
      drawPieces();
      back.querySelector("#addPieceDiag").addEventListener("click", ()=>{
        const art = articles.find(a=>a.id===artPicker.getValue());
        if(!art){ toast("Choisissez une pièce.", "danger"); return; }
        const quantite = Number(back.querySelector("#f_qte").value)||1;
        pieces.push({ articleId:art.id, reference:art.reference, designation:art.designation, quantite });
        drawPieces();
      });
      back.querySelector("#cancel").addEventListener("click", close);
      back.querySelector("#save").addEventListener("click", async ()=>{
        const diagnostic = back.querySelector("#f_diag").value.trim();
        if(!diagnostic){ toast("Décrivez le diagnostic.", "danger"); return; }
        await state.db.doc("vehicules/"+v.id).update({
          etapePriseEnCharge: "diagnostic_confirme", diagnosticConfirme: diagnostic, diagnosticConfirmeDate: todayIso(),
          diagnosticPiecesSuggerees: pieces,
        });
        await logAudit("Diagnostic confirmé", v.immatriculation, pieces.length ? pieces.length+" pièce(s) suggérée(s)" : "");
        close(); toast("Diagnostic confirmé."); renderView();
      });
    }
  });
}

VIEWS["vehicule-detail"] = async function(view, params){
  const v = await getOne("vehicules", params.id);
  if(!v){ view.innerHTML = '<p class="faint">Véhicule introuvable.</p>'; return; }
  const [factures, ordres, historique] = await Promise.all([getAll("factures"), getAll("ordres"), getAll("historique_immobilisations")]);
  const mesFactures = factures.filter(f=>f.vehiculeId===v.id).sort((a,b)=> new Date(b.date)-new Date(a.date));
  const mesOR = ordres.filter(o=>o.vehiculeId===v.id).sort((a,b)=> new Date(b.dateOuverture)-new Date(a.dateOuverture));
  const monHistorique = historique.filter(h=>h.vehiculeId===v.id).sort((a,b)=> new Date(b.dateEntree)-new Date(a.dateEntree));
  const facturesActives = mesFactures.filter(f=>f.statutPaiement!=="annulee");
  const totalDepenses = facturesActives.reduce((s,f)=>s+(f.montantTotal||0),0);
  const totalRegle = facturesActives.reduce((s,f)=>s+(f.montantRegle||0),0);
  const totalDu = Math.max(0, totalDepenses-totalRegle);

  view.innerHTML =
    '<button class="back-link" id="back">&larr; Retour aux véhicules</button>'+
    '<div class="view-head"><div><h2 style="font-size:1.6rem;">'+esc(v.immatriculation)+'</h2>'+
      '<p class="lede">'+esc(v.marque)+" "+esc(v.modele)+(v.type?" · "+esc(v.type):"")+" · Chauffeur : "+esc(v.chauffeurNom||"non renseigné")+"</p></div>"+
      '<div class="row-actions"><button class="btn" id="editVeh">Modifier</button>'+(ETATS_A_LA_BASE.includes(v.statut) ? '<button class="btn" id="sortieVeh">Sortie</button>' : "")+(v.statut==="immobilise" ? '<button class="btn danger" id="cmdUrgente">Commande urgente</button>' : "")+'</div></div>'+
    '<div class="kpi-grid">'+
      '<div class="kpi"><div class="lbl">Statut</div><div class="val" style="font-size:1.1rem;">'+pill(v.statut||"actif")+'</div></div>'+
      '<div class="kpi"><div class="lbl">Groupe / Contrat</div><div class="val" style="font-size:1.1rem;">'+esc(v.groupe||"—")+' / '+esc(v.contrat||"—")+'</div></div>'+
      '<div class="kpi"><div class="lbl">Dépenses totales</div><div class="val">'+fmtMoney(totalDepenses)+'</div><div class="sub">pièces + main d\'œuvre</div></div>'+
      '<div class="kpi"><div class="lbl">Réglé à ce jour</div><div class="val">'+fmtMoney(totalRegle)+'</div></div>'+
      '<div class="kpi"><div class="lbl">Montant dû</div><div class="val '+(totalDu>0?"danger":"")+'">'+fmtMoney(totalDu)+'</div></div>'+
    "</div>"+
    (ETATS_A_LA_BASE.includes(v.statut) ?
      '<div class="callout '+(v.statut==="immobilise"?"danger":"amber")+'"><span class="lbl">'+(v.statut==="immobilise"?"Inactif":"Entrée")+' — '+esc(MOTIFS_INACTIVITE[v.motifInactivite]||v.motifInactivite||"motif non précisé")+'</span><p>'+esc(v.detailInactivite||"Aucun constat renseigné.")+(v.receptionPar?" — signalé par "+esc(v.receptionPar)+(v.receptionDate?" le "+fmtDate(v.receptionDate):""):"")+'</p></div>'
    : "")+
    (ETATS_A_LA_BASE.includes(v.statut) ? renderDiagnosticCard(v) : "")+
    (v.statut==="sinistre" ?
      '<div class="callout"><span class="lbl">Sinistré — pris en charge par un autre garage</span>'+
        '<p>Assureur : <b>'+esc(v.sinistreAssureur||"—")+'</b> · Garage : <b>'+esc(v.sinistreGarage||"—")+'</b>'+
        (v.sinistreDate?" · Depuis le "+fmtDate(v.sinistreDate):"")+(v.sinistreRetourEstime?" · Retour estimé le "+fmtDate(v.sinistreRetourEstime):"")+
      '</p></div>'
    : "")+
    '<h3 class="section-title">Factures</h3>'+
    '<div class="table-wrap"><table class="grid"><thead><tr><th>N°</th><th>Date</th><th class="num">Total</th><th class="num">Réglé</th><th class="num">Reste dû</th><th>Statut</th></tr></thead><tbody>'+
      (mesFactures.length ? mesFactures.map(f=>{
        const reste = Math.max(0,(f.montantTotal||0)-(f.montantRegle||0));
        return '<tr class="clickable" data-f="'+f.id+'"><td class="mono">'+esc(f.numero)+'</td><td>'+fmtDate(f.date)+'</td><td class="num mono">'+fmtMoney(f.montantTotal)+'</td><td class="num mono">'+fmtMoney(f.montantRegle)+'</td><td class="num mono">'+fmtMoney(reste)+'</td><td>'+pill(f.statutPaiement)+"</td></tr>";
      }).join("") : '<tr class="empty-row"><td colspan="6">Aucune facture pour ce véhicule.</td></tr>')+
    "</tbody></table></div>"+
    '<h3 class="section-title">Ordres de réparation</h3>'+
    '<div class="table-wrap"><table class="grid"><thead><tr><th>N°</th><th>Ouverture</th><th>Statut</th><th class="num">Pièces</th><th class="num">Interventions</th></tr></thead><tbody>'+
      (mesOR.length ? mesOR.map(o=>
        '<tr class="clickable" data-or="'+o.id+'"><td class="mono">'+esc(o.numero)+'</td><td>'+fmtDate(o.dateOuverture)+'</td><td>'+pill(o.statut)+'</td><td class="num">'+(o.pieces||[]).length+'</td><td class="num">'+(o.interventions||[]).length+"</td></tr>"
      ).join("") : '<tr class="empty-row"><td colspan="5">Aucun ordre de réparation pour ce véhicule.</td></tr>')+
    "</tbody></table></div>"+
    '<details style="margin-top:22px;">'+
      '<summary class="section-title" style="display:inline-block; cursor:pointer; margin-bottom:10px;">Historique des passages en atelier ('+monHistorique.length+')</summary>'+
      '<div class="table-wrap"><table class="grid"><thead><tr><th>Entrée</th><th>Sortie</th><th class="num">Durée</th><th>Motif d\'entrée</th><th>Motif de sortie</th></tr></thead><tbody>'+
        (monHistorique.length ? monHistorique.map(h=>{
          const dureeJours = Math.max(0, Math.round(((h.dateSortie?new Date(h.dateSortie):new Date()) - new Date(h.dateEntree))/86400000));
          return '<tr><td>'+fmtDateTime(h.dateEntree)+'</td><td>'+(h.dateSortie?fmtDateTime(h.dateSortie):'<span class="pill immobilise">En cours</span>')+'</td><td class="num mono">'+dureeJours+' j</td><td>'+esc(MOTIFS_INACTIVITE[h.motif]||h.motif||"—")+(h.detail?'<br><span class="faint" style="font-size:.78rem;">'+esc(h.detail)+"</span>":"")+'</td><td>'+esc(h.motifSortie||"—")+"</td></tr>";
        }).join("") : '<tr class="empty-row"><td colspan="5">Aucun passage enregistré.</td></tr>')+
      "</tbody></table></div>"+
    "</details>";

  view.querySelector("#back").addEventListener("click", ()=>setView("vehicules"));
  view.querySelector("#editVeh").addEventListener("click", ()=>openVehiculeForm(v));
  const sortieBtn = view.querySelector("#sortieVeh");
  if(sortieBtn) sortieBtn.addEventListener("click", ()=>openSortieForm(v));
  const cmdBtn = view.querySelector("#cmdUrgente");
  if(cmdBtn) cmdBtn.addEventListener("click", async ()=>{
    const [fournisseurs, articles] = await Promise.all([getAll("fournisseurs"), getAll("articles")]);
    openCommandeForm(fournisseurs, articles, {
      urgente: true,
      vehiculeId: v.id,
      note: "Immobilisation "+v.immatriculation+" — "+(MOTIFS_INACTIVITE[v.motifInactivite]||v.motifInactivite||"motif non précisé")+(v.detailInactivite ? " : "+v.detailInactivite : "")
    });
  });
  const assignDiagBtn = view.querySelector("#assignDiag");
  if(assignDiagBtn) assignDiagBtn.addEventListener("click", async ()=>{
    const techniciens = await getAll("techniciens");
    openDiagnosticAssignerForm(v, techniciens);
  });
  const confirmDiagBtn = view.querySelector("#confirmDiag");
  if(confirmDiagBtn) confirmDiagBtn.addEventListener("click", ()=>openDiagnosticConfirmerForm(v));
  const creerDevisBtn = view.querySelector("#creerDevisDiag");
  if(creerDevisBtn) creerDevisBtn.addEventListener("click", async ()=>{
    const [vehicules, articles] = await Promise.all([getAll("vehicules"), getAll("articles")]);
    const prefillLignes = (v.diagnosticPiecesSuggerees||[]).map(p=>{
      const art = articles.find(a=>a.id===p.articleId);
      return { articleId:p.articleId, reference:p.reference, designation:p.designation, quantite:p.quantite, prixUnitaire: art?art.prixVente:0 };
    });
    openDevisForm(vehicules, v.id, prefillLignes);
  });
  view.querySelectorAll("[data-f]").forEach(tr=>tr.addEventListener("click", ()=>setView("facture-detail",{id:tr.getAttribute("data-f")})));
  view.querySelectorAll("[data-or]").forEach(tr=>tr.addEventListener("click", ()=>setView("atelier-detail",{id:tr.getAttribute("data-or")})));
};

/* ---- Sortie de la base ---------------------------------------------------
   Ramène un véhicule "Entrée" ou "Inactif" à "Actif", avec un motif de
   sortie libre (réparation terminée, dossier administratif résolu…),
   enregistré sur l'épisode d'historique déjà ouvert plutôt que sur une
   nouvelle ligne — cette action clôt l'épisode, elle n'en ouvre pas un
   nouveau. Complète (sans le remplacer) le retour automatique à "Actif" déjà
   déclenché par la clôture d'un OR (reactiverVehiculeApresOr) : utile pour
   les cas sans OR, notamment un motif administratif. */
function openSortieForm(v){
  const body =
    '<p class="muted" style="margin-top:0;">Ramène <b>'+esc(v.immatriculation)+'</b> au statut Actif.</p>'+
    '<div class="field"><label>Motif de sortie</label><input id="f_motif_sortie" placeholder="ex. Réparation terminée, dossier administratif résolu…"></div>';
  const { close } = openModal("Sortie de la base — "+v.immatriculation, body, {
    footHtml: '<button class="btn ghost" id="cancel">Annuler</button><button class="btn primary" id="save">Confirmer la sortie</button>',
    onMount(back, close){
      back.querySelector("#cancel").addEventListener("click", close);

/* ---- Carte "Diagnostic" sur la fiche véhicule ---------------------------
   Trois états, correspondant au parcours signalement → diagnostic → devis :
   1. Signalé, personne n'a encore été désigné pour vérifier le véhicule.
   2. Diagnostic en cours : un technicien a été désigné, verdict pas encore rendu.
   3. Diagnostic confirmé : le texte du technicien est prêt à devenir un devis. */
function renderDiagnosticCard(v){
  const etape = v.etapePriseEnCharge || "signale";
  let body;
  if(etape==="signale"){
    body = '<p class="muted" style="margin-top:0;">Aucun technicien désigné pour l\'instant.</p><button class="btn primary" id="assignDiag" style="width:100%;">Assigner un mécanicien pour diagnostic</button>';
  } else if(etape==="diagnostic_en_cours"){
    body = '<p class="muted" style="margin-top:0;">Technicien désigné : <b>'+esc(v.diagnosticTechnicienNom||"—")+'</b>'+(v.diagnosticAssigneDate?" le "+fmtDate(v.diagnosticAssigneDate):"")+'.</p><button class="btn primary" id="confirmDiag" style="width:100%;">Confirmer le diagnostic</button>';
  } else {
    const pieces = v.diagnosticPiecesSuggerees||[];
    body = '<p class="muted" style="margin-top:0;">Confirmé par <b>'+esc(v.diagnosticTechnicienNom||"—")+'</b>'+(v.diagnosticConfirmeDate?" le "+fmtDate(v.diagnosticConfirmeDate):"")+' :</p>'+
      '<p style="margin-top:0;">'+esc(v.diagnosticConfirme||"—")+'</p>'+
      (pieces.length ? '<p class="faint" style="margin:0 0 10px;">Pièces suspectées : '+pieces.map(p=>esc(p.reference)+" (x"+p.quantite+")").join(", ")+'</p>' : "")+
      '<button class="btn primary" id="creerDevisDiag" style="width:100%;">Créer le devis</button>';
  }
  return '<div class="card"><h3>Diagnostic — <span class="pill '+ETAPE_PILL_CLASS[etape]+'">'+ETAPE_LABELS[etape]+'</span></h3>'+body+'</div>';
}

  view.innerHTML =
    '<div class="view-head"><div><p class="lede">Référentiel des pièces et niveaux de stock — '+articles.length+' référence(s).</p></div>'+
      '<div class="row-actions"><button class="btn" id="exportArt">Exporter en CSV</button><button class="btn" id="importCsv">Importer CSV</button><button class="btn primary" id="newArticle">+ Nouvel article</button></div></div>'+
    '<div class="toolbar"><input type="search" id="artSearch" placeholder="Rechercher une référence, désignation, famille…">'+

    '<div class="table-wrap"><table class="grid"><thead><tr>'+

    "</tr></thead><tbody id=\"artTbody\"></tbody></table></div>";

  let visibleArticles = articles;
  function draw(){
    const f = document.getElementById("artSearch").value.toLowerCase();
    const onlyLow = document.getElementById("onlyLow").checked;
    const rows = articles.filter(a=>{
      const textOk = !f || [a.reference,a.designation,a.famille].some(x=>(x||"").toLowerCase().includes(f));
      const lowOk = !onlyLow || (Number(a.stockQte)||0) <= (Number(a.stockSeuil)||0);
      return textOk && lowOk;
    });
    visibleArticles = rows;
    document.getElementById("artTbody").innerHTML = rows.length ? rows.map(a=>{
      const low = (Number(a.stockQte)||0) <= (Number(a.stockSeuil)||0);

        '<td class="num mono">'+(a.stockSeuil||0)+'</td>'+
        '<td class="num mono">'+fmtMoney(a.prixVente)+'</td>'+
        '<td class="row-actions"><button class="btn small" data-adj="'+a.id+'">Ajuster</button><button class="btn small ghost" data-edit="'+a.id+'">Modifier</button></td>'+
      "</tr>";
    }).join("") : '<tr class="empty-row"><td colspan="7">Aucun article ne correspond.</td></tr>';

    document.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click", ()=>openArticleForm(articles.find(a=>a.id===b.getAttribute("data-edit")), fournisseurs)));
    document.querySelectorAll("[data-adj]").forEach(b=>b.addEventListener("click", ()=>openStockAdjustForm(articles.find(a=>a.id===b.getAttribute("data-adj")))));
    document.querySelectorAll("[data-hist]").forEach(b=>b.addEventListener("click", ()=>openMouvementsHistory(articles.find(a=>a.id===b.getAttribute("data-hist")))));
  }
  document.getElementById("onlyLow").checked = startSousSeuil;
  draw();
  document.getElementById("artSearch").addEventListener("input", draw);
  document.getElementById("onlyLow").addEventListener("change", draw);
  document.getElementById("newArticle").addEventListener("click", ()=>openArticleForm(null, fournisseurs));
  document.getElementById("importCsv").addEventListener("click", ()=>openCsvImport("articles"));
  document.getElementById("exportArt").addEventListener("click", ()=>{
    let csv = "Reference;Designation;Famille;Stock;Seuil;Prix achat;Prix vente\n";
    visibleArticles.forEach(a=>{
      csv += [a.reference,a.designation,a.famille||"",a.stockQte||0,a.stockSeuil||0,a.prixAchat||0,a.prixVente||0].map(x=>String(x||"").replace(/;/g,",")).join(";")+"\n";
    });

  });
};

async function openCommandeDetail(id){
  const [c, fournisseurs] = await Promise.all([getOne("commandes", id), getAll("fournisseurs")]);

  const lignesHtml = (c.lignes||[]).map((l,i)=>
    '<tr><td>'+esc(l.reference)+" — "+esc(l.designation)+'</td><td class="num mono">'+l.qteCommandee+'</td>'+

    '<td class="num mono">'+fmtMoney(l.prixUnitaire)+"</td></tr>"
  ).join("");
  const body =
    '<p class="muted" style="margin-top:0;">Fournisseur : <b>'+esc(f?f.nom:"—")+'</b> · Statut : '+pill(c.statut)+(c.urgente ? ' · <span class="pill impayee">Urgente</span>' : "")+"</p>"+
    (c.note ? '<p class="faint" style="margin-top:-6px;">'+esc(c.note)+"</p>" : "")+
    '<table class="lines-table"><thead><tr><th>Référence</th><th>Commandé</th><th>Reçu</th><th>P.U.</th></tr></thead><tbody>'+lignesHtml+"</tbody></table>"+
    (c.statut!=="soldee" ? '<div class="callout"><span class="lbl">Réception</span><p>Indiquez la quantité effectivement reçue par ligne, puis validez : le stock et le coût moyen sont mis à jour automatiquement.</p></div>' : "");
  const aDesArticlesRecus = (c.lignes||[]).some(l=>(l.qteRecue||0)>0);
  const footHtml =
    (aDesArticlesRecus ? '<button class="btn" id="codesBarres">Codes-barres</button>' : "")+
    (c.statut!=="soldee"
      ? '<button class="btn ghost" id="cl">Fermer</button><button class="btn primary" id="receive">Valider la réception</button>'
      : '<button class="btn" id="cl">Fermer</button>');
  openModal("Commande "+c.numero, body, {
    wide:true, footHtml,
    onMount(back, close){
      back.querySelector("#cl").addEventListener("click", close);
      const bcBtn = back.querySelector("#codesBarres");
      if(bcBtn) bcBtn.addEventListener("click", ()=>openCodesBarresCommande(c));
      const btn = back.querySelector("#receive");
      if(btn) btn.addEventListener("click", async ()=>{
        const inputs = back.querySelectorAll("[data-recv]");
        const lignes = JSON.parse(JSON.stringify(c.lignes||[]));
        for(const inp of inputs){
          const i = Number(inp.getAttribute("data-recv"));
          const qte = Number(inp.value)||0;
          const already = lignes[i].qteRecue||0;
          const delta = qte - already;
          lignes[i].qteRecue = qte;
          if(delta!==0 && lignes[i].articleId){
            const artRef = state.db.doc("articles/"+lignes[i].articleId);
            const snap = await artRef.get();
            if(snap.exists){
              const art = snap.data();
              const oldQte = Number(art.stockQte)||0;
              const oldPrix = Number(art.prixAchat)||0;
              const nouveauPrix = delta>0 ? (((oldQte*oldPrix) + (delta*lignes[i].prixUnitaire)) / Math.max(1,(oldQte+delta))) : oldPrix;
              await artRef.update({ prixAchat: Math.round(nouveauPrix*100)/100 });
              await ajusterStock(lignes[i].articleId, delta, delta>0?"entree":"ajustement", "commande", c.numero, "Réception commande");
            }
          }
        }
        const totalCommande = lignes.reduce((s,l)=>s+l.qteCommandee,0);
        const totalRecu = lignes.reduce((s,l)=>s+(l.qteRecue||0),0);
        const statut = totalRecu<=0 ? c.statut : (totalRecu>=totalCommande ? "soldee" : "recue_partielle");
        await state.db.doc("commandes/"+c.id).update({ lignes, statut });
        await logAudit("Réception commande", c.numero, "");
        close(); toast("Réception enregistrée."); renderView();
      });
    }
  });
}

/* ---- Codes-barres de réception -------------------------------------------
   Un code-barres par unité physiquement reçue (pas par ligne) : référence de
   la pièce (SKU) + n° de commande (les 4 derniers chiffres, ex. "0001") +
   position de cette unité parmi celles reçues de la même référence sur cette
   commande, ex. "REF-PLQ-002-0001-1", "-2", "-3"… — déterministe, jamais
   stocké, recalculé à chaque ouverture à partir de la commande. */
function genererCodesBarresCommande(c){
  const seqMatch = (c.numero||"").match(/(\d{4})$/);
  const seq = seqMatch ? seqMatch[1] : (c.numero||"CMD");
  const labels = [];
  (c.lignes||[]).forEach(l=>{
    const n = Math.floor(Number(l.qteRecue)||0);
    for(let i=1;i<=n;i++){
      labels.push({ code: (l.reference||"REF")+"-"+seq+"-"+i, reference:l.reference, designation:l.designation });
    }
  });
  return labels;
}
function openCodesBarresCommande(c){
  const labels = genererCodesBarresCommande(c);
  if(!labels.length){ toast("Aucun article reçu sur cette commande pour le moment.", "danger"); return; }
  const body =
    '<p class="muted" style="margin-top:0;">Un code-barres par unité reçue — '+labels.length+' au total.</p>'+
    '<div id="barcodeGrid" style="display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px;">'+
      labels.map((l,i)=>
        '<div style="border:1px solid var(--line); border-radius:var(--radius); padding:8px; text-align:center;">'+
          '<svg id="bc'+i+'"></svg>'+
          '<div class="faint" style="font-size:.72rem; margin-top:2px;">'+esc(l.designation||"")+'</div>'+
        "</div>"
      ).join("")+
    "</div>";
  openModal("Codes-barres — "+c.numero, body, {
    wide:true,
    footHtml: '<button class="btn ghost" id="cancel">Fermer</button><button class="btn primary" id="printBc">Imprimer</button>',
    onMount(back, close){
      back.querySelector("#cancel").addEventListener("click", close);
      function dessiner(root, prefix){
        labels.forEach((l,i)=>{
          try{ JsBarcode(root.querySelector("#"+prefix+i), l.code, { format:"CODE128", width:1.6, height:42, fontSize:11, margin:4 }); }
          catch(e){ /* référence vide ou caractère non encodable — la vignette reste vide plutôt que de bloquer les autres */ }
        });
      }
      dessiner(back, "bc");
      back.querySelector("#printBc").addEventListener("click", ()=>{
        // Réutilise le mécanisme d'impression existant (#printArea, voir
        // printDocument) plutôt que window.print() direct sur la modale,
        // pour ne pas imprimer aussi le reste de l'interface autour.
        const printArea = document.getElementById("printArea");
        printArea.innerHTML =
          '<div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px;">'+
            labels.map((l,i)=>
              '<div style="border:1px solid #ccc; border-radius:6px; padding:8px; text-align:center;">'+
                '<svg id="pbc'+i+'"></svg>'+
                '<div style="font-size:11px; margin-top:2px;">'+esc(l.designation||"")+'</div>'+
              "</div>"
            ).join("")+
          "</div>";
        dessiner(printArea, "pbc");
        setTimeout(()=> window.print(), 50);
      });
    }
  });
}

/* ---- envoi à l'atelier : choix du technicien responsable ----------------
   Optionnel — un OR peut rester "à assigner" — mais c'est le moment où le
   dossier "atterrit" dans le profil d'un mécanicien précis (visible ensuite
   sur sa fiche, onglet Techniciens). */
/* ---- Contrôle de stock avant d'envoyer un véhicule en atelier -----------
   Sans ce contrôle, envoyer un devis à l'atelier (ou le facturer, ou une
   vente comptoir) décomptait le stock sans jamais vérifier qu'il y en avait
   assez — un véhicule pouvait partir en réparation pour une pièce qui
   n'existait pas. Seul un administrateur peut passer outre (la pièce est
   parfois réparable, ou sourcée autrement) ; un agent est bloqué net. */
function calculerRuptures(lignes, articles){
  const ruptures = [];
  (lignes||[]).filter(l=>l.type!=="main_oeuvre" && l.articleId).forEach(l=>{
    const art = articles.find(a=>a.id===l.articleId);
    const dispo = art ? Number(art.stockQte)||0 : 0;
    const besoin = Number(l.quantite)||0;
    if(besoin > dispo) ruptures.push({ reference: art?art.reference:(l.reference||"?"), besoin, dispo });
  });
  return ruptures;
}
async function confirmerRuptureStock(ruptures){
  const detail = ruptures.map(r=>r.reference+" (besoin "+r.besoin+", dispo "+r.dispo+")").join(", ");
  if(!isAdmin()){
    toast("Stock insuffisant : "+detail+" — seul un administrateur peut autoriser l'envoi malgré la rupture.", "danger");
    return false;
  }
  return await askConfirm(
    "Stock insuffisant : "+detail+". Envoyer quand même ? À réserver aux cas où la pièce est réparable ou sourcée autrement.",
    "Envoyer malgré la rupture"
  );
}

/* ---- Acompte sur un devis -------------------------------------------------
   Un devis n'a pas de facture tant qu'il n'est pas converti — mais un client
   peut très bien verser un acompte avant. On l'enregistre ici (même forme
   qu'un règlement de facture) ; il est automatiquement reporté comme premier
   règlement de la facture le jour où ce devis se convertit (directement ou
   via un OR), pour que le solde dû tienne compte de ce qui a déjà été payé. */
function openAjouterAcompteForm(d){
  const body =
    '<div class="field-row" style="grid-template-columns:1fr 1fr;">'+
      '<div class="field"><label>Montant</label><input id="f_montant" type="number" value="0"></div>'+
      '<div class="field"><label>Date</label><input id="f_date" type="date" value="'+todayIso().slice(0,10)+'"></div>'+
    "</div>"+
    '<div class="field-row" style="grid-template-columns:1fr 1fr;">'+
      '<div class="field"><label>Mode de paiement</label><select id="f_mode">'+
        ["Espèces","Virement","Mobile money","Chèque"].map(m=>'<option value="'+m+'">'+m+"</option>").join("")+
      "</select></div>"+
      '<div class="field"><label>Référence (optionnel)</label><input id="f_refpay" placeholder="N° de transaction, chèque…"></div>'+
    "</div>";
  const { close } = openModal("Enregistrer un acompte — "+d.numero, body, {
    footHtml: '<button class="btn ghost" id="cancel">Annuler</button><button class="btn primary" id="save">Enregistrer</button>',
    onMount(back, close){
      back.querySelector("#cancel").addEventListener("click", ()=>{ close(); openDevisDetail(d.id); });
      back.querySelector("#save").addEventListener("click", async ()=>{
        const montant = Number(back.querySelector("#f_montant").value);
        if(!montant || montant<=0){ toast("Montant invalide.", "danger"); return; }
        const acompte = {
          date: back.querySelector("#f_date").value || todayIso(),
          montant, mode: back.querySelector("#f_mode").value,
          reference: back.querySelector("#f_refpay").value.trim(),
          utilisateur: actingUserName()
        };
        const acomptes = [...(d.acomptes||[]), acompte];
        const acompteTotal = (d.acompteTotal||0) + montant;
        await state.db.doc("devis/"+d.id).update({ acomptes, acompteTotal });
        await logAudit("Acompte devis", d.numero, fmtMoney(montant)+" ("+acompte.mode+")");
        close(); toast("Acompte enregistré."); openDevisDetail(d.id);
      });
    }
  });
}

async function openDevisDetail(id){

  const veh = vehicules.find(v=>v.id===d.vehiculeId);
  const total = (d.lignes||[]).reduce((s,l)=>s+computeLigneMontant(l),0);
  const lignesHtml = (d.lignes||[]).map(l=>
    '<tr><td>'+(l.type==="main_oeuvre"?'<span class="faint">Main d\'œuvre</span> — ':"")+esc(l.designation||l.reference)+'</td><td class="num mono">'+l.quantite+'</td><td class="num mono">'+fmtMoney(l.prixUnitaire)+'</td><td class="num mono">'+fmtMoney(computeLigneMontant(l))+"</td></tr>"
  ).join("");
  const acompteTotal = d.acompteTotal||0;
  const acomptesHtml = (d.acomptes||[]).length
    ? '<div class="table-wrap"><table class="grid"><thead><tr><th>Date</th><th>Mode</th><th>Référence</th><th class="num">Montant</th></tr></thead><tbody>'+
        d.acomptes.map(a=>'<tr><td>'+fmtDate(a.date)+'</td><td>'+esc(a.mode)+'</td><td>'+esc(a.reference||"—")+'</td><td class="num mono">'+fmtMoney(a.montant)+"</td></tr>").join("")+
      "</tbody></table></div>"
    : "";
  const body =
    '<p class="muted" style="margin-top:0;">Véhicule : <b class="mono">'+esc(veh?veh.immatriculation:"—")+'</b> · Statut : '+pill(d.statut)+" · Date : "+fmtDate(d.date)+(d.dureeEstimeeJours?" · Durée estimée : "+d.dureeEstimeeJours+" j":"")+"</p>"+
    '<table class="lines-table"><thead><tr><th>Ligne</th><th>Qté</th><th>P.U.</th><th>Montant</th></tr></thead><tbody>'+lignesHtml+"</tbody></table>"+
    '<div class="lines-total"><span class="muted">Total devis</span><b>'+fmtMoney(total)+"</b></div>"+
    (d.factureId ? '<div class="callout"><span class="lbl">Converti</span><p>Ce devis a été converti directement en facture.</p></div>' : "")+
    (d.orId ? '<div class="callout"><span class="lbl">À l\'atelier</span><p>Ce devis a été envoyé à l\'atelier sous forme d\'ordre de réparation.</p></div>' : "")+
    '<h3 class="section-title" style="margin-top:20px;">Acompte'+(acompteTotal>0?' — '+fmtMoney(acompteTotal)+' reçu'+(d.acomptes.length>1?"s":""):"")+'</h3>'+
    acomptesHtml+
    (!d.factureId ? '<button class="btn small" id="addAcompte">+ Enregistrer un acompte</button>' : '<p class="faint">Ce devis est déjà facturé — un nouvel acompte se gère directement sur la facture.</p>');

  const statusButtons = [];
  if(!d.factureId && !d.orId){
    if(d.statut==="brouillon") statusButtons.push('<button class="btn" id="toEnvoye">Marquer envoyé</button>');
    if(d.statut==="envoye"){ statusButtons.push('<button class="btn" id="toAccepte">Marquer accepté</button>'); statusButtons.push('<button class="btn danger" id="toRefuse">Marquer refusé</button>'); }
    statusButtons.push('<button class="btn" id="toAtelier">Envoyer à l\'atelier</button>');
    statusButtons.push('<button class="btn primary" id="toFacture">Facturer directement</button>');
  }
  openModal("Devis "+d.numero, body, {
    wide:true,
    footHtml: '<button class="btn ghost" id="cl">Fermer</button><button class="btn" id="printDev">Imprimer / PDF</button>'+statusButtons.join("")+(isAdmin() && !d.factureId ? '<button class="btn danger" id="deleteDev">Supprimer</button>' : ""),
    onMount(back, close){
      back.querySelector("#cl").addEventListener("click", close);
      back.querySelector("#printDev").addEventListener("click", ()=> printDocument("devis", d, veh));
      const addAcompteBtn = back.querySelector("#addAcompte");
      if(addAcompteBtn) addAcompteBtn.addEventListener("click", ()=>{ close(); openAjouterAcompteForm(d); });
      const delB = back.querySelector("#deleteDev");
      if(delB) delB.addEventListener("click", async ()=>{
        const ok = await askConfirm("Supprimer définitivement le devis "+d.numero+" ? Cette action est irréversible — à réserver aux données de test.", "Supprimer définitivement");
        if(!ok) return;
        try{
          await state.db.doc("devis/"+d.id).delete();
        }catch(e){ toast("Erreur : "+describeError(e), "danger"); return; }
        await logAudit("Suppression devis", d.numero, "");
        close(); toast("Devis supprimé."); renderView();
      });
      const setStatut = (s)=> async ()=>{ await state.db.doc("devis/"+d.id).update({statut:s}); close(); renderView(); };
      const teB = back.querySelector("#toEnvoye"); if(teB) teB.addEventListener("click", setStatut("envoye"));
      const taB = back.querySelector("#toAccepte"); if(taB) taB.addEventListener("click", setStatut("accepte"));
      const trB = back.querySelector("#toRefuse"); if(trB) trB.addEventListener("click", setStatut("refuse"));
      const tf = back.querySelector("#toFacture");
      if(tf) tf.addEventListener("click", async ()=>{
        const articlesCheck = await getAll("articles");
        const ruptures = calculerRuptures(d.lignes, articlesCheck);
        const ok = ruptures.length
          ? await confirmerRuptureStock(ruptures)
          : await askConfirm("Convertir le devis "+d.numero+" en facture ? Les pièces seront décomptées du stock.", "Convertir");
        if(!ok) return;
        const lignes = (d.lignes||[]).map(l=>({...l, montant: computeLigneMontant(l)}));
        const montantTotal = lignes.reduce((s,l)=>s+l.montant,0);
        // Un acompte versé pendant que le document était encore un devis devient
        // le premier règlement de la facture, pour que le solde dû en tienne
        // compte dès sa création — voir openAjouterAcompteForm.
        const reglementsInitiaux = (d.acomptes||[]).map(a=>({ date:a.date, montant:a.montant, mode:a.mode, reference:a.reference||"Acompte devis", utilisateur:a.utilisateur }));
        const montantRegle = d.acompteTotal||0;
        const numero = await nextNumero("facture","FAC");
        const factureRef = await state.db.collection("factures").add({
          numero, devisId:d.id, orId:null, vehiculeId:d.vehiculeId, date: todayIso(),
          lignes, montantTotal, montantRegle, statutPaiement: statutPaiement(montantTotal, montantRegle), reglements: reglementsInitiaux,
          createdAt: todayIso(), createdBy: actingUserName()
        });
        for(const l of lignes){
          if(l.type!=="main_oeuvre" && l.articleId){
            await ajusterStock(l.articleId, -Math.abs(l.quantite||0), "sortie", "facture", numero, "Vente sur devis "+d.numero);
          }
        }
        await state.db.doc("devis/"+d.id).update({ statut:"accepte", factureId: factureRef.id });
        await logAudit("Conversion devis en facture", d.numero+" → "+numero, (ruptures.length?"Facturé malgré rupture de stock. ":"")+(montantRegle>0?"Acompte transféré : "+fmtMoney(montantRegle):""));
        close(); toast("Facture "+numero+" créée."+(montantRegle>0?" Acompte transféré.":"")); setView("facture-detail", { id: factureRef.id });
      });
      const toAt = back.querySelector("#toAtelier");
      if(toAt) toAt.addEventListener("click", async ()=>{
        const articlesCheck = await getAll("articles");
        const ruptures = calculerRuptures(d.lignes, articlesCheck);
        if(ruptures.length){
          const ok = await confirmerRuptureStock(ruptures);
          if(!ok) return;
        }
        const choix = await openEnvoyerAtelierForm(d);
        if(!choix) return;
        const lignes = d.lignes||[];
        const numero = await nextNumero("or","OR");
        const pieces = lignes.filter(l=>l.type!=="main_oeuvre" && l.articleId).map(l=>({
          articleId:l.articleId, reference:l.reference, designation:l.designation, quantite:l.quantite, prixUnitaire:l.prixUnitaire
        }));
        const moAvecTech = lignes.filter(l=>l.type==="main_oeuvre" && l.technicienId);
        const moSansTech = lignes.filter(l=>l.type==="main_oeuvre" && !l.technicienId);
        const interventions = moAvecTech.map(l=>({
          id: Math.random().toString(36).slice(2), technicienId:l.technicienId, technicienNom:l.technicienNom, metier:l.metier,
          description:l.designation, montant:Number(l.prixUnitaire)||0, date: todayIso()
        }));
        const orRef = await state.db.collection("ordres").add({
          numero, vehiculeId:d.vehiculeId, statut:"ouvert", dateOuverture: todayIso(), dateCloture:null,
          km:null, technicienIds: interventions.map(i=>i.technicienId), pieces, interventions, factureId:null,
          technicienResponsableId: choix.technicienResponsableId, technicienResponsableNom: choix.technicienResponsableNom,
          devisId: d.id, createdAt: todayIso(), createdBy: actingUserName()
        });
        for(const p of pieces){
          await ajusterStock(p.articleId, -Math.abs(p.quantite||0), "sortie", "or", numero, "Pose sur "+numero+" (depuis devis "+d.numero+")");
        }
        await state.db.doc("devis/"+d.id).update({ statut:"accepte", orId: orRef.id });
        await marquerVehiculeImmobiliseSiNecessaire(d.vehiculeId);
        await logAudit("Envoi devis vers atelier", d.numero+" → "+numero, (ruptures.length?"Envoyé malgré rupture de stock. ":"")+(choix.technicienResponsableNom||""));
        close();

function openFactureDirecteForm(vehicules){
  const items = [];
  const body =
    '<div class="field"><label>Véhicule</label><div id="vehSlot"></div></div>'+
    '<div class="field"><label>Lignes</label><div id="linesBox"></div></div>';
  const { close } = openModal("Nouvelle facture directe", body, {
    wide:true,
    footHtml: '<button class="btn ghost" id="cancel">Annuler</button><button class="btn primary" id="save">Créer la facture</button>',
    async onMount(back, close){
      const [articles, techniciens] = await Promise.all([getAll("articles"), getAll("techniciens")]);
      const editor = renderLinesEditor(back.querySelector("#linesBox"), items, articles, { techniciens, warnStock:true });
      const vehPicker = mountSearchableSelect(back.querySelector("#vehSlot"), {
        items: vehicules, getId:v=>v.id, getLabel:v=>v.immatriculation+" — "+(v.chauffeurNom||""), placeholder:"Rechercher une immatriculation…"
      });
      back.querySelector("#cancel").addEventListener("click", close);
      back.querySelector("#save").addEventListener("click", async ()=>{
        const vehiculeId = vehPicker.getValue();
        if(!vehiculeId){ toast("Choisissez un véhicule.", "danger"); return; }
        const lignes = editor.getItems().map(l=>({...l, montant: computeLigneMontant(l)}));
        if(!lignes.length){ toast("Ajoutez au moins une ligne.", "danger"); return; }
        const ruptures = calculerRuptures(lignes, articles);
        if(ruptures.length){
          const ok = await confirmerRuptureStock(ruptures);
          if(!ok) return;
        }
        const montantTotal = lignes.reduce((s,l)=>s+l.montant,0);
        const numero = await nextNumero("facture","FAC");
        const ref = await state.db.collection("factures").add({
          numero, devisId:null, orId:null, vehiculeId, date: todayIso(),
          lignes, montantTotal, montantRegle:0, statutPaiement:"impayee", reglements:[],
          createdAt: todayIso(), createdBy: actingUserName()
        });
        for(const l of lignes){
          if(l.type!=="main_oeuvre" && l.articleId) await ajusterStock(l.articleId, -Math.abs(l.quantite||0), "sortie", "facture", numero, "Vente directe");
        }
        await logAudit("Création facture directe", numero, ruptures.length?"Facturé malgré rupture de stock.":"");
        close(); toast("Facture "+numero+" créée."); setView("facture-detail",{id:ref.id});
      });
    }
  });
}

function openReglementForm(facture, resteDefault){
  const body =
    '<div class="field-row" style="grid-template-columns:1fr 1fr;">'+
      '<div class="field"><label>Montant</label><input id="f_montant" type="number" value="'+resteDefault+'"></div>'+
      '<div class="field"><label>Date</label><input id="f_date" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div>'+
    "</div>"+
    '<div class="field-row" style="grid-template-columns:1fr 1fr;">'+
      '<div class="field"><label>Mode de paiement</label><select id="f_mode">'+
        ["Espèces","Virement","Mobile money","Chèque"].map(m=>'<option value="'+m+'">'+m+"</option>").join("")+
      "</select></div>"+
      '<div class="field"><label>Référence (optionnel)</label><input id="f_refpay" placeholder="N° de transaction, chèque…"></div>'+
    "</div>";
  const { close } = openModal("Ajouter un règlement — "+facture.numero, body, {
    footHtml: '<button class="btn ghost" id="cancel">Annuler</button><button class="btn primary" id="save">Enregistrer</button>',
    onMount(back, close){
      back.querySelector("#cancel").addEventListener("click", close);
      back.querySelector("#save").addEventListener("click", async ()=>{
        const montant = Number(back.querySelector("#f_montant").value);
        if(!montant || montant<=0){ toast("Montant invalide.", "danger"); return; }
        const reglement = {
          date: back.querySelector("#f_date").value || todayIso(),
          montant, mode: back.querySelector("#f_mode").value,
          reference: back.querySelector("#f_refpay").value.trim(),
          utilisateur: actingUserName()
        };
        const reglements = [...(facture.reglements||[]), reglement];
        const montantRegle = (facture.montantRegle||0) + montant;
        const statutPaiement = statutPaiement2(facture.montantTotal, montantRegle);
        await state.db.doc("factures/"+facture.id).update({ reglements, montantRegle, statutPaiement });
        await logAudit("Règlement facture", facture.numero, fmtMoney(montant)+" ("+reglement.mode+")");
        close(); toast("Règlement enregistré."); setView("facture-detail",{id:facture.id});
      });
    }
  });
}
function statutPaiement2(total, regle){ return statutPaiement(total, regle); }

    const pieces = (o.pieces||[]).slice();
    pieces[idx] = { ...pieces[idx], ancienneRecue:true };
    await state.db.doc("ordres/"+o.id).update({ pieces });
    await logAudit("Confirmation ancienne pièce", o.numero, pieces[idx].reference);
    toast("Ancienne pièce confirmée reçue."); setView("atelier-detail",{id:o.id});
  }));
  const addIntervBtn = view.querySelector("#addInterv");
  if(addIntervBtn) addIntervBtn.addEventListener("click", ()=>openAddInterventionToOr(o, techniciens));
  const reassignBtn = view.querySelector("#reassignTech");
  if(reassignBtn) reassignBtn.addEventListener("click", ()=>openReassignerTechnicien(o, techniciens));
  const closeBtn = view.querySelector("#closeOr");
  if(closeBtn) closeBtn.addEventListener("click", async ()=>{
    if(!(o.pieces||[]).length && !(o.interventions||[]).length){ toast("Ajoutez au moins une pièce ou une intervention avant de clôturer.", "danger"); return; }
    /* Contrôle anti-vol : pour une pièce à échange standard, l'ancienne doit
       être restituée avant clôture — bloquant par défaut, un admin peut
       passer outre avec confirmation explicite et trace dans le journal
       (même principe que la rupture de stock ou le montant insuffisant). */
    const piecesManquantes = (o.pieces||[]).filter(p=>p.echangeStandard && !p.ancienneRecue);
    if(piecesManquantes.length){
      const liste = piecesManquantes.map(p=>p.reference).join(", ");
      if(!isAdmin()){
        toast("Ancienne pièce non restituée pour : "+liste+". Un administrateur doit valider la clôture sans restitution.", "danger");
        return;
      }
      const okDeroger = await askConfirm("Ancienne pièce non restituée pour : "+liste+". Clôturer quand même, sans restitution ?", "Clôturer sans restitution");
      if(!okDeroger) return;
      await logAudit("Clôture OR sans restitution ancienne pièce", o.numero, liste);
    }
    const ok = await askConfirm("Clôturer l'OR "+o.numero+" et générer la facture du véhicule ?", "Clôturer & facturer");
    if(!ok) return;
    const lignes = [
      ...(o.pieces||[]).map(p=>({ type:"piece", articleId:p.articleId, reference:p.reference, designation:p.designation, quantite:p.quantite, prixUnitaire:p.prixUnitaire, montant:p.quantite*p.prixUnitaire })),
      ...(o.interventions||[]).map(i=>({ type:"main_oeuvre", designation:i.description+" ("+(METIERS[i.metier]||i.metier)+" — "+i.technicienNom+")", quantite:1, prixUnitaire:i.montant, montant:i.montant }))
    ];
    const montantTotal = lignes.reduce((s,l)=>s+l.montant,0);
    // Si cet OR vient d'un devis qui avait déjà reçu un acompte, on le reporte
    // sur la facture générée à la clôture — même logique que la conversion
    // directe devis → facture, voir openAjouterAcompteForm.
    const devisOrigine = o.devisId ? await getOne("devis", o.devisId) : null;
    const reglementsInitiaux = (devisOrigine && devisOrigine.acomptes || []).map(a=>({ date:a.date, montant:a.montant, mode:a.mode, reference:a.reference||"Acompte devis", utilisateur:a.utilisateur }));
    const montantRegle = (devisOrigine && devisOrigine.acompteTotal) || 0;
    const numero = await nextNumero("facture","FAC");
    const factureRef = await state.db.collection("factures").add({
      numero, devisId:null, orId:o.id, vehiculeId:o.vehiculeId, date: todayIso(),
      lignes, montantTotal, montantRegle,
      statutPaiement: montantTotal<=0 ? "payee" : statutPaiement(montantTotal, montantRegle),
      reglements: reglementsInitiaux,
      createdAt: todayIso(), createdBy: actingUserName()
    });
    await state.db.doc("ordres/"+o.id).update({ statut:"cloture", dateCloture: todayIso(), factureId: factureRef.id });
    await reactiverVehiculeApresOr(o.vehiculeId, o.id);
    await logAudit("Clôture OR", o.numero, "Facture "+numero+" générée"+(montantRegle>0?" (acompte transféré : "+fmtMoney(montantRegle)+")":""));
    toast("OR clôturé, facture "+numero+" créée."+(montantRegle>0?" Acompte transféré.":"")); setView("facture-detail",{id:factureRef.id});
  });
};
