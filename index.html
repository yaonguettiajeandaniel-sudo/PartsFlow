/* ---- Prise en charge (triage) -------------------------------------------
   Aide à la décision, pas une décision automatique : la file est construite
   à partir du statut réel de chaque véhicule (immobilisé, pas déjà en
   réparation) — elle se met donc à jour automatiquement dès qu'un véhicule
   change de statut. Pour chaque véhicule de la file, si un devis accepté
   est prêt à partir, on vérifie si les pièces nécessaires sont réellement
   disponibles — en tenant compte de ce que les véhicules plus anciens dans
   la file ont déjà "réservé" avant lui — et si l'atelier a une place libre
   (nombre d'OR ouverts vs capacité configurée). Le résultat est une
   recommandation affichée, jamais un accès bloqué : le chef d'atelier
   garde toujours la main via "Envoyer à l'atelier" sur le devis, ou peut
   déclencher une commande urgente pour les pièces qui manquent. */
VIEWS.triage = async function(view){
  const [devis, vehicules, articles, ordres] = await Promise.all([
    getAll("devis"), getAll("vehicules"), getAll("articles"), getAll("ordres")
  ]);
  const vehiculesEnReparation = new Set(ordres.filter(o=>o.statut==="ouvert").map(o=>o.vehiculeId));
  const queue = vehicules
    .filter(v=>v.statut==="immobilise" && !vehiculesEnReparation.has(v.id))
    .sort((a,b)=> new Date(a.immobiliseDepuis||0) - new Date(b.immobiliseDepuis||0));

  const stockSim = {};
  articles.forEach(a=>{ stockSim[a.id] = Number(a.stockQte)||0; });

  const capacite = Number(state.config.capaciteAtelier)||5;
  const orOuvertsCount = ordres.filter(o=>o.statut==="ouvert").length;
  let placesRestantes = Math.max(0, capacite - orOuvertsCount);

  const rows = queue.map(veh=>{
    const d = devis
      .filter(x=>x.vehiculeId===veh.id && x.statut==="accepte" && !x.orId && !x.factureId)
      .sort((a,b)=> new Date(a.date)-new Date(b.date))[0];

    const referenceDate = veh.immobiliseDepuis || (d ? d.date : null);
    const joursAttente = referenceDate ? Math.max(0, Math.floor((Date.now() - new Date(referenceDate).getTime()) / 86400000)) : 0;

    let statut, raison, manquants = [];
    if(!d){
      statut = "sans_devis";
      raison = "Aucun devis accepté en attente — "+(ETAPE_LABELS[veh.etapePriseEnCharge||"signale"]||"")+(veh.motifInactivite ? " ("+(MOTIFS_INACTIVITE[veh.motifInactivite]||veh.motifInactivite)+(veh.detailInactivite ? " : "+veh.detailInactivite : "")+")" : "");
    } else {
      const pieceLignes = (d.lignes||[]).filter(l=>l.type!=="main_oeuvre" && l.articleId);
      pieceLignes.forEach(l=>{
        const dispo = stockSim[l.articleId]!=null ? stockSim[l.articleId] : 0;
        if((Number(l.quantite)||0) > dispo){
          const art = articles.find(a=>a.id===l.articleId);
          manquants.push({ articleId:l.articleId, reference: art?art.reference:(l.reference||"?"), designation: art?art.designation:(l.designation||""), besoin:Number(l.quantite)||0, dispo, prixUnitaire: art?(art.prixAchat||0):0 });
        }
      });
      const okStock = manquants.length===0;
      pieceLignes.forEach(l=>{
        const dispo = stockSim[l.articleId]!=null ? stockSim[l.articleId] : 0;
        stockSim[l.articleId] = Math.max(0, dispo - (Number(l.quantite)||0));
      });
      if(!okStock){
        statut = "bloque";
        raison = "Pièce(s) manquante(s) : " + manquants.map(m=>m.reference+" (besoin "+m.besoin+", dispo "+m.dispo+")").join(" · ");
      } else if(placesRestantes <= 0){
        statut = "attente_capacite";
        raison = "Atelier à pleine capacité ("+orOuvertsCount+"/"+capacite+" OR ouverts)";
      } else {
        statut = "pret";
        raison = "Pièces disponibles, atelier a de la place";
        placesRestantes--;
      }
      if(d.dureeEstimeeJours) raison += " · Durée estimée : "+d.dureeEstimeeJours+" j";
    }
    return { devis:d, vehicule:veh, joursAttente, statut, raison, manquants };
  });

  const nbPret = rows.filter(r=>r.statut==="pret").length;
  const nbBloque = rows.filter(r=>r.statut==="bloque").length;
  const nbAttenteCap = rows.filter(r=>r.statut==="attente_capacite").length;
  const nbSansDevis = rows.filter(r=>r.statut==="sans_devis").length;
  const STATUT_LABEL = { pret:"Peut être pris en charge", bloque:"Bloqué", attente_capacite:"Atelier complet", sans_devis:"Devis à préparer" };
  const STATUT_CLASS = { pret:"accepte", bloque:"refuse", attente_capacite:"partielle", sans_devis:"brouillon" };

  view.innerHTML =
    '<div class="view-head"><div><p class="lede">File d\'attente des véhicules diagnostiqués par les mécaniciens (voir la carte "Diagnostic" sur la fiche du véhicule), triée par ancienneté, avec vérification automatique du stock et de la capacité de l\'atelier — se met à jour dès qu\'un véhicule change de statut.</p></div>'+
      '<button class="btn primary" id="newDevisShortcut">+ Nouveau devis</button></div>'+
    '<div class="kpi-grid">'+
      '<div class="kpi good-top"><div class="lbl">Peuvent être pris en charge</div><div class="val">'+nbPret+'</div></div>'+
      '<div class="kpi danger-top"><div class="lbl">Bloqués (stock)</div><div class="val '+(nbBloque>0?"danger":"")+'">'+nbBloque+'</div></div>'+
      '<div class="kpi amber-top"><div class="lbl">En attente d\'une place</div><div class="val '+(nbAttenteCap>0?"amber":"")+'">'+nbAttenteCap+'</div></div>'+
      '<div class="kpi"><div class="lbl">Devis à préparer</div><div class="val '+(nbSansDevis>0?"amber":"")+'">'+nbSansDevis+'</div></div>'+
      '<div class="kpi"><div class="lbl">Capacité atelier</div><div class="val">'+orOuvertsCount+' / '+capacite+'</div><div class="sub">OR ouverts / capacité configurée</div></div>'+
    '</div>'+
    (queue.length===0 ? '<div class="callout"><span class="lbl">File vide</span><p>Aucun véhicule immobilisé n\'attend de prise en charge pour le moment.</p></div>' : '')+
    '<div class="table-wrap"><table class="grid"><thead><tr><th>Véhicule</th><th>Devis</th><th class="num">Attente</th><th>Statut</th><th>Détail</th><th></th></tr></thead><tbody>'+
      rows.map((r,i)=>{
        const actions =
          (r.statut==="pret" ? '<button class="btn small primary" data-dev-open="'+r.devis.id+'">Envoyer à l\'atelier</button>' : "")+
          (r.statut!=="pret" && r.devis ? '<button class="btn small ghost" data-dev-open="'+r.devis.id+'">Voir le devis</button>' : "")+
          (r.statut==="sans_devis" ? '<button class="btn small primary" data-devis-veh="'+r.vehicule.id+'">Créer un devis</button>' : "")+
          ((r.statut==="bloque" || r.statut==="sans_devis") ? '<button class="btn small danger" data-cmd-idx="'+i+'">Commande urgente</button>' : "");
        return (
        '<tr>'+
          '<td class="mono clickable" data-veh="'+r.vehicule.id+'">'+esc(r.vehicule.immatriculation)+'</td>'+
          (r.devis ? '<td class="mono clickable" data-dev="'+r.devis.id+'">'+esc(r.devis.numero)+'</td>' : '<td class="mono faint">—</td>')+
          '<td class="num mono">'+r.joursAttente+' j</td>'+
          '<td><span class="pill '+STATUT_CLASS[r.statut]+'">'+STATUT_LABEL[r.statut]+'</span></td>'+
          '<td class="faint" style="max-width:360px;">'+esc(r.raison)+'</td>'+
          '<td class="row-actions">'+actions+'</td>'+
        '</tr>'
        );
      }).join("")+
    "</tbody></table></div>";

  view.querySelector("#newDevisShortcut").addEventListener("click", ()=>openDevisForm(vehicules));
  view.querySelectorAll("[data-veh]").forEach(td=>td.addEventListener("click", ()=>setView("vehicule-detail",{id:td.getAttribute("data-veh")})));
  view.querySelectorAll("[data-dev]").forEach(td=>td.addEventListener("click", ()=>openDevisDetail(td.getAttribute("data-dev"))));
  view.querySelectorAll("[data-dev-open]").forEach(b=>b.addEventListener("click", ()=>openDevisDetail(b.getAttribute("data-dev-open"))));
  view.querySelectorAll("[data-devis-veh]").forEach(b=>b.addEventListener("click", ()=>openDevisForm(vehicules, b.getAttribute("data-devis-veh"))));
  view.querySelectorAll("[data-cmd-idx]").forEach(b=>b.addEventListener("click", async ()=>{
    const r = rows[Number(b.getAttribute("data-cmd-idx"))];
    const veh = r.vehicule;
    const [fournisseurs, arts] = await Promise.all([getAll("fournisseurs"), getAll("articles")]);
    openCommandeForm(fournisseurs, arts, {
      urgente: true,
      vehiculeId: veh.id,
      note: "Immobilisation "+veh.immatriculation+" — "+(MOTIFS_INACTIVITE[veh.motifInactivite]||veh.motifInactivite||"motif non précisé")+(veh.detailInactivite ? " : "+veh.detailInactivite : ""),
      prefillLignes: r.manquants.map(m=>({ articleId:m.articleId, reference:m.reference, designation:m.designation, quantite: Math.max(1, m.besoin-m.dispo), prixUnitaire:m.prixUnitaire }))
    });
  }));
};

/* ---- Techniciens & synthèse mensuelle ---------------------------------- */
VIEWS.techniciens = async function(view){
  const [techniciens, ordresPourCharge] = await Promise.all([getAll("techniciens"), getAll("ordres")]);
  view.innerHTML =
    '<div class="tabs"><button class="active" data-tab="liste">Techniciens</button><button data-tab="synthese">Synthèse mensuelle</button><button data-tab="pointage">Pointage</button></div>'+
    '<div id="tabBody"></div>';
  function drawListe(){
    document.getElementById("tabBody").innerHTML =
      '<div class="view-head"><div><p class="lede">Techniciens de l\'atelier, par métier. La colonne "En charge" (véhicules dont il est responsable, OR ouverts) permet de voir en un coup d\'œil qui travaille et qui est libre — assigner plusieurs véhicules au même technicien n\'a rien de spécial, il suffit de le choisir comme responsable sur chacun. Une sanction ou un licenciement se marque ici sans supprimer la fiche : l\'historique des interventions passées reste intact.</p></div><button class="btn primary" id="newTech">+ Technicien</button></div>'+
      '<div class="toolbar"><input type="search" id="techSearch" placeholder="Rechercher un technicien…"></div>'+
      '<div class="table-wrap"><table class="grid"><thead><tr><th>Nom</th><th>Métier</th><th>Téléphone</th><th>Statut</th><th class="num">En charge</th><th></th></tr></thead><tbody id="techTbody"></tbody></table></div>';
    function draw(){
      const t = document.getElementById("techSearch").value.toLowerCase();
      const rows = techniciens.filter(x=>!t || (x.nom||"").toLowerCase().includes(t) || (METIERS[x.metier]||"").toLowerCase().includes(t));
      document.getElementById("techTbody").innerHTML = rows.length ? rows.map(x=>{
        const charge = ordresPourCharge.filter(o=>o.statut==="ouvert" && o.technicienResponsableId===x.id).length;
        return '<tr class="clickable" data-profile="'+x.id+'"><td>'+esc(x.nom)+'</td><td>'+esc(METIERS[x.metier]||x.metier)+'</td><td>'+esc(x.telephone||"—")+'</td><td>'+pill(x.statut||"actif")+'</td><td class="num">'+(charge>0 ? '<span class="pill ouvert">'+charge+' véhicule'+(charge>1?"s":"")+'</span>' : '<span class="faint">Libre</span>')+'</td><td class="row-actions"><button class="btn small" data-edit="'+x.id+'">Modifier</button></td></tr>';
      }).join("") : '<tr class="empty-row"><td colspan="6">Aucun technicien ne correspond.</td></tr>';
      document.querySelectorAll("#techTbody [data-profile]").forEach(tr=>tr.addEventListener("click", ()=>setView("technicien-detail",{id:tr.getAttribute("data-profile")})));
      document.querySelectorAll("#techTbody [data-edit]").forEach(b=>b.addEventListener("click", (e)=>{
        e.stopPropagation();
        openTechnicienForm(techniciens.find(x=>x.id===b.getAttribute("data-edit")));
      }));
    }
    draw();
    document.getElementById("techSearch").addEventListener("input", draw);
    document.getElementById("newTech").addEventListener("click", ()=>openTechnicienForm());
  }
  async function drawSynthese(){
    const [ordres, factures] = await Promise.all([getAll("ordres"), getAll("factures")]);
    const now = new Date();
    const monthDefault = now.toISOString().slice(0,7);
    document.getElementById("tabBody").innerHTML =
      '<div class="view-head"><div><p class="lede">Total des montants de main d\'œuvre par technicien, pour la paie de fin de mois — ordres de réparation et factures directes confondus.</p></div>'+
        '<div class="row-actions"><input type="month" id="monthPick" value="'+monthDefault+'"><button class="btn" id="exportCsv">Exporter en CSV</button></div></div>'+
      '<div id="syntheseBody"></div>';
    function renderMonth(month){
      const [y,m] = month.split("-").map(Number);
      const rows = [];
      ordres.forEach(o=>{
        (o.interventions||[]).forEach(i=>{
          const d = new Date(i.date);
          if(d.getFullYear()===y && (d.getMonth()+1)===m){
            rows.push({ technicien:i.technicienNom, metier: METIERS[i.metier]||i.metier, or:o.numero, description:i.description, date:i.date, montant:Number(i.montant)||0 });
          }
        });
      });
      /* Main-d'œuvre facturée hors OR (devis converti directement, ou facture
         comptoir) : comptée ici seulement quand un technicien est assigné et
         qu'aucun OR n'a déjà porté cette même ligne (orId null), pour éviter
         un double comptage avec la boucle ci-dessus. */
      factures.forEach(f=>{
        if(f.orId || f.statutPaiement==="annulee") return;
        (f.lignes||[]).forEach(l=>{
          if(l.type!=="main_oeuvre" || !l.technicienId) return;
          const d = new Date(f.date);
          if(d.getFullYear()===y && (d.getMonth()+1)===m){
            rows.push({ technicien:l.technicienNom, metier: METIERS[l.metier]||l.metier||"", or:f.numero, description:l.designation, date:f.date, montant:Number(l.montant!=null?l.montant:computeLigneMontant(l))||0 });
          }
        });
      });
      const parTech = {};
      rows.forEach(r=>{ parTech[r.technicien] = (parTech[r.technicien]||0) + r.montant; });
      const totalGeneral = rows.reduce((s,r)=>s+r.montant,0);
      document.getElementById("syntheseBody").innerHTML =
        '<div class="table-wrap"><table class="grid"><thead><tr><th>Technicien</th><th class="num">Nb. interventions</th><th class="num">Total dû</th></tr></thead><tbody>'+
          (Object.keys(parTech).length ? Object.entries(parTech).sort((a,b)=>b[1]-a[1]).map(([nom,total])=>
            '<tr><td>'+esc(nom)+'</td><td class="num">'+rows.filter(r=>r.technicien===nom).length+'</td><td class="num mono">'+fmtMoney(total)+"</td></tr>"
          ).join("") : '<tr class="empty-row"><td colspan="3">Aucune intervention ce mois-ci.</td></tr>')+
          '<tr><td colspan="2" style="font-weight:700;">Total général</td><td class="num mono" style="font-weight:700;">'+fmtMoney(totalGeneral)+"</td></tr>"+
        "</tbody></table></div>"+
        '<h3 class="section-title">Détail des interventions</h3>'+
        '<div class="table-wrap"><table class="grid"><thead><tr><th>Date</th><th>Technicien</th><th>OR</th><th>Description</th><th class="num">Montant</th></tr></thead><tbody>'+
          (rows.length ? rows.sort((a,b)=>new Date(a.date)-new Date(b.date)).map(r=>
            '<tr><td>'+fmtDate(r.date)+'</td><td>'+esc(r.technicien)+'</td><td class="mono">'+esc(r.or)+'</td><td>'+esc(r.description)+'</td><td class="num mono">'+fmtMoney(r.montant)+"</td></tr>"
          ).join("") : '<tr class="empty-row"><td colspan="5">—</td></tr>')+
        "</tbody></table></div>";
      document.getElementById("exportCsv").onclick = ()=>{
        let csv = "Technicien;Metier;OR;Description;Date;Montant\n";
        rows.forEach(r=>{ csv += [r.technicien,r.metier,r.or,r.description.replace(/;/g,","),fmtDate(r.date),r.montant].join(";")+"\n"; });
        downloadFile("synthese-main-oeuvre-"+month+".csv", csv);
        toast("Export téléchargé.");
      };
    }
    renderMonth(monthDefault);
    document.getElementById("monthPick").addEventListener("change", e=>renderMonth(e.target.value));
  }
  async function drawPointage(){
    const pointages = await getAll("pointages");
    const techActifs = techniciens.filter(t=>(t.statut||"actif")==="actif");
    const todayIsoDate = todayIso().slice(0,10);
    const monthDefault = todayIso().slice(0,7);
    const tolerance = state.config.toleranceRetardMin!=null ? state.config.toleranceRetardMin : 15;

    document.getElementById("tabBody").innerHTML =
      '<div class="view-head"><div><p class="lede">Pointage de l\'arrivée des techniciens — heure d\'ouverture '+esc(state.config.heureOuverture||"08:00")+', tolérance '+tolerance+' min (réglable dans <a href="#" id="goParams">Paramètres</a>).</p></div></div>'+
      '<h3 class="section-title">Aujourd\'hui — '+fmtDate(todayIso())+'</h3>'+
      '<div class="table-wrap"><table class="grid"><thead><tr><th>Nom</th><th>Métier</th><th>Arrivée</th><th></th></tr></thead><tbody id="pointageTbody"></tbody></table></div>'+
      '<div class="view-head" style="margin-top:8px;"><h3 class="section-title" style="margin:0;">Retards du mois</h3><div class="row-actions"><input type="month" id="pointageMonth" value="'+monthDefault+'"><button class="btn small" id="exportRetards">Exporter en CSV</button></div></div>'+
      '<div class="table-wrap"><table class="grid"><thead><tr><th>Technicien</th><th class="num">Jours pointés</th><th class="num">Retards</th></tr></thead><tbody id="retardsTbody"></tbody></table></div>';

    const goParams = document.getElementById("goParams");
    if(goParams) goParams.addEventListener("click", (e)=>{ e.preventDefault(); setView("parametres"); });

    function drawAujourdhui(){
      document.getElementById("pointageTbody").innerHTML = techActifs.length ? techActifs.map(t=>{
        const p = pointages.find(x=>x.technicienId===t.id && (x.date||"").slice(0,10)===todayIsoDate);
        return '<tr><td>'+esc(t.nom)+'</td><td>'+esc(METIERS[t.metier]||t.metier)+'</td>'+
          '<td>'+(p ? fmtDateTime(p.heureArrivee)+(p.enRetard?' <span class="pill rejete">En retard</span>':' <span class="pill attribue">À l\'heure</span>') : '<span class="faint">Non pointé</span>')+'</td>'+
          '<td class="row-actions">'+(p ? (isAdmin()?'<button class="btn small danger" data-suppr-pointage="'+p.id+'">Supprimer</button>':"") : '<button class="btn small primary" data-pointer="'+t.id+'">Marquer l\'arrivée</button>')+'</td>'+
        "</tr>";
      }).join("") : '<tr class="empty-row"><td colspan="4">Aucun technicien actif.</td></tr>';
      document.querySelectorAll("[data-pointer]").forEach(b=>b.addEventListener("click", async ()=>{
        const techId = b.getAttribute("data-pointer");
        const tech = techActifs.find(t=>t.id===techId);
        const maintenant = new Date();
        const [hO,mO] = (state.config.heureOuverture||"08:00").split(":").map(Number);
        const seuil = new Date(maintenant); seuil.setHours(hO, (mO||0)+tolerance, 0, 0);
        const enRetard = maintenant > seuil;
        await state.db.collection("pointages").add({
          technicienId: techId, date: todayIsoDate, heureArrivee: maintenant.toISOString(),
          enRetard, marquePar: actingUserName(), createdAt: todayIso(),
        });
        await logAudit("Pointage arrivée", tech.nom, enRetard?"En retard":"À l'heure");
        toast("Arrivée de "+tech.nom+" enregistrée."+(enRetard?" (en retard)":"")); setView("techniciens");
      }));
      document.querySelectorAll("[data-suppr-pointage]").forEach(b=>b.addEventListener("click", async ()=>{
        const ok = await askConfirm("Supprimer ce pointage ?", "Supprimer");
        if(!ok) return;
        try{
          await state.db.doc("pointages/"+b.getAttribute("data-suppr-pointage")).delete();
          await logAudit("Suppression pointage", "", "");
          toast("Pointage supprimé."); setView("techniciens");
        }catch(e){ toast("Erreur : "+describeError(e), "danger"); }
      }));
    }
    drawAujourdhui();

    let retardsRows = [], retardsMonth = monthDefault;
    function drawRetards(month){
      retardsMonth = month;
      const [y,m] = month.split("-").map(Number);
      const parTech = {};
      pointages.filter(p=>{ const d=new Date(p.date); return d.getFullYear()===y && (d.getMonth()+1)===m; }).forEach(p=>{
        const key = p.technicienId;
        if(!parTech[key]) parTech[key] = { jours:0, retards:0, datesRetard:[] };
        parTech[key].jours++;
        if(p.enRetard){ parTech[key].retards++; parTech[key].datesRetard.push(p.date); }
      });
      const rows = Object.entries(parTech).map(([techId, s])=>({ nom: (techniciens.find(x=>x.id===techId)||{}).nom||"?", ...s })).sort((a,b)=>b.retards-a.retards);
      retardsRows = rows;
      document.getElementById("retardsTbody").innerHTML = rows.length ? rows.map((r,i)=>
        '<tr class="'+(r.retards>0?"clickable":"")+'" '+(r.retards>0?'data-toggle-retard="'+i+'"':"")+'><td>'+esc(r.nom)+'</td><td class="num mono">'+r.jours+'</td><td class="num mono">'+(r.retards>0?'<span class="pill rejete">'+r.retards+'</span>':'0')+"</td></tr>"+
        (r.retards>0 ? '<tr data-detail-retard="'+i+'" hidden><td colspan="3" style="padding:10px 12px;color:var(--ink-muted);">Retards les : '+r.datesRetard.slice().sort().map(d=>fmtDate(d)).join(", ")+"</td></tr>" : "")
      ).join("") : '<tr class="empty-row"><td colspan="3">Aucun pointage ce mois-ci.</td></tr>';
      document.querySelectorAll("[data-toggle-retard]").forEach(tr=>tr.addEventListener("click", ()=>{
        const detail = document.querySelector('[data-detail-retard="'+tr.getAttribute("data-toggle-retard")+'"]');
        if(detail) detail.hidden = !detail.hidden;
      }));
    }
    drawRetards(monthDefault);
    document.getElementById("pointageMonth").addEventListener("change", e=>drawRetards(e.target.value));
    document.getElementById("exportRetards").addEventListener("click", ()=>{
      let csv = "Technicien;Jours pointes;Retards;Dates de retard\n";
      retardsRows.forEach(r=>{ csv += [r.nom, r.jours, r.retards, r.datesRetard.slice().sort().map(d=>fmtDate(d)).join(", ")].map(x=>String(x||"").replace(/;/g,",")).join(";")+"\n"; });
      downloadFile("retards-"+retardsMonth+".csv", csv);
      toast("Export téléchargé.");
    });
  }
  drawListe();
  view.querySelectorAll(".tabs button").forEach(b=>{
    b.addEventListener("click", ()=>{
      view.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      const tab = b.getAttribute("data-tab");
      if(tab==="liste") drawListe(); else if(tab==="synthese") drawSynthese(); else drawPointage();
    });
  });
};

function openTechnicienForm(existing){
  const t = existing || {};
  const statutActuel = t.statut || "actif";
  const body =
    '<div class="field-row" style="grid-template-columns:1fr 1fr;">'+
      '<div class="field"><label>Nom</label><input id="f_nom" value="'+esc(t.nom||"")+'"></div>'+
      '<div class="field"><label>Métier</label><select id="f_metier">'+
        Object.entries(METIERS).map(([k,v])=>'<option value="'+k+'" '+(t.metier===k?"selected":"")+'>'+v+"</option>").join("")+
      "</select></div>"+
    "</div>"+
    '<div class="field-row" style="grid-template-columns:1fr 1fr;">'+
      '<div class="field"><label>Téléphone</label><input id="f_tel" value="'+esc(t.telephone||"")+'"></div>'+
      '<div class="field"><label>Statut</label><select id="f_statut">'+
        Object.entries(TECHNICIEN_STATUTS).map(([k,v])=>'<option value="'+k+'" '+(statutActuel===k?"selected":"")+'>'+v+"</option>").join("")+
      "</select></div>"+
    "</div>"+
    '<div class="field-row" id="f_sanction_row" style="grid-template-columns:2fr 1fr;'+(statutActuel==="actif"?"display:none;":"")+'">'+
      '<div class="field"><label>Motif (sanction / licenciement)</label><input id="f_motif" value="'+esc(t.motifSanction||"")+'" placeholder="ex. absences répétées, faute professionnelle…"></div>'+
      '<div class="field"><label>Date</label><input id="f_date_sanction" type="date" value="'+esc((t.dateSanction||"").slice(0,10))+'"></div>'+
    "</div>"+
    (existing ? '<p class="faint" style="margin-top:0;">Suspendre ou licencier ne supprime rien : les interventions déjà réalisées par ce technicien restent dans son historique et dans la synthèse mensuelle.</p>' : "");
  const { close } = openModal(existing ? "Modifier le technicien" : "Nouveau technicien", body, {
    wide:true,
    footHtml: '<button class="btn ghost" id="cancel">Annuler</button><button class="btn primary" id="save">Enregistrer</button>',
    onMount(back, close){
      const statutSel = back.querySelector("#f_statut");
      const sanctionRow = back.querySelector("#f_sanction_row");
      statutSel.addEventListener("change", ()=>{
        sanctionRow.style.display = statutSel.value==="actif" ? "none" : "";
      });
      back.querySelector("#cancel").addEventListener("click", close);
      back.querySelector("#save").addEventListener("click", async ()=>{
        const nom = back.querySelector("#f_nom").value.trim();
        if(!nom){ toast("Le nom est obligatoire.", "danger"); return; }
        const statut = statutSel.value;
        const data = {
          nom, metier: back.querySelector("#f_metier").value, telephone: back.querySelector("#f_tel").value.trim(),
          statut,
          motifSanction: statut!=="actif" ? back.querySelector("#f_motif").value.trim() : null,
          dateSanction: statut!=="actif" ? (back.querySelector("#f_date_sanction").value || todayIso()) : null,
        };
        if(existing){
          await state.db.doc("techniciens/"+existing.id).update(data);
          await logAudit(statut==="actif" ? "Réactivation technicien" : (statut==="licencie" ? "Licenciement technicien" : "Suspension technicien"), nom, data.motifSanction||"");
        } else {
          await state.db.collection("techniciens").add(data);
          await logAudit("Création technicien", nom, "");
        }
        close(); toast("Technicien enregistré."); renderView();
      });
    }
  });
}

/* ---- Profil technicien --------------------------------------------------
   Le "profil" demandé n'est pas un compte de connexion : c'est cette fiche,
   qui rassemble tout ce qui atterrit chez ce mécanicien — les OR dont il est
   responsable (assignés dès l'envoi du devis à l'atelier, ou à l'ouverture
   directe d'un OR) et son historique d'interventions déjà facturées. */
VIEWS["technicien-detail"] = async function(view, params){
  const t = await getOne("techniciens", params.id);
  if(!t){ view.innerHTML = '<p class="faint">Technicien introuvable.</p>'; return; }
  const [ordres, vehicules] = await Promise.all([getAll("ordres"), getAll("vehicules")]);
  const mesOR = ordres.filter(o=>o.technicienResponsableId===t.id).sort((a,b)=>new Date(b.dateOuverture)-new Date(a.dateOuverture));
  const orEnCours = mesOR.filter(o=>o.statut==="ouvert");
  const orClotures = mesOR.filter(o=>o.statut==="cloture");

  const interventions = [];
  ordres.forEach(o=>{
    (o.interventions||[]).forEach(i=>{
      if(i.technicienId===t.id) interventions.push({ ...i, orNumero:o.numero, orId:o.id });
    });
  });
  interventions.sort((a,b)=>new Date(b.date)-new Date(a.date));
  const totalMO = interventions.reduce((s,i)=>s+(Number(i.montant)||0),0);

  view.innerHTML =
    '<button class="back-link" id="back">&larr; Retour aux techniciens</button>'+
    '<div class="view-head"><div><h2 style="font-size:1.6rem;">'+esc(t.nom)+'</h2>'+
      '<p class="lede">'+esc(METIERS[t.metier]||t.metier)+(t.telephone?" · "+esc(t.telephone):"")+'</p></div>'+
      '<div class="row-actions">'+pill(t.statut||"actif")+'<button class="btn" id="editTech">Modifier</button></div></div>'+
    (t.statut && t.statut!=="actif" ? '<div class="callout '+(t.statut==="licencie"?"danger":"amber")+'"><span class="lbl">'+esc(TECHNICIEN_STATUTS[t.statut]||t.statut)+'</span><p>'+(t.motifSanction?esc(t.motifSanction):"Aucun motif renseigné.")+(t.dateSanction?" — "+fmtDate(t.dateSanction):"")+'</p></div>' : "")+
    '<div class="kpi-grid">'+
      '<div class="kpi"><div class="lbl">OR en cours (responsable)</div><div class="val">'+orEnCours.length+'</div></div>'+
      '<div class="kpi"><div class="lbl">OR clôturés (responsable)</div><div class="val">'+orClotures.length+'</div></div>'+
      '<div class="kpi"><div class="lbl">Total main d\'œuvre facturée</div><div class="val">'+fmtMoney(totalMO)+'</div><div class="sub">'+interventions.length+' intervention(s), toutes périodes</div></div>'+
    "</div>"+
    '<h3 class="section-title">OR dont il est responsable</h3>'+
    '<div class="table-wrap"><table class="grid"><thead><tr><th>N°</th><th>Véhicule</th><th>Ouverture</th><th>Statut</th></tr></thead><tbody>'+
      (mesOR.length ? mesOR.map(o=>{
        const veh = vehicules.find(v=>v.id===o.vehiculeId);
        return '<tr class="clickable" data-or="'+o.id+'"><td class="mono">'+esc(o.numero)+'</td><td class="mono">'+esc(veh?veh.immatriculation:"—")+'</td><td>'+fmtDate(o.dateOuverture)+'</td><td>'+pill(o.statut)+"</td></tr>";
      }).join("") : '<tr class="empty-row"><td colspan="4">Aucun OR assigné à ce technicien pour le moment.</td></tr>')+
    "</tbody></table></div>"+
    '<h3 class="section-title">Interventions récentes</h3>'+
    '<div class="table-wrap"><table class="grid"><thead><tr><th>Date</th><th>OR</th><th>Description</th><th class="num">Montant</th></tr></thead><tbody>'+
      (interventions.length ? interventions.slice(0,25).map(i=>
        '<tr class="clickable" data-or="'+i.orId+'"><td>'+fmtDate(i.date)+'</td><td class="mono">'+esc(i.orNumero)+'</td><td>'+esc(i.description)+'</td><td class="num mono">'+fmtMoney(i.montant)+"</td></tr>"
      ).join("") : '<tr class="empty-row"><td colspan="4">Aucune intervention enregistrée.</td></tr>')+
    "</tbody></table></div>";

  view.querySelector("#back").addEventListener("click", ()=>setView("techniciens"));
  view.querySelector("#editTech").addEventListener("click", ()=>openTechnicienForm(t));
  view.querySelectorAll("[data-or]").forEach(tr=>tr.addEventListener("click", ()=>setView("atelier-detail",{id:tr.getAttribute("data-or")})));
};

/* ---- Contrôle hebdomadaire des véhicules ---------------------------------
   Critères basés sur ce qui se vérifie couramment sur une flotte VTC pour
   juger si un chauffeur prend soin de son véhicule — pas une norme
   officielle, juste un jeu de départ raisonnable, modifiable si besoin. */
const CRITERES_CONTROLE = [
  { cle:"proprete_exterieure", label:"Propreté extérieure (carrosserie lavée)" },
  { cle:"proprete_interieure", label:"Propreté intérieure (sans détritus)" },
  { cle:"etat_pneus", label:"État des pneus (usure, pression visuelle)" },
  { cle:"niveaux", label:"Niveaux (huile, liquide de refroidissement, lave-glace)" },
  { cle:"eclairage", label:"Éclairage fonctionnel (phares, clignotants, feux stop)" },
  { cle:"voyants", label:"Tableau de bord — aucun voyant d'alerte allumé" },
  { cle:"carrosserie", label:"Carrosserie — pas de nouveaux chocs/rayures" },
  { cle:"documents_bord", label:"Documents à bord (carte grise, assurance)" },
  { cle:"ceintures", label:"Ceintures de sécurité fonctionnelles" },
  { cle:"sieges", label:"État des sièges et tapis" },
  { cle:"odeurs", label:"Absence d'odeurs suspectes (tabac, carburant)" },
  { cle:"kilometrage", label:"Kilométrage cohérent avec l'usage" },
];
const STATUT_CONTROLE_LABELS = { bon:"Bon", a_surveiller:"À surveiller", problematique:"Problématique" };
const STATUT_CONTROLE_CLASS = { bon:"attribue", a_surveiller:"partielle", problematique:"refuse" };
const SEUIL_JOURS_CONTROLE = 7;

VIEWS.controle = async function(view){
  const [vehicules, controles] = await Promise.all([getAll("vehicules"), getAll("controles_vehicule")]);
  const actifs = vehicules.filter(v=>v.statut!=="sorti_de_flotte");
  const dernierControle = {};
  controles.forEach(c=>{
    if(!dernierControle[c.vehiculeId] || new Date(c.date) > new Date(dernierControle[c.vehiculeId].date)) dernierControle[c.vehiculeId] = c;
  });
  const maintenant = Date.now();
  const enRetard = actifs.filter(v=>{
    const d = dernierControle[v.id];
    return !d || (maintenant - new Date(d.date).getTime())/86400000 > SEUIL_JOURS_CONTROLE;
  });

  const APERCU_EN_RETARD = 10;

  view.innerHTML =
    '<div class="view-head"><div><p class="lede">Contrôle hebdomadaire de l\'état des véhicules — propreté, usure, éclairage… pour vérifier que le chauffeur en prend soin.</p></div>'+
      '<div class="row-actions"><button class="btn" id="exportControles">Exporter en CSV</button><button class="btn primary" id="newControle">+ Nouveau contrôle</button></div></div>'+
    (enRetard.length ? '<div class="callout amber"><span class="lbl">En retard</span>'+
      '<p>'+enRetard.length+' véhicule(s) sans contrôle depuis plus de '+SEUIL_JOURS_CONTROLE+' jours (ou jamais contrôlés) : '+
      enRetard.slice(0,APERCU_EN_RETARD).map(v=>esc(v.immatriculation)).join(", ")+
      (enRetard.length>APERCU_EN_RETARD ? ' et <a href="#" id="toggleEnRetard">'+(enRetard.length-APERCU_EN_RETARD)+' de plus…</a>' : ".")+
      '</p>'+
      (enRetard.length>APERCU_EN_RETARD ? '<p id="resteEnRetard" hidden>'+esc(enRetard.slice(APERCU_EN_RETARD).map(v=>v.immatriculation).join(", "))+'.</p>' : "")+
      '<button class="btn small ghost" id="exportEnRetard" style="margin-top:6px;">Exporter cette liste en CSV</button>'+
    '</div>' : "")+
    '<div class="toolbar"><input type="search" id="ctrlSearch" placeholder="Rechercher une immatriculation, un chauffeur…"></div>'+
    '<div class="table-wrap"><table class="grid"><thead><tr><th>Véhicule</th><th>Chauffeur</th><th>Dernier contrôle</th><th>Statut</th><th></th></tr></thead><tbody id="ctrlTbody"></tbody></table></div>';

  const toggleEnRetard = document.getElementById("toggleEnRetard");
  if(toggleEnRetard) toggleEnRetard.addEventListener("click", (e)=>{
    e.preventDefault();
    const reste = document.getElementById("resteEnRetard");
    reste.hidden = !reste.hidden;
    toggleEnRetard.textContent = reste.hidden ? (enRetard.length-APERCU_EN_RETARD)+" de plus…" : "réduire";
  });
  const exportEnRetardBtn = document.getElementById("exportEnRetard");
  if(exportEnRetardBtn) exportEnRetardBtn.addEventListener("click", ()=>{
    let csv = "Immatriculation;Chauffeur;Dernier controle\n";
    enRetard.forEach(v=>{
      const d = dernierControle[v.id];
      csv += [v.immatriculation, v.chauffeurNom||"", d?fmtDate(d.date):"Jamais"].join(";")+"\n";
    });
    downloadFile("vehicules-en-retard-controle.csv", csv);
    toast("Export téléchargé.");
  });
  document.getElementById("exportControles").addEventListener("click", ()=>{
    let csv = "Immatriculation;Chauffeur;Dernier controle;Statut;Observations\n";
    actifs.forEach(v=>{
      const d = dernierControle[v.id];
      csv += [v.immatriculation, v.chauffeurNom||"", d?fmtDate(d.date):"Jamais", d?(STATUT_CONTROLE_LABELS[d.statutGlobal]||d.statutGlobal):"", d?(d.observations||"").replace(/;/g,","):""].join(";")+"\n";
    });
    downloadFile("controles-vehicules.csv", csv);
    toast("Export téléchargé.");
  });

  function draw(filter){
    const f = (filter||"").toLowerCase();
    const rows = actifs.filter(v=>!f || (v.immatriculation||"").toLowerCase().includes(f) || (v.chauffeurNom||"").toLowerCase().includes(f));
    document.getElementById("ctrlTbody").innerHTML = rows.length ? rows.map(v=>{
      const d = dernierControle[v.id];
      return '<tr><td class="mono">'+esc(v.immatriculation)+'</td><td>'+esc(v.chauffeurNom||"—")+'</td>'+
        '<td>'+(d?fmtDate(d.date):'<span class="faint">Jamais</span>')+'</td>'+

      const a = articles.find(x=>x.id===tr.getAttribute("data-row"));
      tr.style.display = (!t || (a.reference||"").toLowerCase().includes(t) || (a.designation||"").toLowerCase().includes(t)) ? "" : "none";

    inp.addEventListener("input", ()=>{

      const a = articles.find(x=>x.id===id);

      const cell = document.querySelector('[data-ecart="'+id+'"]');

      cell.style.color = ecart!==0 ? "var(--danger)" : "var(--ink-muted)";

  });

    if(!isAdmin()){ toast("Seul un administrateur peut valider un comptage.", "danger"); return; }
    const lignes = [];
    let ecartsCount = 0;
    document.querySelectorAll("[data-count]").forEach(inp=>{
      const id = inp.getAttribute("data-count");
      const a = articles.find(x=>x.id===id);
      const compte = Number(inp.value)||0;
      const ecart = compte - (a.stockQte||0);

    const ok = await askConfirm(ecartsCount+" écart(s) détecté(s). Valider et ajuster le stock en conséquence ?", "Valider");
    if(!ok) return;
    for(const l of lignes){
      if(l.ecart!==0) await ajusterStock(l.articleId, l.ecart, "ajustement", "comptage", "—", "Comptage du "+fmtDate(todayIso()));
    }
    await state.db.collection("comptages").add({ date: todayIso(), statut:"valide", lignes, validePar: actingUserName(), dateValidation: todayIso() });
    await logAudit("Validation comptage", "", ecartsCount+" écart(s)");

  });

/* ---- Clients (suivi des virements JET_S et attribution de véhicules) -----
   Second flux d'activité de l'utilisateur, distinct de l'atelier : vente/
   financement de véhicules par virement bancaire. Le parcours suivi ici est
   envoi des justificatifs (virement enregistré) → confirmation de réception
   des fonds (validé/en attente/rejeté) → attribution d'un véhicule (existant
   ou nouvellement créé, qui rejoint alors la flotte "Véhicules"). */
/* ---- Suivi de progression client (fonds reçus vs véhicules souhaités) ----
   Un client peut souhaiter plusieurs véhicules, éventuellement de modèles
   différents (demandes_vehicule). Ses virements validés remplissent ses
   demandes dans l'ordre où elles ont été ajoutées (1ère demande d'abord, le
   surplus va à la suivante, etc.) — c'est cette allocation qui détermine
   quelle demande est "prête à attribuer" et depuis quand. */
function totalRecuValideClient(clientId, virements){
  return virements.filter(v=>v.clientId===clientId && v.statut==="valide").reduce((s,v)=>s+(Number(v.montantRecu)||0),0);
}
const SEUIL_VALIDATION_MANUELLE = 0.9;

function allouerDemandes(clientId, demandes, virements){
  const mesDemandes = demandes.filter(d=>d.clientId===clientId).slice().sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
  const valides = virements.filter(v=>v.clientId===clientId && v.statut==="valide")
    .slice().sort((a,b)=>new Date(a.dateVirement||a.createdAt)-new Date(b.dateVirement||b.createdAt));
  const totalRecu = valides.reduce((s,v)=>s+(Number(v.montantRecu)||0),0);
  let seuilCum = 0;
  return mesDemandes.map(d=>{
    const cout = Number(d.cout)||0;
    seuilCum += cout;
    const recuAlloue = Math.max(0, Math.min(cout, totalRecu - (seuilCum - cout)));
    const atteintNaturellement = cout>0 && totalRecu>=seuilCum;
    /* Un admin peut faire basculer manuellement en "prêt" une demande dont
       le montant alloué dépasse déjà SEUIL_VALIDATION_MANUELLE (90%), sans
       attendre les derniers versements — basculerPretManuel(). */
    const valideManuellement = !atteintNaturellement && !!d.valideManuellement;
    const pret = atteintNaturellement || valideManuellement;
    let dateAtteint = null;
    if(atteintNaturellement){
      let cum = 0;
      for(const v of valides){
        cum += Number(v.montantRecu)||0;
        if(cum >= seuilCum){ dateAtteint = v.dateVirement||v.createdAt; break; }
      }
    } else if(valideManuellement){
      dateAtteint = d.dateValidationManuelle || d.createdAt;
    }
    return { demande: d, cout, recuAlloue, pret, dateAtteint, valideManuellement };
  });
}
function renderProgressBar(recu, cout){
  const pct = cout>0 ? Math.min(100, Math.round(recu/cout*100)) : (recu>0 ? 100 : 0);
  const cls = pct>=100 ? "good" : (pct>=50 ? "amber" : "danger");
  return '<div class="progress-bar"><div class="progress-fill '+cls+'" style="width:'+pct+'%;"></div></div><span class="progress-label">'+pct+"%</span>";
}
function renderStepper(steps){
  return '<div class="stepper">'+steps.map((s,i)=>
    '<div class="step '+(s.done?"done":(s.current?"current":""))+'">'+
      '<div class="step-dot">'+(s.done?"&check;":(i+1))+'</div>'+
      '<div class="step-label">'+esc(s.label)+'</div>'+
    '</div>'
  ).join('<div class="step-line"></div>')+'</div>';
}
function stepsPourClient(mesVirements, allocations){
  const totalRecu = mesVirements.filter(v=>v.statut==="valide").reduce((s,v)=>s+(Number(v.montantRecu)||0),0);
  const envoye = mesVirements.length>0;
  const confirme = totalRecu>0;
  const hasDemandes = allocations.length>0;
  const toutesAtteintes = hasDemandes && allocations.every(a=>a.pret);
  const toutesAttribuees = hasDemandes && allocations.every(a=>a.demande.statut==="attribue");
  const s1 = { label:"Justificatif envoyé", done: envoye };
  const s2 = { label:"Fonds confirmés", done: confirme };
  const s3 = { label: hasDemandes ? "Montant(s) atteint(s)" : "Aucun véhicule souhaité", done: toutesAtteintes };
  const s4 = { label:"Véhicule(s) attribué(s)", done: toutesAttribuees };
  [s1,s2,s3,s4].forEach((s,i,arr)=>{ if(!s.done && !arr.slice(0,i).some(x=>!x.done)) s.current = true; });
  return [s1,s2,s3,s4];
}

function statutAttributionClient(demandesClient){
  if(!demandesClient.length) return { cls:"brouillon", label:"Aucun véhicule souhaité" };
  const attribues = demandesClient.filter(d=>d.statut==="attribue").length;
  if(attribues===demandesClient.length) return { cls:"attribue", label:"Attribué" };
  if(attribues>0) return { cls:"partielle", label:"Partiel ("+attribues+"/"+demandesClient.length+")" };
  return { cls:"en_attente", label:"En attente" };
}

function libelleVehicule(demande){
  return demande.modeleNom + ((demande.partDenominateur||1)>1 ? " (1/"+demande.partDenominateur+")" : "");
}
/* Petite icône "voiture" colorée par modèle (couleur dérivée du nom, stable
   d'un affichage à l'autre, sans nouveau champ à gérer sur le catalogue) —
   affichée en ligne devant le nom du client dans l'onglet "Tous" ; le nom
   exact du véhicule souhaité apparaît en infobulle au survol. */
const PALETTE_MODELES = ["#2563eb","#059669","#d97706","#dc2626","#7c3aed","#0891b2","#db2777","#65a30d","#0d9488","#9333ea"];
function couleurModele(nom){
  let h = 0;
  for(let i=0;i<nom.length;i++) h = (h*31 + nom.charCodeAt(i)) >>> 0;
  return PALETTE_MODELES[h % PALETTE_MODELES.length];
}
function iconeVehiculeSouhaite(demande, modeles){
  const label = libelleVehicule(demande);
  /* La couleur doit distinguer les véhicules entre eux, pas seulement les
     modèles reconnus du catalogue — sinon toute demande sans modeleId lié
     (texte libre, import pas encore rattaché) retombe sur "Non déterminé"
     et tous ses icônes deviennent gris, ce qui donnait l'impression que la
     couleur ne variait jamais. On ne garde le gris que pour l'absence
     totale de nom exploitable. */
  const type = typeVehiculeCatalogue(demande, modeles);
  const cleCouleur = type!=="Non déterminé" ? type : (demande.modeleNom||"");
  const couleur = cleCouleur ? couleurModele(cleCouleur) : "var(--ink-faint)";
  return '<span title="'+esc(label)+'" style="display:inline-flex;vertical-align:middle;color:'+couleur+';margin-right:3px;">'+
    svgIco('<path d="M4 13.5 5 9.6a1.6 1.6 0 0 1 1.55-1.2h6.9A1.6 1.6 0 0 1 15 9.6l1 3.9"/><rect x="2.8" y="13.5" width="14.4" height="2.6" rx="1.2"/><circle cx="6.3" cy="16.6" r="1.3"/><circle cx="13.7" cy="16.6" r="1.3"/>')+
  "</span>";
}
/* Pour classer/regrouper par "type de véhicule" (Prêts à attribuer, Par
   véhicule souhaité), on n'accepte que les modèles réellement présents dans
   le catalogue — un texte libre ("Budget en dessous de 10 000 €") ou un
   commentaire de prix non nettoyé ne sont pas des types exploitables pour
   repérer qui pourrait partager un même véhicule. */
function typeVehiculeCatalogue(demande, modeles){
  const m = demande.modeleId ? modeles.find(x=>x.id===demande.modeleId) : null;
  return m ? m.nom : "Non déterminé";
}
/* Nombre de véhicules physiques réellement nécessaires pour un groupe de
   clients, en tenant compte des parts (1/2, 1/3…) — ex. 6 clients à 1/2
   chacun ne correspondent qu'à 3 véhicules à commander, pas 6. */
function sommeVehiculesEquivalents(list){
  const total = list.reduce((s,x)=>s+1/((x.demande.partDenominateur)||1), 0);
  return Math.round(total*100)/100;
}

        '<div class="row-actions"><button class="btn" id="modelesVeh">Modèles de véhicules</button><button class="btn" id="importVirements">Importer virements (CSV)</button><button class="btn" id="importCsv">Importer CSV</button><button class="btn primary" id="newClient">+ Nouveau client</button></div></div>'+
      '<div class="toolbar"><input type="search" id="cliSearch" placeholder="Rechercher par nom, téléphone…"></div>'+

  function drawAttente(){

      (enCours.length ? enCours.map(x=>{

          '<td class="row-actions">'+(peutValider ? '<button class="btn small primary" data-valider-manuel="'+x.demande.id+'">Marquer prêt à attribuer</button>' : "")+"</td></tr>";
      }).join("") : '<tr class="empty-row"><td colspan="4">Aucun client en cours.</td></tr>')+
      "</tbody></table></div>";

    document.getElementById("tabBody").innerHTML = html;
    document.querySelectorAll("#tabBody [data-id]").forEach(el=>el.addEventListener("click", ()=>setView("client-detail",{id:el.getAttribute("data-id")})));
    document.querySelectorAll("#tabBody [data-attribuer]").forEach(b=>b.addEventListener("click", (e)=>{
      e.stopPropagation();
      const item = prets.find(x=>x.demande.id===b.getAttribute("data-attribuer"));
      if(item) getAll("vehicules").then(vehicules=>openAttributionForm(item.c, item.demande, vehicules, item));
    }));
    document.querySelectorAll("#tabBody [data-valider-manuel]").forEach(b=>b.addEventListener("click", (e)=>{
      e.stopPropagation();
      const item = enCours.find(x=>x.demande.id===b.getAttribute("data-valider-manuel"));
      if(item) basculerPretManuel(item, item.c, ()=>setView("clients",{filter:"attente"}));
    }));
    document.getElementById("exportAttente").addEventListener("click", ()=>{
      let csv = "Client;Telephone;Vehicule souhaite;Type;Part;Recu;Cout;Statut;Pret depuis\n";
      items.forEach(x=>{

          x.c.nom+" "+(x.c.prenoms||""), x.c.telephone||"",
          libelleVehicule(x.demande), typeVehiculeCatalogue(x.demande, modeles),
          "1/"+(x.demande.partDenominateur||1), x.recuAlloue, x.cout,

          x.pret ? fmtDate(x.dateAtteint) : "",
        ].map(v=>String(v||"").replace(/;/g,",")).join(";")+"\n";
      });
      downloadFile("clients-en-attente-attribution.csv", csv);
      toast("Export téléchargé.");
    });

  function drawTypes(){
    const items = [];
    clients.forEach(c=>{
      allouerDemandes(c.id, demandes, virements).forEach(a=>{
        items.push({ c, ...a, type: typeVehiculeCatalogue(a.demande, modeles) });
      });
    });
    const types = Array.from(new Set(items.map(x=>x.type))).sort((a,b)=>a.localeCompare(b));

    document.getElementById("tabBody").innerHTML =
      '<div class="view-head"><div><p class="lede">Tous les véhicules souhaités — filtre par type pour repérer les clients qui pourraient partager un même véhicule (parts 1/2, 1/3…).</p></div></div>'+
      '<div class="toolbar" style="display:flex;gap:10px;flex-wrap:wrap;">'+
        '<select id="typeFilter" style="max-width:280px;">'+
          '<option value="">Tous les types ('+items.length+')</option>'+
          types.map(t=>'<option value="'+esc(t)+'">'+esc(t)+" ("+items.filter(x=>x.type===t).length+")</option>").join("")+
        "</select>"+
        '<input type="search" id="typeSearch" placeholder="Rechercher un client…" style="flex:1;min-width:200px;">'+
      "</div>"+
      '<p class="faint" id="typeSummary" style="margin:10px 0;"></p>'+
      '<div class="table-wrap"><table class="grid"><thead><tr><th>Client</th><th>Type de véhicule</th><th>Part</th><th class="num">Alloué / Coût</th><th>Statut</th></tr></thead><tbody id="typesTbody"></tbody></table></div>';

    function draw(){
      const typeSel = document.getElementById("typeFilter").value;
      const f = document.getElementById("typeSearch").value.toLowerCase();
      const rows = items.filter(x=>(!typeSel || x.type===typeSel) && (!f || (x.c.nom+" "+(x.c.prenoms||"")).toLowerCase().includes(f)))
        .sort((a,b)=> a.type.localeCompare(b.type) || (a.c.nom||"").localeCompare(b.c.nom||""));
      const nbVehicules = sommeVehiculesEquivalents(rows);
      document.getElementById("typeSummary").textContent = rows.length+" client(s)"+(nbVehicules!==rows.length ? ", soit "+nbVehicules+" véhicule(s) (parts comprises)" : "");
      document.getElementById("typesTbody").innerHTML = rows.length ? rows.map(x=>
        '<tr class="clickable" data-id="'+x.c.id+'"><td>'+esc(x.c.nom)+' '+esc(x.c.prenoms||"")+'</td>'+
        '<td>'+esc(x.type)+'</td>'+
        '<td>1/'+(x.demande.partDenominateur||1)+'</td>'+
        '<td class="num mono">'+fmtMoney(x.recuAlloue)+' / '+fmtMoney(x.cout)+'</td>'+
        '<td>'+pill(x.demande.statut||"en_attente")+'</td></tr>'
      ).join("") : '<tr class="empty-row"><td colspan="5">Aucun véhicule souhaité ne correspond.</td></tr>';
      document.querySelectorAll("#typesTbody [data-id]").forEach(el=>el.addEventListener("click", ()=>setView("client-detail",{id:el.getAttribute("data-id")})));
    }
    draw();
    document.getElementById("typeFilter").addEventListener("change", draw);
    document.getElementById("typeSearch").addEventListener("input", draw);
  }

  function drawList(tab){ tab==="attente" ? drawAttente() : (tab==="types" ? drawTypes() : drawTous()); }
  drawList(initialTab);
  view.querySelectorAll(".tabs button").forEach(b=>{
    b.addEventListener("click", ()=>{
      view.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      drawList(b.getAttribute("data-tab"));
    });
  });
};

/* Combobox véhicule (catalogue + "Autre") — un seul contrôle pour choisir
   modèle + coût, avec repli en saisie libre pour un cas hors catalogue.
   Réutilisé pour chaque demande de véhicule d'un client (openDemandeForm).
   fromUserChange=false (affichage initial) garde tel quel ce qui est déjà
   enregistré, même si le catalogue a changé de prix depuis ; =true (menu
   changé par l'utilisateur) applique le prix catalogue courant. */
/* partSelectEl : <select> des parts (1, 2, 3 = véhicule entier, moitié,
   tiers) — quand un modèle du catalogue est choisi, le coût de CETTE part
   est le prix catalogue divisé par le dénominateur, recalculé à chaque
   changement de véhicule ou de part (mais jamais à l'ouverture du
   formulaire, cf. sync(false) dans openClientForm/openDemandeForm). */
function mountVehiculePicker(pickEl, customRowEl, vehInputEl, coutInputEl, partSelectEl, modeles, initial){
  const AUTRE_ID = "__autre__";
  const items = modeles.concat([{ id: AUTRE_ID, nom:"Autre / personnalisé…", cout:null }]);
  let selectedId = initial.modeleId || null;
  if(!selectedId && initial.nom){
    const texte = initial.nom.toLowerCase();
    const trouve = modeles.find(m=> texte.includes(m.nom.toLowerCase()));
    selectedId = trouve ? trouve.id : AUTRE_ID;
  }
  function part(){ return Number(partSelectEl.value)||1; }
  function sync(fromUserChange){
    const isAutre = !selectedId || selectedId===AUTRE_ID;
    customRowEl.style.display = isAutre ? "" : "none";
    if(isAutre){
      vehInputEl.readOnly = false; coutInputEl.readOnly = false;
    } else {
      const m = modeles.find(x=>x.id===selectedId);
      vehInputEl.readOnly = true; coutInputEl.readOnly = true;
      if(fromUserChange){ vehInputEl.value = m.nom; coutInputEl.value = Math.round(m.cout/part()); }
      else { vehInputEl.value = initial.nom || m.nom; coutInputEl.value = initial.cout || Math.round(m.cout/part()); }
    }
  }
  mountSearchableSelect(pickEl, {
    items, getId: x=>x.id, getLabel: x=> x.id===AUTRE_ID ? x.nom : x.nom+" ("+fmtMoney(x.cout)+")",
    value: selectedId, placeholder: "Choisir un véhicule…",
    onChange: (id)=>{ selectedId = id; sync(true); }
  });
  partSelectEl.addEventListener("change", ()=> sync(true));
  sync(false);
  return { getSelectedId: ()=> (selectedId===AUTRE_ID ? null : selectedId) };
}

    wide:true,

    onMount(back, close){
      back.querySelector("#cancel").addEventListener("click", close);

        const telephone = back.querySelector("#f_tel").value.trim();
        if(!nom || !telephone){ toast("Le nom et le téléphone sont obligatoires.", "danger"); return; }

function openModelesVehiculeManager(){
  const body =
    (isAdmin() ? '<div class="field-row" style="grid-template-columns:2fr 1fr auto;align-items:end;">'+
      '<div class="field"><label>Nom du modèle</label><input id="m_nom" placeholder="ex. Kaiyi E5"></div>'+

    footHtml: '<button class="btn ghost" id="cancel">Fermer</button>',
    async onMount(back, close){
      back.querySelector("#cancel").addEventListener("click", close);

        back.querySelector("#modelesTbody").innerHTML = modeles.length ? modeles.map(m=>
          "<tr><td>"+esc(m.nom)+'</td><td class="num mono">'+fmtMoney(m.cout)+"</td>"+
          (isAdmin() ? '<td class="row-actions"><button class="btn small" data-edit="'+m.id+'">Modifier</button><button class="btn small danger" data-delete="'+m.id+'">Supprimer</button></td>' : "")+
          "</tr>"

        if(isAdmin()){
          back.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click", ()=>{
            const m = modeles.find(x=>x.id===b.getAttribute("data-edit"));
            back.querySelector("#m_nom").value = m.nom;
            back.querySelector("#m_cout").value = m.cout;
            back.querySelector("#m_add").textContent = "Enregistrer";
            back.querySelector("#m_add").setAttribute("data-editing", m.id);
          }));
          back.querySelectorAll("[data-delete]").forEach(b=>b.addEventListener("click", async ()=>{
            const ok = await askConfirm("Supprimer ce modèle du catalogue ? Les clients l'ayant déjà choisi gardent leur type et coût actuels.", "Supprimer");
            if(!ok) return;
            try{
              await state.db.doc("modeles_vehicule/"+b.getAttribute("data-delete")).delete();
              await logAudit("Suppression modèle véhicule", "", "");
              toast("Modèle supprimé."); draw();
            }catch(e){ toast("Erreur : "+describeError(e), "danger"); }
          }));
        }
      }
      draw();
      const addBtn = back.querySelector("#m_add");
      if(addBtn) addBtn.addEventListener("click", async ()=>{
        const nom = back.querySelector("#m_nom").value.trim();
        const cout = Number(back.querySelector("#m_cout").value)||0;
        if(!nom){ toast("Le nom du modèle est obligatoire.", "danger"); return; }
        const editingId = addBtn.getAttribute("data-editing");
        try{
          if(editingId){
            await state.db.doc("modeles_vehicule/"+editingId).update({ nom, cout });
            await logAudit("Modification modèle véhicule", nom, "");
          } else {
            await state.db.collection("modeles_vehicule").add({ nom, cout, createdAt: todayIso() });
            await logAudit("Création modèle véhicule", nom, "");
          }
        }catch(e){ toast("Erreur : "+describeError(e), "danger"); return; }
        back.querySelector("#m_nom").value = ""; back.querySelector("#m_cout").value = "";
        addBtn.textContent = "+ Ajouter"; addBtn.removeAttribute("data-editing");
        toast("Modèle enregistré."); draw();
      });
    }
  });
}

    }));
    view.querySelectorAll("[data-delete-dem]").forEach(b=>b.addEventListener("click", ()=>eliminerDemande(c, b.getAttribute("data-delete-dem"))));
    view.querySelectorAll("[data-valider-manuel]").forEach(b=>b.addEventListener("click", ()=>{
      const a = allocations.find(x=>x.demande.id===b.getAttribute("data-valider-manuel"));
      if(a) basculerPretManuel(a, c, ()=>setView("client-detail",{id:c.id}));
    }));
  }
  drawDemandes();

  function drawVirements(){
    view.querySelector("#virTbody").innerHTML = mesVirements.length ? mesVirements.map(v=>
      "<tr>"+
        "<td>"+fmtDate(v.dateVirement||v.createdAt)+"</td>"+
        '<td class="num mono">'+fmtMoney(v.montantEnvoye)+"</td>"+
        '<td class="num mono">'+fmtMoney(v.montantRecu)+"</td>"+
        "<td>"+pill(v.statut||"en_attente")+"</td>"+
        "<td>"+esc(v.reference||"—")+"</td>"+
        '<td class="row-actions">'+
          (v.statut==="en_attente" ? '<button class="btn small" data-valider="'+v.id+'">Valider</button><button class="btn small ghost" data-rejeter="'+v.id+'">Rejeter</button>' : '<button class="btn small" data-edit="'+v.id+'">Modifier</button>')+
          (isAdmin() ? '<button class="btn small danger" data-delete-vir="'+v.id+'">Supprimer</button>' : "")+
        "</td>"+
      "</tr>"
    ).join("") : '<tr class="empty-row"><td colspan="6">Aucun virement enregistré.</td></tr>';
    view.querySelectorAll("[data-valider]").forEach(b=>b.addEventListener("click", async ()=>{
      const v = mesVirements.find(x=>x.id===b.getAttribute("data-valider"));
      let montantRecu = Number(v.montantRecu)||0;
      /* Si le montant reçu n'a jamais été renseigné (import "en attente" par
         exemple), valider sans le demander laisserait 0 F reçu malgré le
         statut "Validé" — on le demande donc explicitement à ce moment-là,
         plutôt que de le déduire silencieusement. */
      if(!montantRecu){
        const body = '<p class="muted" style="margin-top:0;">Le montant reçu n\'est pas renseigné pour ce virement.</p><div class="field"><label>Montant reçu (F CFA)</label><input id="f_recu_valid" type="number" value="'+esc(v.montantEnvoye||0)+'"></div>';
        montantRecu = await new Promise(resolve=>{
          const { close } = openModal("Confirmer la réception — "+c.nom, body, {
            footHtml: '<button class="btn ghost" id="cancel">Annuler</button><button class="btn primary" id="ok">Valider</button>',
            onMount(back, closeFn){
              back.querySelector("#cancel").addEventListener("click", ()=>{ closeFn(); resolve(null); });
              back.querySelector("#ok").addEventListener("click", ()=>{
                const m = Number(back.querySelector("#f_recu_valid").value)||0;
                closeFn(); resolve(m);
              });
            }
          });
        });
        if(montantRecu==null) return;
      }
      await state.db.doc("virements/"+v.id).update({ statut:"valide", montantRecu });
      await logAudit("Virement validé", c.nom, "");
      toast("Virement validé."); setView("client-detail",{id:c.id});
    }));
    view.querySelectorAll("[data-rejeter]").forEach(b=>b.addEventListener("click", async ()=>{
      const ok = await askConfirm("Rejeter ce virement ?", "Rejeter");
      if(!ok) return;
      await state.db.doc("virements/"+b.getAttribute("data-rejeter")).update({ statut:"rejete" });
      await logAudit("Virement rejeté", c.nom, "");
      toast("Virement rejeté."); setView("client-detail",{id:c.id});
    }));
    view.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click", ()=>openVirementForm(c, mesVirements.find(v=>v.id===b.getAttribute("data-edit")))));
    view.querySelectorAll("[data-delete-vir]").forEach(b=>b.addEventListener("click", async ()=>{
      const ok = await askConfirm("Supprimer définitivement ce virement ?", "Supprimer");
      if(!ok) return;
      try{
        await state.db.doc("virements/"+b.getAttribute("data-delete-vir")).delete();
        await logAudit("Suppression virement", c.nom, "");
        toast("Virement supprimé."); setView("client-detail",{id:c.id});
      }catch(e){ toast("Erreur : "+describeError(e), "danger"); }
    }));
  }
  drawVirements();

  view.querySelector("#back").addEventListener("click", ()=>setView("clients"));
  view.querySelector("#editClient").addEventListener("click", ()=>openClientForm(c));
  view.querySelector("#newVirement").addEventListener("click", ()=>openVirementForm(c));
  view.querySelector("#newDemande").addEventListener("click", ()=>openDemandeForm(c, modeles));
  const deleteBtn = view.querySelector("#deleteClient");
  if(deleteBtn) deleteBtn.addEventListener("click", ()=>eliminerClient(c));
};

/* Fait basculer manuellement une demande à plus de 90% du montant en "prêt
   à attribuer", sans attendre les derniers versements — réservé aux
   administrateurs, avec confirmation explicite. */
async function basculerPretManuel(allocation, client, retourView){
  if(!isAdmin()){ toast("Seul un administrateur peut valider ce basculement.", "danger"); return; }
  const pct = allocation.cout>0 ? Math.round(allocation.recuAlloue/allocation.cout*100) : 0;
  const ok = await askConfirm("Faire basculer \""+allocation.demande.modeleNom+"\" ("+client.nom+", "+pct+"% du montant) en \"prêt à attribuer\" sans attendre le solde ?", "Valider");
  if(!ok) return;
  try{
    await state.db.doc("demandes_vehicule/"+allocation.demande.id).update({ valideManuellement:true, dateValidationManuelle: todayIso() });
    await logAudit("Validation manuelle véhicule souhaité", client.nom, allocation.demande.modeleNom+" ("+pct+"%)");
    toast("Véhicule souhaité marqué prêt à attribuer.");
    if(retourView) retourView(); else setView("clients",{filter:"attente"});
  }catch(e){ toast("Erreur : "+describeError(e), "danger"); }
}

/* Import de virements déjà extraits (ex. dépouillement de captures d'écran) :
   contrairement à CSV_SPECS (autonome par table), chaque ligne doit être
   rattachée à un client existant — le rattachement se fait par téléphone
   (identifiant fiable, contrairement au nom en texte libre) au moment de
   l'import, pas à la génération du fichier. */
function openImporterVirements(){
  const body =
    '<p class="muted" style="margin-top:0;">Importe des virements déjà répertoriés (colonnes : telephone;montantEnvoye;montantRecu;statut;dateVirement;reference;notes — notes est optionnelle). Chaque ligne est rattachée au client existant dont le téléphone correspond exactement ; les lignes sans correspondance sont ignorées et listées ci-dessous.</p>'+
    '<div class="dropzone" id="dz"><input type="file" id="csvFile" accept=".csv,text/csv" style="margin-bottom:8px;"><br><span class="faint">ou collez le contenu CSV ci-dessous</span><textarea id="csvPaste" rows="4" style="margin-top:8px;"></textarea></div>'+
    '<div id="previewBox"></div>';
  const { close } = openModal("Importer des virements", body, {
    wide:true,
    footHtml: '<button class="btn ghost" id="cancel">Fermer</button><button class="btn primary" id="doImport" disabled>Confirmer l\'import</button>',
    async onMount(back, close){
      const clients = await getAll("clients");
      const byTel = {};
      clients.forEach(c=>{ const k=String(c.telephone||"").replace(/\D/g,""); if(k) byTel[k]=c; });
      let matched = [], unmatched = [];
      back.querySelector("#cancel").addEventListener("click", close);
      function handleText(text){
        const parsed = parseCSV(text);
        matched = []; unmatched = [];
        parsed.records.forEach(r=>{
          const telRaw = pickField(r, ["telephone","téléphone","tel"]);
          const tel = String(telRaw||"").replace(/\D/g,"");
          const client = byTel[tel];
          const statutBrut = pickField(r,["statut"]).toLowerCase();
          const row = {
            montantEnvoye: Number(pickField(r,["montantenvoye","envoye"]))||0,
            montantRecu: Number(pickField(r,["montantrecu","recu"]))||0,
            statut: ["valide","en_attente","rejete"].includes(statutBrut) ? statutBrut : "en_attente",
            dateVirement: pickField(r,["datevirement","date"])||null,
            reference: pickField(r,["reference","référence","ref"]),
            notes: pickField(r,["notes","note","commentaire"]),
          };
          if(client){ row.clientId = client.id; row.clientNom = client.nom+" "+(client.prenoms||""); matched.push(row); }
          else { row.telephone = telRaw; unmatched.push(row); }
        });
        back.querySelector("#previewBox").innerHTML =
          '<div class="import-summary"><div><b>'+parsed.records.length+'</b><span class="faint">lignes lues</span></div><div><b>'+matched.length+'</b><span class="faint">rattachées à un client</span></div>'+(unmatched.length?'<div><b style="color:var(--danger);">'+unmatched.length+'</b><span class="faint">sans client correspondant</span></div>':'')+'</div>'+
          (matched.length ? '<div class="table-wrap" style="box-shadow:none;"><table class="grid"><thead><tr><th>Client</th><th class="num">Envoyé</th><th class="num">Reçu</th><th>Statut</th><th>Date</th></tr></thead><tbody>'+
            matched.slice(0,8).map(r=>"<tr><td>"+esc(r.clientNom)+'</td><td class="num mono">'+fmtMoney(r.montantEnvoye)+'</td><td class="num mono">'+fmtMoney(r.montantRecu)+"</td><td>"+pill(r.statut)+"</td><td>"+esc(r.dateVirement||"—")+"</td></tr>").join("")+
          "</tbody></table></div>"+(matched.length>8?'<p class="faint">… et '+(matched.length-8)+' de plus.</p>':"") : '<p class="faint">Aucune ligne rattachée à un client.</p>')+
          (unmatched.length ? '<p class="faint" style="color:var(--danger);">Téléphones sans client : '+unmatched.slice(0,15).map(r=>esc(r.telephone||"—")).join(", ")+(unmatched.length>15?"…":"")+"</p>" : "");
        back.querySelector("#doImport").disabled = !matched.length;
      }
      back.querySelector("#csvFile").addEventListener("change",(e)=>{
        const file=e.target.files[0]; if(!file) return;
        const reader=new FileReader();
        reader.onload=()=>handleText(String(reader.result||""));
        reader.readAsText(file,"utf-8");
      });
      back.querySelector("#csvPaste").addEventListener("input",(e)=>handleText(e.target.value));
      back.querySelector("#doImport").addEventListener("click", async ()=>{
        if(!matched.length) return;
        const btn = back.querySelector("#doImport"); btn.disabled = true;
        for(let i=0;i<matched.length;i++){
          const r = matched[i];
          await state.db.collection("virements").add({
            clientId: r.clientId, montantEnvoye: r.montantEnvoye, montantRecu: r.montantRecu,
            statut: r.statut, dateVirement: r.dateVirement, reference: r.reference, notes: r.notes||"",
            createdAt: todayIso(),
          });
          btn.textContent = "Import… "+(i+1)+"/"+matched.length;
        }
        await logAudit("Import CSV", "virements", matched.length+" créés, "+unmatched.length+" ignorés (sans client)");
        close();
        toast(matched.length+" virement(s) importé(s)"+(unmatched.length?", "+unmatched.length+" ignoré(s) (téléphone non reconnu)":"")+".");
        renderView();
      });
    }
  });
}

/* Le coût comparé ici est celui de la DEMANDE (véhicule souhaité), pas celui
   d'une unité précise de la flotte — la part des fonds du client déjà
   allouée à cette demande (allouerDemandes) doit couvrir ce coût avant
   qu'on attribue quoi que ce soit, sauf validation explicite d'un
   administrateur (même principe que la rupture de stock côté atelier : ça
   bloque par défaut, un admin peut passer outre). */
async function verifierMontantAttribution(allocation){
  const { recuAlloue, cout } = allocation;
  if(cout<=0) return true;
  if(recuAlloue>=cout) return true;
  if(!isAdmin()){
    toast("Le montant alloué à ce véhicule ("+fmtMoney(recuAlloue)+") ne couvre pas son coût ("+fmtMoney(cout)+"). Un administrateur doit valider cette attribution.", "danger");
    return false;
  }
  return await askConfirm("Le montant alloué à ce véhicule ("+fmtMoney(recuAlloue)+") est inférieur à son coût ("+fmtMoney(cout)+"). Attribuer quand même ?", "Attribuer quand même");
}

function openAttributionForm(client, demande, vehicules, allocation){
  const body =
    '<p class="muted" style="margin-top:0;">Choisissez un véhicule déjà enregistré dans la flotte, ou créez-en un nouveau pour ce client.</p>'+
    '<div class="field"><label>Véhicule existant</label><div id="vehPick"></div></div>'+
    '<p class="faint" style="text-align:center;margin:10px 0;">— ou —</p>'+
    '<button type="button" class="btn" id="creerVehicule" style="width:100%;">+ Créer un nouveau véhicule pour ce client</button>';
  const { close } = openModal("Attribuer un véhicule — "+client.nom+" ("+demande.modeleNom+")", body, {
    wide:true,
    footHtml: '<button class="btn ghost" id="cancel">Annuler</button><button class="btn primary" id="save" disabled>Attribuer</button>',
    async onMount(back, close){
      back.querySelector("#cancel").addEventListener("click", close);
      const [toutesDemandes, tousClients] = await Promise.all([getAll("demandes_vehicule"), getAll("clients")]);
      /* Un véhicule de la flotte peut être partagé entre plusieurs clients
         (1/2, 1/3…) : on ne l'exclut donc plus du choix une fois attribué —
         on signale juste qui le partage déjà, et on demande confirmation
         avant d'ajouter un partage supplémentaire. */
      function partageDe(vehiculeId){
        return toutesDemandes.filter(x=>x.vehiculeAttribueId===vehiculeId && x.id!==demande.id).map(x=>{
          const cl = tousClients.find(c=>c.id===x.clientId);
          return { nom: cl ? (cl.nom+" "+(cl.prenoms||"")).trim() : "?", part: x.partDenominateur||1 };
        });
      }
      let selectedId = null;
      mountSearchableSelect(back.querySelector("#vehPick"), {
        items: vehicules, getId: x=>x.id,
        getLabel: x=>{
          const partages = partageDe(x.id);
          return x.immatriculation+" — "+(x.marque||"")+" "+(x.modele||"")+(partages.length ? " [partagé : "+partages.map(p=>p.nom+" (1/"+p.part+")").join(", ")+"]" : "");
        },
        placeholder: "Rechercher un véhicule…",
        onChange: (id)=>{ selectedId = id; back.querySelector("#save").disabled = !id; }
      });
      async function confirmerPartage(vehiculeId){
        const partages = partageDe(vehiculeId);
        if(!partages.length) return true;
        const somme = partages.reduce((s,p)=>s+1/p.part, 0) + 1/(demande.partDenominateur||1);
        return await askConfirm(
          "Ce véhicule est déjà attribué à : "+partages.map(p=>p.nom+" (1/"+p.part+")").join(", ")+
          ". L'attribuer aussi à "+client.nom+" (1/"+(demande.partDenominateur||1)+") ?"+
          (somme>1 ? " Attention, la somme des parts dépasserait un véhicule entier ("+Math.round(somme*100)+"%)." : ""),
          "Attribuer quand même"
        );
      }
      back.querySelector("#save").addEventListener("click", async ()=>{
        if(!selectedId) return;
        if(!(await verifierMontantAttribution(allocation))) return;
        if(!(await confirmerPartage(selectedId))) return;
        await state.db.doc("demandes_vehicule/"+demande.id).update({ statut:"attribue", vehiculeAttribueId: selectedId, dateAttribution: todayIso() });
        await logAudit("Attribution véhicule", client.nom, (vehicules.find(x=>x.id===selectedId)||{}).immatriculation||"");
        close(); toast("Véhicule attribué."); setView("client-detail",{id:client.id});
      });
      back.querySelector("#creerVehicule").addEventListener("click", async ()=>{
        if(!(await verifierMontantAttribution(allocation))) return;
        close();
        openNouveauVehiculeForm({
          prefill: { chauffeurNom: (client.nom+" "+(client.prenoms||"")).trim(), chauffeurTelephone: client.telephone },
          onCreated: async (vehiculeId)=>{
            await state.db.doc("demandes_vehicule/"+demande.id).update({ statut:"attribue", vehiculeAttribueId: vehiculeId, dateAttribution: todayIso() });
            await logAudit("Attribution véhicule", client.nom, "nouveau véhicule");
            toast("Véhicule créé et attribué.");
            setView("client-detail",{id:client.id});
          }
        });
      });
    }
  });
}

    '<div class="callout"><span class="lbl">Créer un compte</span><p>Se fait en deux étapes : d\'abord dans Supabase (Authentication → Users → Add user, avec un email <span class="mono">identifiant@cambouis.local</span>), puis ici avec « + Utilisateur » en collant le User UID généré. Révoquer un accès, en revanche, se fait entièrement ici — décoche « Compte actif » et la personne est déconnectée en quelques secondes, où qu\'elle soit.</p></div>'+

        '<div class="field"><label>Tolérance de retard (minutes)</label><input id="f_tolerance" type="number" min="0" value="'+esc(state.config.toleranceRetardMin!=null?state.config.toleranceRetardMin:15)+'"></div>'+

      '<button class="btn" id="saveDevise">Enregistrer</button>'+
    '</div>'+
    '<div class="view-head" style="margin-top:8px;"><h3 class="section-title" style="margin:0;">Comptes ('+utilisateurs.length+')</h3><button class="btn primary" id="newUser">+ Utilisateur</button></div>'+
    '<div class="toolbar"><input type="search" id="userSearch" placeholder="Rechercher un compte…"></div>'+
    '<div class="table-wrap"><table class="grid"><thead><tr><th>Nom</th><th>Identifiant</th><th>Rôle</th><th>Onglets</th><th>Statut</th><th></th></tr></thead><tbody id="userTbody"></tbody></table></div>'+
    '<div class="card danger" style="margin-top:8px;"><h3 style="color:var(--danger);">Zone dangereuse</h3>'+
      '<p class="faint" style="margin-top:-8px;">Vide toutes les données d\'exploitation (véhicules, stock, fournisseurs, achats, devis, factures, ordres de réparation, mouvements de stock, comptages et journal d\'activité) et repart les numéros de documents à 1. Les comptes utilisateurs, les fiches techniciens et les paramètres généraux ne sont pas touchés. Action irréversible.</p>'+
      '<button class="btn danger" id="resetAll">Réinitialiser l\'application</button>'+
    '</div>';

  function draw(filter){
    const f = (filter||"").toLowerCase();
    const rows = utilisateurs.filter(u=>!f || (u.nom||"").toLowerCase().includes(f) || (u.identifiant||"").toLowerCase().includes(f));
    document.getElementById("userTbody").innerHTML = rows.length ? rows.map(u=>{
      const tabsLabel = u.role==="admin" ? "Tous" : ((u.tabs&&u.tabs.length) ? u.tabs.map(k=>(NAV.find(n=>n.key===k)||{}).label||k).join(", ") : "Aucun");
      return '<tr>'+
        '<td>'+esc(u.nom)+(u.id===state.actingUser.id?' <span class="faint">(vous)</span>':'')+'</td>'+
        '<td class="mono">'+esc(u.identifiant||"—")+'</td>'+
        '<td><span class="rolebadge '+esc(u.role)+'">'+esc(ROLES[u.role]||u.role)+'</span></td>'+
        '<td class="faint" style="max-width:260px;">'+esc(tabsLabel)+'</td>'+
        '<td>'+(u.active===false?'<span class="rolebadge revoked">Révoqué</span>':'<span class="rolebadge agent" style="background:var(--good-soft); color:var(--good);">Actif</span>')+'</td>'+
        '<td class="row-actions"><button class="btn small" data-edit="'+u.id+'">Modifier</button></td>'+
      '</tr>';
    }).join("") : '<tr class="empty-row"><td colspan="6">Aucun compte ne correspond.</td></tr>';
    document.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click", ()=>openUtilisateurForm(utilisateurs.find(u=>u.id===b.getAttribute("data-edit")))));
  }
  draw("");
  document.getElementById("userSearch").addEventListener("input", e=>draw(e.target.value));
  document.getElementById("newUser").addEventListener("click", ()=>openUtilisateurForm());
  document.getElementById("saveDevise").addEventListener("click", async ()=>{
    const devise = document.getElementById("f_devise").value.trim() || "FCFA";
    const entreprise = document.getElementById("f_entreprise").value.trim();
    const capaciteAtelier = Number(document.getElementById("f_capacite").value)||5;
    const heureOuverture = document.getElementById("f_heureOuverture").value || "08:00";
    const toleranceRetardMin = Number(document.getElementById("f_tolerance").value)||0;
    await state.db.doc("config/general").set({ devise, entreprise, capaciteAtelier, heureOuverture, toleranceRetardMin });
    state.config.devise = devise; state.config.entreprise = entreprise; state.config.capaciteAtelier = capaciteAtelier;
    state.config.heureOuverture = heureOuverture; state.config.toleranceRetardMin = toleranceRetardMin;
    toast("Paramètres enregistrés."); renderView();
  });
  document.getElementById("resetAll").addEventListener("click", ()=> openResetConfirm());
  document.getElementById("openManuel").addEventListener("click", ()=> setView("manuel"));
};

  { id:"connexion", title:"Connexion et rôles", html:`

  { id:"triage", title:"Diagnostic", html:`
    <p>Cet onglet (anciennement "Prise en charge") rassemble les véhicules diagnostiqués par les mécaniciens et aide à décider lesquels peuvent démarrer en réparation maintenant. Le diagnostic lui-même se fait sur la fiche du véhicule (carte "Diagnostic" — assigner un mécanicien, puis confirmer le diagnostic avec un texte libre et, en option, une liste de <b>pièces suspectées choisies dans le catalogue</b> : elles préremplissent automatiquement le devis créé ensuite depuis cette même carte).</p>

  { id:"controle", title:"Contrôle", html:`
