<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PartsFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --ground:#F2F3F5;
    --surface:#FFFFFF;
    --surface-2:#E9ECEF;
    --ink:#1B222C;
    --ink-muted:#5B6572;
    --ink-faint:#8A93A0;
    --line:#D7DBE0;
    --line-strong:#B9C0C8;
    --accent:#1259A6;
    --accent-ink:#0B3D80;
    --accent-soft:#E3EDF9;
    --amber:#B9660A;
    --amber-soft:#FCEED4;
    --danger:#C22F17;
    --danger-soft:#FAE3DE;
    --good:#1C7A4F;
    --good-soft:#DFF1E7;
    --teal:#0E7C86;
    --teal-soft:#DEF0F1;
    --faint-soft:#EEF0F2;
    --shadow: 0 1px 2px rgba(27,34,44,0.07), 0 8px 20px rgba(27,34,44,0.06);
    --radius: 3px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#12161B; --surface:#1B2129; --surface-2:#232A33;
      --ink:#E8EAED; --ink-muted:#9BA5B0; --ink-faint:#6E7883;
      --line:#323B45; --line-strong:#414C58;
      --accent:#5FA0E8; --accent-ink:#BFDBFF; --accent-soft:#1E2C3D;
      --amber:#F0AC4E; --amber-soft:#3A2A0B;
      --danger:#F08066; --danger-soft:#3F221C;
      --good:#5FD69B; --good-soft:#14281F; --teal:#4FC2CC; --teal-soft:#123236; --faint-soft:#232A33;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 24px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"]{
    --ground:#12161B; --surface:#1B2129; --surface-2:#232A33;
    --ink:#E8EAED; --ink-muted:#9BA5B0; --ink-faint:#6E7883;
    --line:#323B45; --line-strong:#414C58;
    --accent:#5FA0E8; --accent-ink:#BFDBFF; --accent-soft:#1E2C3D;
    --amber:#F0AC4E; --amber-soft:#3A2A0B;
    --danger:#F08066; --danger-soft:#3F221C;
    --good:#5FD69B; --good-soft:#14281F; --teal:#4FC2CC; --teal-soft:#123236; --faint-soft:#232A33;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 24px rgba(0,0,0,0.4);
  }
  *{box-sizing:border-box;}
  /* Without this, the `hidden` attribute toggled from JS does nothing on
     #loginScreen/#app: their own display:flex/grid rules below (author
     CSS) always beat the browser's default [hidden]{display:none} rule,
     since author styles outrank user-agent styles regardless of
     specificity. Result: both stay visually present at once — the empty
     100vh-tall loginScreen pushes the real app content one screen-height
     below the fold, which reads as a blank page. */
  [hidden]{display:none !important;}
  html,body{height:100%; overflow-x:hidden;}

  /* ---- print (devis / factures) ---- */
  #printArea{display:none;}
  .doc-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:24px; padding-bottom:16px; border-bottom:2px solid #000;}
  .doc-head .co{font-family:'Big Shoulders'; font-weight:800; font-size:1.5rem; text-transform:uppercase;}
  .doc-head .doc-type{text-align:right;}
  .doc-head .doc-type h1{font-size:1.4rem; margin-bottom:4px;}
  .doc-meta{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:22px; font-size:0.92rem;}
  .doc-meta .blk{border:1px solid #ccc; padding:10px 14px;}
  .doc-meta .blk .k{font-size:0.68rem; text-transform:uppercase; letter-spacing:0.05em; color:#666; margin-bottom:4px;}
  .doc-table{width:100%; border-collapse:collapse; margin-bottom:18px; font-size:0.9rem;}
  .doc-table th{background:#eee; text-align:left; padding:8px 10px; border:1px solid #ccc; font-size:0.72rem; text-transform:uppercase;}
  .doc-table td{padding:8px 10px; border:1px solid #ccc;}
  .doc-totals{margin-left:auto; width:280px; font-size:0.95rem;}
  .doc-totals div{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #ddd;}
  .doc-totals .grand{font-weight:800; font-size:1.1rem; border-bottom:none; border-top:2px solid #000; margin-top:4px; padding-top:10px;}
  .doc-foot{margin-top:40px; font-size:0.78rem; color:#666; border-top:1px solid #ccc; padding-top:10px;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block; position:absolute; top:0; left:0; width:100%; padding:20px; color:#000; background:#fff;}
  }
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    font-size:14.5px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:'Big Shoulders', 'Arial Narrow', sans-serif; text-transform:uppercase; letter-spacing:0.02em; text-wrap:balance; margin:0; color:var(--ink);}
  .mono, .num, td.num, input, select, textarea, button{font-family:'IBM Plex Sans', system-ui, sans-serif;}
  .mono, .num, td.num{font-family:'IBM Plex Mono', ui-monospace, monospace;}
  a{color:var(--accent);}
  button{cursor:pointer; font-size:0.9rem;}
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  input,select,textarea{
    font-size:0.9rem; padding:7px 9px; border:1px solid var(--line-strong); border-radius:var(--radius);
    background:var(--surface); color:var(--ink); width:100%;
  }
  label{display:block; font-size:0.72rem; letter-spacing:0.05em; text-transform:uppercase; color:var(--ink-muted); margin-bottom:4px;}
  .field{margin-bottom:14px;}
  .field-row{display:grid; gap:12px;}

  /* ---- app shell ---- */
  #app{display:grid; grid-template-columns:230px 1fr; min-height:100vh;}
  @media (max-width:860px){ #app{grid-template-columns:1fr;} }
  .sidebar{
    position:sticky; top:0; height:100vh; overflow-y:auto;
    background:var(--surface); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:18px 0 14px;
  }
  .brand{display:flex; align-items:center; gap:8px; padding:0 14px 4px 18px;}
  .brand .mark{width:9px;height:9px;background:var(--accent);display:inline-block;transform:rotate(45deg);flex:none;}
  .brand span{font-family:'Big Shoulders'; font-weight:800; font-size:1.25rem;}
  .brand-sub{padding:0 18px 16px; font-size:0.68rem; color:var(--ink-faint); letter-spacing:0.08em; text-transform:uppercase; border-bottom:1px solid var(--line); margin-bottom:8px;}
  .sidebar-toggle{
    margin-left:auto; background:none; border:1px solid var(--line); border-radius:6px; padding:0;
    color:var(--ink-muted); width:22px; height:22px; display:flex; align-items:center; justify-content:center; flex:none;
  }
  .sidebar-toggle:hover{background:var(--faint-soft); color:var(--ink);}
  .sidebar-toggle svg{transition:transform .15s ease;}
  .sidebar.collapsed .sidebar-toggle svg{transform:rotate(180deg);}
  nav.mainnav{display:flex; flex-direction:column; gap:1px; padding:0 8px;}
  nav.mainnav button{
    display:flex; align-items:center; gap:10px; text-align:left; width:100%;
    background:none; border:none; padding:9px 10px; border-radius:var(--radius);
    color:var(--ink-muted); font-size:0.86rem; font-weight:500;
  }
  nav.mainnav button:hover{background:var(--faint-soft); color:var(--ink);}
  nav.mainnav button.active{background:var(--accent-soft); color:var(--accent-ink); font-weight:600;}
  .nav-ico{width:17px; height:17px; display:inline-flex; align-items:center; justify-content:center; color:var(--ink-faint); flex:none;}
  .nav-ico svg{display:block;}
  nav.mainnav button.active .nav-ico{color:var(--accent);}
  .sidebar-foot{margin-top:auto; padding:14px 18px 0; border-top:1px solid var(--line); font-size:0.72rem; color:var(--ink-faint);}
  @media (min-width:861px){
    #app.sidebar-collapsed{grid-template-columns:64px 1fr;}
    .sidebar.collapsed .brand{flex-direction:column; gap:8px; padding:14px 0 8px;}
    .sidebar.collapsed .brand-name{display:none;}
    .sidebar.collapsed .sidebar-toggle{margin-left:0;}
    .sidebar.collapsed .brand-sub{display:none;}
    .sidebar.collapsed .sidebar-foot{display:none;}
    .sidebar.collapsed nav.mainnav{padding:0 6px;}
    .sidebar.collapsed nav.mainnav button{justify-content:center; padding:10px 0; gap:0;}
    .sidebar.collapsed .nav-label{display:none;}
  }

  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:14px 26px; border-bottom:1px solid var(--line); background:var(--surface);
    position:sticky; top:0; z-index:5;
  }
  .topbar h1{font-size:1.15rem; font-weight:700;}
  .actingas{display:flex; align-items:center; gap:8px; font-size:0.8rem; color:var(--ink-muted);}
  .actingas select{width:auto; min-width:220px; padding:6px 8px; font-size:0.82rem;}

  main.view{padding:24px 26px 80px; max-width:1180px;}
  .view-head{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom:18px; flex-wrap:wrap;}
  .view-head .lede{color:var(--ink-muted); font-size:0.88rem; max-width:60ch; margin-top:4px;}
  .btn{
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line-strong);
    background:var(--surface); color:var(--ink); padding:8px 14px; border-radius:var(--radius);
    font-weight:600; font-size:0.84rem; white-space:nowrap;
  }
  .btn:hover{border-color:var(--ink-faint);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{background:var(--accent-ink); border-color:var(--accent-ink);}
  .btn.danger{background:var(--surface); border-color:var(--danger); color:var(--danger);}
  .btn.danger:hover{background:var(--danger-soft);}
  .btn.ghost{border-color:transparent; background:none;}
  .btn.ghost:hover{background:var(--faint-soft);}
  .btn.small{padding:5px 10px; font-size:0.76rem;}
  .btn[disabled]{opacity:0.45; cursor:not-allowed;}
  .toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px;}
  .toolbar input[type=search], .toolbar input[type=text], .toolbar select{width:auto; min-width:180px;}

  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); margin-bottom:26px;}
  .kpi{background:var(--surface); padding:16px 18px;}
  .kpi .lbl{font-size:0.68rem; letter-spacing:0.07em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:8px;}
  .kpi .val{font-family:'Big Shoulders'; font-weight:800; font-size:1.9rem; line-height:1;}
  .kpi .val.danger{color:var(--danger);}
  .kpi .val.amber{color:var(--amber);}
  .kpi .sub{font-size:0.76rem; color:var(--ink-muted); margin-top:4px;}

  .card{background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:var(--radius); padding:18px 20px; margin-bottom:20px;}
  .card h3{font-size:1.02rem; margin-bottom:14px;}
  .card.danger{border-color:var(--danger);}

  .manual .toc{display:flex; flex-wrap:wrap; gap:6px 16px; padding:12px 14px; margin-bottom:20px; background:var(--faint-soft); border-radius:var(--radius); font-size:0.84rem;}
  .manual .toc a{color:var(--accent-ink); text-decoration:none;}
  .manual .toc a:hover{text-decoration:underline;}
  .manual h4{font-size:0.94rem; margin:16px 0 6px; color:var(--ink);}
  .manual p{margin:0 0 10px; line-height:1.55;}
  .manual ul, .manual ol{margin:0 0 12px; padding-left:22px; line-height:1.55;}
  .manual li{margin-bottom:4px;}
  .manual .section-title:first-of-type{margin-top:0;}

  .table-wrap{overflow-x:auto; border:1px solid var(--line); box-shadow:var(--shadow); border-radius:var(--radius); margin-bottom:20px;}
  table.grid{border-collapse:collapse; width:100%; min-width:520px; background:var(--surface); font-size:0.86rem;}
  table.grid thead th{
    background:var(--surface-2); text-align:left; padding:9px 12px; border-bottom:1px solid var(--line);
    font-size:0.68rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-muted); font-weight:600; white-space:nowrap;
  }
  table.grid td{padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:middle;}
  table.grid tbody tr:last-child td{border-bottom:none;}
  table.grid tbody tr.clickable{cursor:pointer;}
  table.grid tbody tr.clickable:hover{background:var(--faint-soft);}
  td.num, th.num{text-align:right; font-variant-numeric:tabular-nums;}
  .empty-row td{color:var(--ink-faint); text-align:center; padding:26px; font-style:normal;}

  .pill{display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:100px; font-size:0.72rem; font-weight:600; letter-spacing:0.02em; white-space:nowrap;}
  .pill::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor;}
  .pill.impayee{background:var(--danger-soft); color:var(--danger);}
  .pill.partielle{background:var(--amber-soft); color:var(--amber);}
  .pill.payee{background:var(--good-soft); color:var(--good);}
  .pill.annulee{background:var(--faint-soft); color:var(--ink-faint);}
  .pill.brouillon{background:var(--faint-soft); color:var(--ink-muted);}
  .pill.envoye, .pill.envoyee{background:var(--accent-soft); color:var(--accent-ink);}
  .pill.accepte, .pill.ouvert, .pill.actif{background:var(--good-soft); color:var(--good);}
  .pill.refuse, .pill.immobilise, .pill.licencie{background:var(--danger-soft); color:var(--danger);}
  .pill.suspendu{background:var(--amber-soft); color:var(--amber);}
  .pill.cloture, .pill.soldee{background:var(--faint-soft); color:var(--ink-muted);}

  .badge-low{background:var(--danger-soft); color:var(--danger); padding:1px 7px; border-radius:100px; font-size:0.7rem; font-weight:700;}

  /* modal */
  .modal-back{position:fixed; inset:0; background:rgba(18,22,27,0.45); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; overflow-y:auto; z-index:50;}
  .modal{background:var(--surface); border-radius:var(--radius); box-shadow:0 20px 60px rgba(0,0,0,0.3); width:100%; max-width:640px; border:1px solid var(--line);}
  .modal.wide{max-width:860px;}
  .modal-head{display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line);}
  .modal-head h3{font-size:1.05rem;}
  .modal-body{padding:20px; max-height:70vh; overflow-y:auto; overflow-x:auto;}
  .modal-foot{display:flex; justify-content:flex-end; gap:10px; padding:14px 20px; border-top:1px solid var(--line);}
  .modal-close{background:none; border:none; font-size:1.3rem; line-height:1; color:var(--ink-faint); padding:2px 6px;}
  .modal-close:hover{color:var(--ink);}

  .lines-table{width:100%; border-collapse:collapse; margin-bottom:10px;}
  .lines-table th{font-size:0.66rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); text-align:left; padding:4px 6px;}
  .lines-table td{padding:4px 6px; vertical-align:middle;}
  .lines-table input, .lines-table select{padding:5px 7px; font-size:0.82rem;}
  .lines-total{display:flex; justify-content:flex-end; gap:20px; padding-top:10px; border-top:1px solid var(--line); font-size:0.95rem;}
  .lines-total b{font-family:'IBM Plex Mono';}

  .callout{display:grid; grid-template-columns:auto 1fr; gap:10px; padding:12px 14px; border:1px solid var(--line); border-left:3px solid var(--accent); background:var(--accent-soft); font-size:0.85rem; margin-bottom:16px; border-radius:var(--radius);}
  .callout.danger{border-left-color:var(--danger); background:var(--danger-soft);}
  .callout.amber{border-left-color:var(--amber); background:var(--amber-soft);}
  .callout .lbl{font-family:'IBM Plex Mono'; font-size:0.65rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--accent-ink);}
  .callout.danger .lbl{color:var(--danger);}
  .callout.amber .lbl{color:var(--amber);}
  .callout p{margin:0; color:var(--ink);}

  .tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:18px;}
  .tabs button{background:none; border:none; padding:9px 14px; font-size:0.84rem; font-weight:600; color:var(--ink-muted); border-bottom:2px solid transparent; margin-bottom:-1px;}
  .tabs button.active{color:var(--accent-ink); border-bottom-color:var(--accent);}

  .detail-grid{display:grid; grid-template-columns:2fr 1fr; gap:20px;}
  @media (max-width:760px){.detail-grid{grid-template-columns:1fr;}}
  .kv{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:0.86rem;}
  .kv dt{color:var(--ink-faint);}
  .kv dd{margin:0; font-weight:500;}

  .toast-wrap{position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:8px; z-index:80;}
  .toast{background:var(--ink); color:var(--ground); padding:10px 16px; border-radius:var(--radius); font-size:0.84rem; box-shadow:var(--shadow); max-width:340px;}
  :root:not([data-theme="light"]) .toast{background:var(--surface-2); color:var(--ink); border:1px solid var(--line);}
  .toast.danger{background:var(--danger); color:#fff;}

  .back-link{display:inline-flex; gap:6px; align-items:center; color:var(--ink-muted); font-size:0.82rem; margin-bottom:14px; background:none; border:none; padding:0; font-weight:600;}
  .back-link:hover{color:var(--accent);}
  .section-title{font-size:1.02rem; margin:26px 0 12px;}
  .muted{color:var(--ink-muted);}
  .faint{color:var(--ink-faint);}
  .right{text-align:right;}
  .stack{display:flex; flex-direction:column; gap:8px;}
  .row-actions{display:flex; gap:8px; justify-content:flex-end;}

  /* ---- login screen ---- */
  #loginScreen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px;}
  .login-card{width:100%; max-width:420px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:var(--radius); padding:32px 30px;}
  .login-card .brand{padding:0 0 4px; justify-content:center;}
  .login-card .brand-sub{padding:0 0 22px; text-align:center; border-bottom:none;}
  .login-users{display:flex; flex-direction:column; gap:6px; margin-bottom:6px;}
  .login-user-btn{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:11px 14px; border:1px solid var(--line-strong); border-radius:var(--radius);
    background:var(--surface); text-align:left; font-weight:600; font-size:0.92rem;
  }
  .login-user-btn:hover{border-color:var(--accent); background:var(--accent-soft);}
  .login-user-btn .rolebadge{font-weight:500;}
  .login-pin-box{margin-top:16px; padding-top:16px; border-top:1px solid var(--line);}
  .login-pin-box input{text-align:center; letter-spacing:0.3em; font-size:1.2rem; font-family:'IBM Plex Mono';}
  .login-error{color:var(--danger); font-size:0.84rem; margin-top:8px;}
  .login-msg{background:var(--amber-soft); color:var(--amber); border-radius:var(--radius); padding:10px 12px; font-size:0.84rem; margin-bottom:18px;}

  .rolebadge{display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:100px; font-size:0.68rem; font-weight:700; letter-spacing:0.03em; text-transform:uppercase;}
  .rolebadge.admin{background:var(--accent-soft); color:var(--accent-ink);}
  .rolebadge.agent{background:var(--faint-soft); color:var(--ink-muted);}
  .rolebadge.revoked{background:var(--danger-soft); color:var(--danger);}

  .topbar-user{display:flex; align-items:center; gap:10px; font-size:0.84rem;}
  .topbar-user .name{font-weight:600;}

  /* ---- searchable select ---- */
  .ssel{position:relative;}
  .ssel-list{position:absolute; top:calc(100% + 2px); left:0; right:0; background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--radius); max-height:220px; overflow-y:auto; z-index:60; box-shadow:var(--shadow);}
  .ssel-opt{padding:7px 10px; cursor:pointer; font-size:0.85rem;}
  .ssel-opt:hover, .ssel-opt.hi{background:var(--accent-soft);}
  .ssel-empty{padding:7px 10px; color:var(--ink-faint); font-size:0.85rem;}

  /* ---- csv import ---- */
  .dropzone{border:1.5px dashed var(--line-strong); border-radius:var(--radius); padding:22px; text-align:center; color:var(--ink-muted); font-size:0.86rem; margin-bottom:14px;}
  .import-summary{display:flex; gap:18px; margin:12px 0; font-size:0.86rem;}
  .import-summary b{font-family:'IBM Plex Mono'; display:block; font-size:1.1rem;}
  .kpi.clickable{cursor:pointer;}
  .kpi.clickable:hover{background:var(--faint-soft);}
  .kpi.accent-top{border-top:3px solid var(--accent);}
  .kpi.danger-top{border-top:3px solid var(--danger);}
  .kpi.amber-top{border-top:3px solid var(--amber);}
  .kpi.teal-top{border-top:3px solid var(--teal);}

const SUPABASE_URL = "https://akyfnanyukhlqtawgskj.supabase.co";
const SUPABASE_KEY = "sb_publishable__5B_yoVFguUyl4PzRuF9Qw_staH7s72";

/* Diagnostic safety net (temporary): guarantees something visible shows
   up even if an error escapes every try/catch below, instead of a
   silent blank page. Remove once the app is confirmed stable. */
function describeError(err){
  if(!err) return String(err);
  if(err.stack) return err.stack;
  if(typeof err === "object"){
    const parts = ["message","details","hint","code"].filter(k=>err[k]).map(k=>k+": "+err[k]);
    if(parts.length) return parts.join("\n");
    try{ return JSON.stringify(err, null, 2); }catch(e){ return String(err); }
  }
  return String(err);
}
function showFatalError(label, err){
  console.error("[diag]", label, err);
  const box = document.createElement("div");
  box.style.cssText = "position:fixed; inset:0; background:#fff; z-index:99999; padding:24px; font-family:monospace; font-size:13px; color:#a6341e; overflow:auto; white-space:pre-wrap;";
  box.textContent = "ERREUR (" + label + ") :\n\n" + describeError(err);
  document.body.appendChild(box);
}
window.addEventListener("error", (e)=> showFatalError("window.error", e.error||e.message));
window.addEventListener("unhandledrejection", (e)=> showFatalError("unhandledrejection", e.reason));

/* --------------------------------------------------- Firestore-shaped
   data shim over Supabase/Postgres. Kept identical in shape to the
   capability the app was first built against (db.collection(x).add(),
   db.doc(x).get()/.update()/.set()/.onSnapshot()) so the ~40 call sites
   throughout the views below did not need to be individually rewritten
   — only this shim, and the auth/login code, changed. */
const TABLE_ALIAS = { utilisateurs: "profiles" };
function resolveTable(name){ return TABLE_ALIAS[name] || name; }
function toSnakeKey(k){ return k.replace(/[A-Z]/g, c => "_"+c.toLowerCase()); }
function toCamelKey(k){ return k.replace(/_([a-z0-9])/g, (_,c) => c.toUpperCase()); }
function rowToCamel(row){
  if(!row || typeof row !== "object") return row;
  const out = {};
  for(const k in row) out[toCamelKey(k)] = row[k];
  return out;
}
function objToSnake(obj){
  const out = {};
  for(const k in obj) out[toSnakeKey(k)] = obj[k];
  return out;
}
function makeDbShim(client){
  function docRef(path){
    const slash = path.indexOf("/");
    const table = resolveTable(path.slice(0, slash));
    const id = path.slice(slash+1);
    return {
      id,
      async get(){
        const { data, error } = await client.from(table).select("*").eq("id", id).maybeSingle();
        if(error) throw error;
        return { exists: !!data, id, data: ()=> data ? rowToCamel(data) : undefined };
      },
      async update(patch){
        const { error } = await client.from(table).update(objToSnake(patch)).eq("id", id);
        if(error) throw error;
      },
      async set(patch){
        const row = Object.assign({ id }, objToSnake(patch));
        const { error } = await client.from(table).upsert(row);
        if(error) throw error;
      },
      async delete(){
        const { error } = await client.from(table).delete().eq("id", id);
        if(error) throw error;
      },
      onSnapshot(next, errCb){
        let stopped = false;
        (async ()=>{
          try{
            const { data, error } = await client.from(table).select("*").eq("id", id).maybeSingle();
            if(error) throw error;
            if(!stopped) next({ exists: !!data, id, data: ()=> data ? rowToCamel(data) : undefined });
          }catch(e){ if(!stopped && errCb) errCb(e); }
        })();
        const channel = client.channel("doc-"+table+"-"+id)
          .on("postgres_changes", { event:"*", schema:"public", table, filter:"id=eq."+id }, (payload)=>{
            if(stopped) return;
            if(payload.eventType === "DELETE") next({ exists:false, id, data:()=>undefined });
            else next({ exists:true, id, data: ()=> rowToCamel(payload.new) });
          })
          .subscribe();
        return function unsubscribe(){ stopped = true; client.removeChannel(channel); };
      }
    };
  }
  function collectionRef(name){
    const table = resolveTable(name);
    return {
      doc(id){ return docRef(name + "/" + id); },
      async add(data){
        const { data: inserted, error } = await client.from(table).insert(objToSnake(data)).select().single();
        if(error) throw error;
        return { id: inserted.id };
      },
      async get(){
        const { data, error } = await client.from(table).select("*");
        if(error) throw error;
        return { docs: (data||[]).map(row => ({ id: row.id, data: ()=> rowToCamel(row) })) };
      }
    };
  }
  return { doc: docRef, collection: collectionRef };
}

/* --------------------------------------------------------- file download
   Plain browser download (Blob + temporary <a download>) — replaces the
   Claude artifact's `downloads` capability, which does not exist outside
   that sandbox. Works in any real browser. */
function downloadFile(filename, content){
  const blob = new Blob([content], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}

      '<div class="blk"><div class="k">Chauffeur</div><div>'+esc(vehicule&&vehicule.chauffeurNom || "—")+'<br>'+esc(vehicule&&vehicule.chauffeurTelephone || "")+'</div></div>'+

  document.getElementById("printArea").innerHTML = html;
  setTimeout(()=> window.print(), 50);
}

/* ---------------------------------------------------------------- utils */
function esc(s){
  if(s===null||s===undefined) return "";
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtMoney(n){
  n = Number(n)||0;
  return new Intl.NumberFormat("fr-FR").format(Math.round(n)) + " " + state.config.devise;
}
function fmtDate(iso){
  if(!iso) return "—";
  try{ return new Date(iso).toLocaleDateString("fr-FR", {day:"2-digit", month:"2-digit", year:"numeric"}); }
  catch(e){ return "—"; }
}
function fmtDateTime(iso){
  if(!iso) return "—";
  try{ return new Date(iso).toLocaleString("fr-FR", {day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit"}); }
  catch(e){ return "—"; }
}

async function getAll(path){
  const snap = await state.db.collection(path).get();
  return snap.docs.map(d=>({ id:d.id, ...d.data() }));
}
async function getOne(path, id){
  const snap = await state.db.doc(path+"/"+id).get();
  return snap.exists ? { id: snap.id, ...snap.data() } : null;
}
async function nextNumero(type, prefix){
  let value = null;
  try{
    const { data, error } = await sb.rpc("next_numero", { seq_name: type + "_seq" });
    if(error) throw error;
    value = data;
  }catch(e){ value = Date.now() % 100000; }
  const year = new Date().getFullYear();
  return prefix + "-" + year + "-" + String(value).padStart(4,"0");
}
async function logAudit(action, cible, detail){
  try{
    await state.db.collection("audit").add({
      date: todayIso(), acteur: actingUserName(), role: actingUserRole(), action, cible, detail: detail||""
    });
  }catch(e){ /* non bloquant */ }
}
async function ajusterStock(articleId, delta, type, documentType, documentNumero, commentaire){
  const ref = state.db.doc("articles/"+articleId);
  const snap = await ref.get();
  if(!snap.exists) return;
  const data = snap.data();
  const newQte = (Number(data.stockQte)||0) + delta;
  await ref.update({ stockQte: newQte });
  await state.db.collection("mouvements").add({
    articleId, reference: data.reference, designation: data.designation,
    type, quantite: delta, documentType, documentNumero,
    utilisateur: actingUserName(), date: todayIso(), commentaire: commentaire||""
  });
}

/* ---- synchronisation statut véhicule / cycle de l'OR --------------------
   Évite l'oubli manuel qui fausse le tableau de bord et la Prise en charge :
   ouvrir un OR (par n'importe quelle porte — devis envoyé ou OR ouvert
   directement) immobilise le véhicule s'il ne l'est pas déjà ; le clôturer
   le réactive automatiquement, sauf s'il a un autre OR encore ouvert. */
async function marquerVehiculeImmobiliseSiNecessaire(vehiculeId){
  const veh = await getOne("vehicules", vehiculeId);
  if(veh && veh.statut!=="immobilise"){
    await state.db.doc("vehicules/"+vehiculeId).update({ statut:"immobilise", immobiliseDepuis: todayIso() });
  }
}
async function reactiverVehiculeApresOr(vehiculeId, orIdFerme){
  const [veh, ordres] = await Promise.all([getOne("vehicules", vehiculeId), getAll("ordres")]);
  if(!veh || veh.statut!=="immobilise") return;
  const autreOrOuvert = ordres.some(o=>o.id!==orIdFerme && o.vehiculeId===vehiculeId && o.statut==="ouvert");
  if(autreOrOuvert) return;
  await state.db.doc("vehicules/"+vehiculeId).update({ statut:"actif", immobiliseDepuis:null, motifInactivite:null, detailInactivite:null });
}

/* --------------------------------------------------------------- modals */
function openModal(title, bodyHtml, opts){
  opts = opts || {};
  const root = document.getElementById("modalRoot");
  const back = document.createElement("div");
  back.className = "modal-back";
  back.innerHTML =
    '<div class="modal '+(opts.wide?"wide":"")+'">'+
      '<div class="modal-head"><h3>'+esc(title)+'</h3><button class="modal-close" aria-label="Fermer">&times;</button></div>'+
      '<div class="modal-body">'+bodyHtml+'</div>'+
      (opts.footHtml ? '<div class="modal-foot">'+opts.footHtml+'</div>' : '') +
    '</div>';
  root.innerHTML = "";
  root.appendChild(back);
  function close(){ back.remove(); }
  back.querySelector(".modal-close").addEventListener("click", close);
  back.addEventListener("mousedown", (e)=>{ if(e.target===back) close(); });
  if(opts.onMount) opts.onMount(back, close);
  return { el: back, close };
}
function closeModal(){
  const root = document.getElementById("modalRoot");
  root.innerHTML = "";
}
function askConfirm(message, confirmLabel){
  return new Promise(resolve=>{
    const { close } = openModal("Confirmation", '<p style="margin:0;">'+esc(message)+"</p>", {
      footHtml:
        '<button class="btn ghost" id="cfNo">Annuler</button>'+
        '<button class="btn danger" id="cfYes">'+esc(confirmLabel||"Confirmer")+"</button>",
      onMount(back, closeFn){
        back.querySelector("#cfNo").addEventListener("click", ()=>{ closeFn(); resolve(false); });
        back.querySelector("#cfYes").addEventListener("click", ()=>{ closeFn(); resolve(true); });
      }
    });
  });
}

/* ------------------------------------------------------ searchable select
   A lightweight combobox: a text input that filters a list as you type,
   backed by a hidden selected id. Used everywhere a plain <select> would
   otherwise force scrolling through hundreds of vehicles or parts. */
let sselSeq = 0;
function mountSearchableSelect(container, opts){
  const items = opts.items || [];
  const getLabel = opts.getLabel;
  const getId = opts.getId;
  const onChange = opts.onChange || function(){};
  const uid = "ssel" + (sselSeq++);
  container.innerHTML =
    '<div class="ssel" id="'+uid+'">'+
      '<input type="text" class="ssel-input" placeholder="'+esc(opts.placeholder||"Rechercher…")+'" autocomplete="off">'+
      '<div class="ssel-list" hidden></div>'+
    '</div>';
  const wrap = container.querySelector("#"+uid);
  const input = wrap.querySelector(".ssel-input");
  const list = wrap.querySelector(".ssel-list");
  let selectedId = opts.value || null;
  function setDisplay(){
    const item = items.find(it=>String(getId(it))===String(selectedId));
    input.value = item ? getLabel(item) : "";
  }
  function renderList(filterText){
    const f = (filterText||"").toLowerCase();
    const filtered = items.filter(it=>!f || getLabel(it).toLowerCase().includes(f)).slice(0,60);
    list.innerHTML = filtered.length
      ? filtered.map(it=>'<div class="ssel-opt" data-id="'+esc(String(getId(it)))+'">'+esc(getLabel(it))+'</div>').join("")
      : '<div class="ssel-empty">Aucun résultat</div>';
    list.hidden = false;
    list.querySelectorAll(".ssel-opt").forEach(opt=>{
      opt.addEventListener("mousedown", (e)=>{
        e.preventDefault();
        selectedId = opt.getAttribute("data-id");
        setDisplay();
        list.hidden = true;
        onChange(selectedId);
      });
    });
  }
  input.addEventListener("focus", ()=> renderList(input.value===setDisplayText()?"":input.value));
  function setDisplayText(){ const item = items.find(it=>String(getId(it))===String(selectedId)); return item ? getLabel(item) : ""; }
  input.addEventListener("input", ()=> renderList(input.value));
  input.addEventListener("blur", ()=> setTimeout(()=>{ list.hidden = true; setDisplay(); }, 150));
  setDisplay();
  return {
    getValue: ()=> selectedId,
    setValue: (id)=>{ selectedId = id; setDisplay(); }
  };
}

/* --------------------------------------------------------------- CSV
   A small RFC4180-ish parser (quoted fields, comma or semicolon,
   auto-detected) plus a header-alias lookup for flexible imports. */
function parseCSV(text){
  text = String(text||"").replace(/^﻿/, "");
  const firstLine = (text.split(/\r?\n/)[0]||"");
  const delim = (firstLine.split(";").length > firstLine.split(",").length) ? ";" : ",";
  const rows = []; let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c==='"' && next==='"'){ field+='"'; i++; }
      else if(c==='"'){ inQuotes=false; }
      else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===delim){ row.push(field); field=""; }
      else if(c==="\n" || c==="\r"){
        if(c==="\r" && next==="\n") i++;
        row.push(field); field="";
        if(row.length>1 || row[0]!=="") rows.push(row);
        row=[];
      } else field+=c;
    }
  }
  if(field!=="" || row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return { headers:[], records:[] };
  const headers = rows[0].map(h=>h.trim());
  const records = rows.slice(1).filter(r=>r.some(c=>c.trim()!=="")).map(r=>{
    const obj = {};
    headers.forEach((h,idx)=>{ obj[normalizeHeader(h)] = (r[idx]||"").trim(); });
    return obj;
  });
  return { headers, records };
}
const DIACRITICS_RE = new RegExp("[̀-ͯ]", "g");
function normalizeHeader(h){
  const noAccents = String(h||"").toLowerCase().normalize("NFD").replace(DIACRITICS_RE, "");
  return noAccents.replace(/[^a-z0-9]/g,"");
}
function pickField(record, aliases){
  for(const a of aliases){ if(record[a]!==undefined && record[a]!=="") return record[a]; }
  return "";
}

function openCsvImport(kind){
  const spec = CSV_SPECS[kind];
  const body =
    '<p class="muted" style="margin-top:0;">Importe des '+spec.title+' depuis un fichier CSV (Excel : « Enregistrer sous → CSV »). Téléchargez le modèle ci-dessous pour voir les colonnes attendues — l\'en-tête peut être en majuscules ou minuscules, avec ou sans accents.</p>'+
    '<div class="dropzone" id="dz"><input type="file" id="csvFile" accept=".csv,text/csv" style="margin-bottom:8px;"><br><span class="faint">ou collez le contenu CSV ci-dessous</span><textarea id="csvPaste" rows="4" style="margin-top:8px;"></textarea></div>'+
    '<button type="button" class="btn small" id="dlTemplate">Télécharger un modèle vide</button>'+
    '<div id="previewBox"></div>';
  const { close } = openModal("Importer un CSV", body, {
    wide:true,
    footHtml: '<button class="btn ghost" id="cancel">Fermer</button><button class="btn primary" id="doImport" disabled>Confirmer l\'import</button>',
    onMount(back, close){
      let parsed = null;
      back.querySelector("#cancel").addEventListener("click", close);
      back.querySelector("#dlTemplate").addEventListener("click", ()=>{
        downloadFile(spec.filename, spec.template);
      });
      function handleText(text){
        parsed = parseCSV(text);
        const rows = parsed.records.map(spec.map).filter(spec.valid);
        const invalidCount = parsed.records.length - rows.length;
        parsed.rows = rows;
        const previewRows = rows.slice(0,8);
        const cols = previewRows.length ? Object.keys(previewRows[0]).filter(k=>k!=="createdAt") : [];
        back.querySelector("#previewBox").innerHTML =
          '<div class="import-summary"><div><b>'+parsed.records.length+'</b><span class="faint">lignes lues</span></div><div><b>'+rows.length+'</b><span class="faint">valides</span></div>'+(invalidCount?'<div><b style="color:var(--danger);">'+invalidCount+'</b><span class="faint">ignorées (incomplètes)</span></div>':'')+'</div>'+
          (rows.length ? '<div class="table-wrap" style="box-shadow:none;"><table class="grid"><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join("")+'</tr></thead><tbody>'+
            previewRows.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(r[c])+'</td>').join("")+'</tr>').join("")+
          '</tbody></table></div>'+(rows.length>8?'<p class="faint">… et '+(rows.length-8)+' de plus.</p>':'') : '<p class="faint">Aucune ligne valide détectée — vérifiez les en-têtes de colonnes.</p>');
        back.querySelector("#doImport").disabled = !rows.length;
      }
      back.querySelector("#csvFile").addEventListener("change", (e)=>{
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = ()=> handleText(String(reader.result||""));
        reader.readAsText(file, "utf-8");
      });
      back.querySelector("#csvPaste").addEventListener("input", (e)=> handleText(e.target.value));
      back.querySelector("#doImport").addEventListener("click", async ()=>{
        if(!parsed || !parsed.rows.length) return;
        const btn = back.querySelector("#doImport");
        btn.disabled = true;
        const existing = await getAll(kind);
        const existingKeys = new Set(existing.map(x=>String(x[spec.keyField]||"").toUpperCase().trim()));
        let created = 0, skipped = 0;
        for(let i=0;i<parsed.rows.length;i++){
          const row = parsed.rows[i];
          const key = String(row[spec.keyField]||"").toUpperCase().trim();
          if(existingKeys.has(key)){ skipped++; continue; }
          existingKeys.add(key);
          await state.db.collection(kind).add(row);
          created++;
          btn.textContent = "Import… "+(i+1)+"/"+parsed.rows.length;
        }
        await logAudit("Import CSV", kind, created+" créés, "+skipped+" ignorés (doublons)");
        close();
        toast(created+" ligne(s) importée(s)"+(skipped?", "+skipped+" doublon(s) ignoré(s)":"")+".");
        renderView();
      });
    }
  });
}

/* --------------------------------------------------------- line editor
   A tiny reusable component for devis/facture/commande line items.
   items: array of {type?, articleId?, reference, designation, quantite, prixUnitaire, technicienId?, technicienNom?}
*/
function computeLigneMontant(l){ return (Number(l.quantite)||0) * (Number(l.prixUnitaire)||0); }
function renderLinesEditor(container, items, articles, opts){
  opts = opts || {};
  const allowMainOeuvre = opts.allowMainOeuvre !== false;
  const techniciens = opts.techniciens || [];
  function redraw(){
    const rows = items.map((l,i)=>{
      const isPiece = l.type !== "main_oeuvre";
      return (
        '<tr data-i="'+i+'">'+
          '<td style="width:110px;">'+
            '<select data-f="type" data-i="'+i+'">'+
              '<option value="piece" '+(isPiece?"selected":"")+'>Pièce</option>'+
              (allowMainOeuvre ? '<option value="main_oeuvre" '+(!isPiece?"selected":"")+'>Main d\'œuvre</option>' : "") +
            "</select></td>"+
          '<td style="min-width:220px;">'+
            (isPiece
              ? '<div class="ssel-slot" data-slot="art" data-i="'+i+'"></div>'
              : '<input type="text" data-f="designation" data-i="'+i+'" placeholder="Description de la prestation" value="'+esc(l.designation||"")+'" style="margin-bottom:5px;">'+
                (techniciens.length ? '<div class="ssel-slot" data-slot="tech" data-i="'+i+'"></div>' : '')
            )+
          '</td>'+
          '<td style="width:70px;"><input type="number" min="0" step="1" data-f="quantite" data-i="'+i+'" value="'+(l.quantite==null?1:l.quantite)+'"></td>'+
          '<td style="width:120px;"><input type="number" min="0" step="1" data-f="prixUnitaire" data-i="'+i+'" value="'+(l.prixUnitaire==null?"":l.prixUnitaire)+'"></td>'+
          '<td class="num" style="width:110px;">'+fmtMoney(computeLigneMontant(l))+'</td>'+
          '<td style="width:34px;"><button type="button" class="btn ghost small" data-remove="'+i+'" title="Retirer">&times;</button></td>'+
        "</tr>"
      );
    }).join("");
    const total = items.reduce((s,l)=>s+computeLigneMontant(l),0);
    container.innerHTML =
      '<table class="lines-table"><thead><tr>'+
        '<th>Type</th><th>Référence / description</th><th>Qté</th><th>P.U.</th><th>Montant</th><th></th>'+
      '</tr></thead><tbody>'+
        (rows || '<tr><td colspan="6" class="faint" style="padding:10px 6px;">Aucune ligne — ajoutez une pièce ou une prestation.</td></tr>')+
      '</tbody></table>'+
      '<button type="button" class="btn small" id="addLineBtn">+ Ajouter une ligne</button>'+
      '<div class="lines-total"><span class="muted">Total</span> <b>'+fmtMoney(total)+"</b></div>";

    container.querySelectorAll('[data-slot="art"]').forEach(slot=>{
      const i = Number(slot.getAttribute("data-i"));
      mountSearchableSelect(slot, {
        items: articles,
        getId: a=>a.id, getLabel: a=>a.reference+" — "+a.designation+" (dispo "+(a.stockQte||0)+")",
        value: items[i].articleId, placeholder: "Rechercher une référence…",
        onChange: (id)=>{
          const art = articles.find(a=>a.id===id);
          items[i].articleId = id || null;
          items[i].reference = art ? art.reference : null;
          items[i].designation = art ? art.designation : "";
          items[i].prixUnitaire = art ? art.prixVente : items[i].prixUnitaire;
          redraw();
        }
      });
    });
    container.querySelectorAll('[data-slot="tech"]').forEach(slot=>{
      const i = Number(slot.getAttribute("data-i"));
      mountSearchableSelect(slot, {
        items: [{id:"", nom:"— non assigné —", metier:""}, ...techniciens],
        getId: t=>t.id, getLabel: t=> t.id ? technicienLabel(t) : t.nom,
        value: items[i].technicienId||"", placeholder: "Assigner à un technicien…",
        onChange: (id)=>{
          const tech = techniciens.find(t=>t.id===id);
          items[i].technicienId = id || null;
          items[i].technicienNom = tech ? tech.nom : null;
          items[i].metier = tech ? tech.metier : null;
        }
      });
    });
    container.querySelectorAll("select[data-f], input[data-f]").forEach(inp=>{
      inp.addEventListener(inp.tagName==="SELECT" ? "change" : "input", (e)=>{
        const i = Number(e.target.getAttribute("data-i"));
        const f = e.target.getAttribute("data-f");
        let v = e.target.value;
        if(f==="type"){
          items[i].type = v;
          if(v==="main_oeuvre"){ items[i].articleId=null; items[i].reference=null; if(items[i].prixUnitaire==null) items[i].prixUnitaire=0; }
          else { items[i].technicienId=null; items[i].technicienNom=null; }
          redraw();
          return;
        }
        if(f==="quantite" || f==="prixUnitaire"){
          items[i][f] = v===""? "" : Number(v);
          const totalEl = container.querySelector(".lines-total b");
          const rowMontant = container.querySelector('tr[data-i="'+i+'"] td.num');
          if(rowMontant) rowMontant.textContent = fmtMoney(computeLigneMontant(items[i]));
          if(totalEl) totalEl.textContent = fmtMoney(items.reduce((s,l)=>s+computeLigneMontant(l),0));
          return;
        }
        items[i][f] = v;
      });
    });
    container.querySelectorAll("[data-remove]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        items.splice(Number(btn.getAttribute("data-remove")), 1);
        redraw();
      });
    });
    const addBtn = container.querySelector("#addLineBtn");
    if(addBtn) addBtn.addEventListener("click", ()=>{
      items.push({ type:"piece", articleId:null, designation:"", quantite:1, prixUnitaire:0 });
      redraw();
    });
  }
  redraw();
  return { getItems: ()=> items.filter(l => l.type==="main_oeuvre" ? (l.designation && l.prixUnitaire!==undefined) : l.articleId) };
}

/* ----------------------------------------------------------------- nav */
function setView(name, params){
  state.view = { name, params: params||{} };
  location.hash = name + (params && params.id ? ("/"+params.id) : "");
  renderNav();
  renderView();
}
function renderNav(){
  const nav = document.getElementById("mainnav");
  const visible = NAV.filter(n=>hasTab(n.key));
  nav.innerHTML = visible.map(n=>
    '<button data-key="'+n.key+'" class="'+(state.view.name===n.key?"active":"")+'" title="'+esc(n.label)+'">'+
      '<span class="nav-ico">'+n.ico+'</span><span class="nav-label">'+esc(n.label)+'</span>'+
    "</button>"
  ).join("");
  nav.querySelectorAll("button").forEach(b=>{
    b.addEventListener("click", ()=> setView(b.getAttribute("data-key")));
  });
  document.getElementById("viewTitle").textContent =
    (NAV.find(n=>n.key===state.view.name)||{}).label || "";
}

/* ---- barre latérale rétractable (icônes seules) — préférence mémorisée
   par appareil via localStorage, pour ne pas la redemander à chaque
   connexion. Désactivée en dessous de 861px, où la barre devient de
   toute façon une bande horizontale (voir la media query mobile). */
function applySidebarCollapsed(collapsed){
  document.querySelector(".sidebar").classList.toggle("collapsed", collapsed);
  document.getElementById("app").classList.toggle("sidebar-collapsed", collapsed);
  const btn = document.getElementById("sidebarToggle");
  if(btn) btn.setAttribute("aria-label", collapsed ? "Déployer le menu" : "Réduire le menu");
  try{ localStorage.setItem("partsflow_sidebar_collapsed", collapsed ? "1" : "0"); }catch(e){ /* stockage indisponible, non bloquant */ }
}
(function initSidebarToggle(){
  const btn = document.getElementById("sidebarToggle");
  if(!btn) return;
  btn.addEventListener("click", ()=>{
    applySidebarCollapsed(!document.querySelector(".sidebar").classList.contains("collapsed"));
  });
  let saved = false;
  try{ saved = localStorage.getItem("partsflow_sidebar_collapsed")==="1"; }catch(e){ /* défaut: déployé */ }
  applySidebarCollapsed(saved);
})();

async function renderView(){
  const view = document.getElementById("view");
  view.innerHTML = '<p class="faint">Chargement…</p>';
  if(!state.db){
    view.innerHTML = '<div class="callout danger"><span class="lbl">Indisponible</span><p>La base de données de l\'application n\'a pas pu être chargée dans cette vue. Réouvrez la page publiée.</p></div>';
    return;
  }
  if(!hasTab(state.view.name)){
    view.innerHTML = '<div class="callout danger"><span class="lbl">Accès restreint</span><p>Vous n\'avez pas accès à cet onglet. Demandez à un administrateur de vous l\'ouvrir dans Paramètres.</p></div>';
    return;
  }
  try{
    const fn = VIEWS[state.view.name] || VIEWS.dashboard;
    await fn(view, state.view.params);
  }catch(e){
    console.error(e);
    view.innerHTML = '<div class="callout danger"><span class="lbl">Erreur</span><p>'+esc(e.message||String(e))+"</p></div>";
  }
}

/* ================================================================= VIEWS */
const VIEWS = {};

/* ---- Dashboard ---------------------------------------------------- */
function startOfWeek(d){
  const day = d.getDay();
  const diff = (day===0 ? -6 : 1-day);
  const monday = new Date(d);
  monday.setHours(0,0,0,0);
  monday.setDate(d.getDate()+diff);
  return monday;
}
function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }

VIEWS.dashboard = async function(view){
  const [vehicules, articles, factures, ordres] = await Promise.all([
    getAll("vehicules"), getAll("articles"), getAll("factures"), getAll("ordres")
  ]);
  const facturesActives = factures.filter(f=>f.statutPaiement!=="annulee");
  const totalDu = facturesActives.reduce((s,f)=> s + Math.max(0,(f.montantTotal||0)-(f.montantRegle||0)), 0);
  const stockValeur = articles.reduce((s,a)=> s + (Number(a.stockQte)||0)*(Number(a.prixAchat)||0), 0);
  const sousSeuil = articles.filter(a=> (Number(a.stockQte)||0) <= (Number(a.stockSeuil)||0));
  const orOuverts = ordres.filter(o=>o.statut==="ouvert");

  const immobilises = vehicules.filter(v=>v.statut==="immobilise");
  const vehiculesEnReparation = new Set(orOuverts.map(o=>o.vehiculeId));
  // Basé sur le statut réel du véhicule (pas seulement sur l'état du devis) pour que
  // ce chiffre se mette à jour dès qu'un véhicule change de statut, cf. l'onglet Triage.
  const enAttentePriseEnCharge = immobilises.filter(v=>!vehiculesEnReparation.has(v.id));
  const now = new Date();
  const debutSemaine = startOfWeek(now), debutMois = startOfMonth(now);
  const orClotures = ordres.filter(o=>o.statut==="cloture" && o.dateCloture);
  const reparesSemaine = orClotures.filter(o=> new Date(o.dateCloture) >= debutSemaine).length;
  const reparesMois = orClotures.filter(o=> new Date(o.dateCloture) >= debutMois).length;

  const parVehicule = {};
  facturesActives.forEach(f=>{
    const du = Math.max(0,(f.montantTotal||0)-(f.montantRegle||0));
    if(du<=0) return;
    parVehicule[f.vehiculeId] = (parVehicule[f.vehiculeId]||0) + du;
  });
  const topDebiteurs = Object.entries(parVehicule)
    .sort((a,b)=>b[1]-a[1]).slice(0,8)
    .map(([vid, du])=>({ vehicule: vehicules.find(v=>v.id===vid), du }))
    .filter(r=>r.vehicule);

  view.innerHTML =
    '<div class="view-head"><div><p class="lede">Vue d\'ensemble de la flotte, du stock et des impayés — cliquez un chiffre pour voir le détail.</p></div></div>'+
    '<div class="kpi-grid">'+
      '<div class="kpi clickable accent-top" data-goto="vehicules"><div class="lbl">Véhicules suivis</div><div class="val">'+vehicules.length+'</div><div class="sub">flotte VTC</div></div>'+
      '<div class="kpi clickable danger-top" data-goto="factures" data-filter="dues"><div class="lbl">Total dû (flotte)</div><div class="val '+(totalDu>0?"danger":"")+'">'+fmtMoney(totalDu)+'</div><div class="sub">factures non soldées</div></div>'+
      '<div class="kpi clickable teal-top" data-goto="stock"><div class="lbl">Valeur du stock</div><div class="val">'+fmtMoney(stockValeur)+'</div><div class="sub">au coût d\'achat</div></div>'+
      '<div class="kpi clickable amber-top" data-goto="stock" data-filter="sousSeuil"><div class="lbl">Réf. sous seuil</div><div class="val '+(sousSeuil.length>0?"amber":"")+'">'+sousSeuil.length+'</div><div class="sub">à réapprovisionner</div></div>'+
      '<div class="kpi clickable good-top" data-goto="atelier" data-filter="ouvert"><div class="lbl">OR ouverts</div><div class="val">'+orOuverts.length+'</div><div class="sub">interventions en cours</div></div>'+
    '</div>'+
    '<h3 class="section-title">État de la flotte &amp; réparations</h3>'+
    '<div class="kpi-grid">'+
      '<div class="kpi clickable danger-top" data-goto="vehicules"><div class="lbl">Immobilisés</div><div class="val '+(immobilises.length>0?"danger":"")+'">'+immobilises.length+'</div><div class="sub">véhicules à l\'arrêt</div></div>'+
      '<div class="kpi clickable good-top" data-goto="atelier" data-filter="ouvert"><div class="lbl">En réparation</div><div class="val">'+vehiculesEnReparation.size+'</div><div class="sub">véhicules, OR ouvert</div></div>'+
      '<div class="kpi clickable amber-top" data-goto="triage"><div class="lbl">En attente de prise en charge</div><div class="val '+(enAttentePriseEnCharge.length>0?"amber":"")+'">'+enAttentePriseEnCharge.length+'</div><div class="sub">immobilisés, pas encore en réparation</div></div>'+
      '<div class="kpi clickable teal-top" data-goto="atelier"><div class="lbl">Réparés cette semaine</div><div class="val">'+reparesSemaine+'</div><div class="sub">depuis lundi</div></div>'+
      '<div class="kpi clickable teal-top" data-goto="atelier"><div class="lbl">Réparés ce mois-ci</div><div class="val">'+reparesMois+'</div><div class="sub">'+now.toLocaleDateString("fr-FR",{month:"long"})+'</div></div>'+
    '</div>'+
    '<div class="detail-grid">'+
      '<div>'+
        '<h3 class="section-title">Véhicules avec le plus d\'impayés</h3>'+
        '<div class="table-wrap"><table class="grid"><thead><tr><th>Immatriculation</th><th>Chauffeur</th><th class="num">Montant dû</th></tr></thead><tbody>'+
          (topDebiteurs.length ? topDebiteurs.map(r=>
            '<tr class="clickable" data-veh="'+r.vehicule.id+'"><td class="mono">'+esc(r.vehicule.immatriculation)+'</td><td>'+esc(r.vehicule.chauffeurNom||"—")+'</td><td class="num mono">'+fmtMoney(r.du)+"</td></tr>"
          ).join("") : '<tr class="empty-row"><td colspan="3">Aucun impayé — la flotte est à jour.</td></tr>')+
        "</tbody></table></div>"+
      "</div>"+
      '<div>'+
        '<h3 class="section-title">Références sous seuil</h3>'+
        '<div class="table-wrap"><table class="grid"><thead><tr><th>Référence</th><th class="num">Stock</th></tr></thead><tbody>'+
          (sousSeuil.length ? sousSeuil.slice(0,10).map(a=>
            '<tr class="clickable" data-art="'+a.id+'"><td>'+esc(a.reference)+'<br><span class="faint">'+esc(a.designation)+'</span></td><td class="num mono">'+(a.stockQte||0)+' / '+(a.stockSeuil||0)+"</td></tr>"
          ).join("") : '<tr class="empty-row"><td colspan="2">Aucune rupture prévisible.</td></tr>')+
        "</tbody></table></div>"+
      "</div>"+
    "</div>";

  view.querySelectorAll("[data-veh]").forEach(tr=>{
    tr.addEventListener("click", ()=> setView("vehicule-detail", { id: tr.getAttribute("data-veh") }));
  });
  view.querySelectorAll("[data-art]").forEach(tr=>{
    tr.addEventListener("click", ()=> setView("stock", { filter:"sousSeuil" }));
  });
  view.querySelectorAll("[data-goto]").forEach(el=>{
    el.addEventListener("click", ()=> setView(el.getAttribute("data-goto"), { filter: el.getAttribute("data-filter")||undefined }));
  });
};

VIEWS.vehicules = async function(view){
  const vehicules = await getAll("vehicules");
  vehicules.sort((a,b)=> (a.immatriculation||"").localeCompare(b.immatriculation||""));

  view.innerHTML =
    '<div class="view-head"><div><p class="lede">Flotte VTC suivie par PartsFlow — '+vehicules.length+' véhicule(s) enregistré(s).</p></div>'+
      '<div class="row-actions"><button class="btn" id="importCsv">Importer CSV</button><button class="btn primary" id="newVehicule">+ Nouveau véhicule</button></div></div>'+
    '<div class="toolbar"><input type="search" id="vehSearch" placeholder="Rechercher par immatriculation, chauffeur, marque, groupe…"></div>'+

      '<th>Immatriculation</th><th>Véhicule</th><th>Chauffeur</th><th>Groupe</th><th>Type</th><th>Contrat</th><th>Statut</th>'+
    "</tr></thead><tbody id=\"vehTbody\"></tbody></table></div>";

  function draw(filter){
    const f = (filter||"").toLowerCase();
    const rows = vehicules.filter(v=>
      !f || [v.immatriculation,v.chauffeurNom,v.marque,v.modele,v.groupe,v.type,v.contrat].some(x=>(x||"").toLowerCase().includes(f))
    );
    document.getElementById("vehTbody").innerHTML = rows.length ? rows.map(v=>
      '<tr class="clickable" data-id="'+v.id+'">'+
        '<td class="mono">'+esc(v.immatriculation)+'</td>'+
        '<td>'+esc(v.marque)+" "+esc(v.modele)+'</td>'+
        '<td>'+esc(v.chauffeurNom||"—")+"</td>"+
        '<td>'+esc(v.groupe||"—")+"</td>"+
        '<td>'+esc(v.type||"—")+"</td>"+
        '<td>'+esc(v.contrat||"—")+"</td>"+
        '<td>'+pill(v.statut||"actif")+(v.statut==="immobilise" && v.motifInactivite ? '<br><span class="faint" style="font-size:.78rem;">'+esc(MOTIFS_INACTIVITE[v.motifInactivite]||v.motifInactivite)+"</span>" : "")+"</td>"+
      "</tr>"
    ).join("") : '<tr class="empty-row"><td colspan="7">Aucun véhicule ne correspond.</td></tr>';
    document.querySelectorAll("#vehTbody [data-id]").forEach(tr=>{
      tr.addEventListener("click", ()=> setView("vehicule-detail", { id: tr.getAttribute("data-id") }));
    });
  }
  draw("");
  document.getElementById("vehSearch").addEventListener("input", e=>draw(e.target.value));
  document.getElementById("newVehicule").addEventListener("click", ()=> openVehiculeForm());
  document.getElementById("importCsv").addEventListener("click", ()=> openCsvImport("vehicules"));
};

function openVehiculeForm(existing){
  const v = existing || {};
  const body =
    '<div class="field-row" style="grid-template-columns:1fr 1fr;">'+
      '<div class="field"><label>Immatriculation</label><input id="f_immat" value="'+esc(v.immatriculation||"")+'" placeholder="AB-1234-CD"></div>'+
      '<div class="field"><label>Statut</label><select id="f_statut">'+
        ["actif","immobilise","sorti_de_flotte"].map(s=>'<option value="'+s+'" '+(v.statut===s?"selected":"")+'>'+PILL_LABELS[s]+"</option>").join("")+
      "</select></div>"+
    "</div>"+
    '<div class="field-row" id="f_inactivite_row" style="grid-template-columns:1fr 1fr;'+(v.statut==="immobilise"?"":"display:none;")+'">'+
      '<div class="field"><label>Motif d\'immobilisation</label><select id="f_motif">'+
        '<option value="">— à préciser —</option>'+
        Object.entries(MOTIFS_INACTIVITE).map(([k,l])=>'<option value="'+k+'" '+((v.motifInactivite||"")===k?"selected":"")+'>'+l+"</option>").join("")+
      "</select></div>"+
      '<div class="field"><label>Éléments précis concernés</label><input id="f_detail" value="'+esc(v.detailInactivite||"")+'" placeholder="ex. plaquettes avant, pare-choc arrière…"></div>'+
    "</div>"+
    '<div class="field-row" style="grid-template-columns:1fr 1fr;">'+
      '<div class="field"><label>Marque</label><input id="f_marque" value="'+esc(v.marque||"")+'"></div>'+
      '<div class="field"><label>Modèle</label><input id="f_modele" value="'+esc(v.modele||"")+'"></div>'+
    "</div>"+
    '<div class="field-row" style="grid-template-columns:1fr 1fr 1fr;">'+
      '<div class="field"><label>Groupe</label><input id="f_groupe" value="'+esc(v.groupe||"")+'" placeholder="ex. A"></div>'+
      '<div class="field"><label>Type</label><input id="f_type" value="'+esc(v.type||"")+'" placeholder="ex. Berline, Cargo"></div>'+
      '<div class="field"><label>Contrat</label><input id="f_contrat" value="'+esc(v.contrat||"")+'" placeholder="ex. Classique, Vente"></div>'+
    "</div>"+
    '<div class="field-row" style="grid-template-columns:1fr 1fr;">'+
      '<div class="field"><label>Chauffeur</label><input id="f_chauffeur" value="'+esc(v.chauffeurNom||"")+'"></div>'+
      '<div class="field"><label>Téléphone chauffeur</label><input id="f_tel" value="'+esc(v.chauffeurTelephone||"")+'"></div>'+
    "</div>";
  const { close } = openModal(existing ? "Modifier le véhicule" : "Nouveau véhicule", body, {
    footHtml: '<button class="btn ghost" id="cancel">Annuler</button><button class="btn primary" id="save">Enregistrer</button>',
    onMount(back, close){
      const statutSel = back.querySelector("#f_statut");
      const inactRow = back.querySelector("#f_inactivite_row");
      statutSel.addEventListener("change", ()=>{
        inactRow.style.display = statutSel.value==="immobilise" ? "" : "none";
      });
      back.querySelector("#cancel").addEventListener("click", close);
      back.querySelector("#save").addEventListener("click", async ()=>{
        const immat = back.querySelector("#f_immat").value.trim().toUpperCase();
        if(!immat){ toast("L'immatriculation est obligatoire.", "danger"); return; }
        const nouveauStatut = statutSel.value;
        if(nouveauStatut==="immobilise" && !back.querySelector("#f_motif").value){
          toast("Choisissez un motif d'immobilisation.", "danger"); return;
        }
        const data = {
          immatriculation: immat,
          statut: nouveauStatut,
          marque: back.querySelector("#f_marque").value.trim(),
          modele: back.querySelector("#f_modele").value.trim(),
          groupe: back.querySelector("#f_groupe").value.trim(),
          type: back.querySelector("#f_type").value.trim(),
          contrat: back.querySelector("#f_contrat").value.trim(),
          chauffeurNom: back.querySelector("#f_chauffeur").value.trim(),
          chauffeurTelephone: back.querySelector("#f_tel").value.trim(),
        };
        if(nouveauStatut==="immobilise"){
          data.motifInactivite = back.querySelector("#f_motif").value;
          data.detailInactivite = back.querySelector("#f_detail").value.trim();
        } else {
          data.motifInactivite = null;
          data.detailInactivite = null;
        }
        // Track "depuis quand immobilisé" for the file d'attente de prise en charge —
        // stamped the moment the status changes to immobilisé, cleared otherwise.
        if(nouveauStatut==="immobilise" && (!existing || existing.statut!=="immobilise")) data.immobiliseDepuis = todayIso();
        if(nouveauStatut!=="immobilise") data.immobiliseDepuis = null;
        if(existing){
          await state.db.doc("vehicules/"+existing.id).update(data);
          await logAudit("Modification véhicule", immat, "");
        } else {
          data.createdAt = todayIso();
          await state.db.collection("vehicules").add(data);
          await logAudit("Création véhicule", immat, "");
        }
        close();
        toast("Véhicule enregistré.");
        renderView();
      });
    }
  });
}

VIEWS["vehicule-detail"] = async function(view, params){
  const v = await getOne("vehicules", params.id);
  if(!v){ view.innerHTML = '<p class="faint">Véhicule introuvable.</p>'; return; }
  const [factures, ordres] = await Promise.all([getAll("factures"), getAll("ordres")]);
  const mesFactures = factures.filter(f=>f.vehiculeId===v.id).sort((a,b)=> new Date(b.date)-new Date(a.date));
  const mesOR = ordres.filter(o=>o.vehiculeId===v.id).sort((a,b)=> new Date(b.dateOuverture)-new Date(a.dateOuverture));
  const facturesActives = mesFactures.filter(f=>f.statutPaiement!=="annulee");
  const totalDepenses = facturesActives.reduce((s,f)=>s+(f.montantTotal||0),0);
  const totalRegle = facturesActives.reduce((s,f)=>s+(f.montantRegle||0),0);
  const totalDu = Math.max(0, totalDepenses-totalRegle);

  view.innerHTML =
    '<button class="back-link" id="back">&larr; Retour aux véhicules</button>'+
    '<div class="view-head"><div><h2 style="font-size:1.6rem;">'+esc(v.immatriculation)+'</h2>'+
      '<p class="lede">'+esc(v.marque)+" "+esc(v.modele)+(v.type?" · "+esc(v.type):"")+" · Chauffeur : "+esc(v.chauffeurNom||"non renseigné")+"</p></div>"+
      '<div class="row-actions"><button class="btn" id="editVeh">Modifier</button>'+(v.statut==="immobilise" ? '<button class="btn danger" id="cmdUrgente">Commande urgente</button>' : "")+'</div></div>'+
    '<div class="kpi-grid">'+
      '<div class="kpi"><div class="lbl">Statut</div><div class="val" style="font-size:1.1rem;">'+pill(v.statut||"actif")+'</div></div>'+
      '<div class="kpi"><div class="lbl">Groupe / Contrat</div><div class="val" style="font-size:1.1rem;">'+esc(v.groupe||"—")+' / '+esc(v.contrat||"—")+'</div></div>'+
      '<div class="kpi"><div class="lbl">Dépenses totales</div><div class="val">'+fmtMoney(totalDepenses)+'</div><div class="sub">pièces + main d\'œuvre</div></div>'+
      '<div class="kpi"><div class="lbl">Réglé à ce jour</div><div class="val">'+fmtMoney(totalRegle)+'</div></div>'+
      '<div class="kpi"><div class="lbl">Montant dû</div><div class="val '+(totalDu>0?"danger":"")+'">'+fmtMoney(totalDu)+'</div></div>'+
    "</div>"+
    (v.statut==="immobilise" ?
      '<div class="callout danger"><span class="lbl">Immobilisation — '+esc(MOTIFS_INACTIVITE[v.motifInactivite]||v.motifInactivite||"motif non précisé")+'</span><p>'+esc(v.detailInactivite||"Aucun détail renseigné.")+'</p></div>'
    : "")+
    '<h3 class="section-title">Factures</h3>'+
    '<div class="table-wrap"><table class="grid"><thead><tr><th>N°</th><th>Date</th><th class="num">Total</th><th class="num">Réglé</th><th class="num">Reste dû</th><th>Statut</th></tr></thead><tbody>'+
      (mesFactures.length ? mesFactures.map(f=>{
        const reste = Math.max(0,(f.montantTotal||0)-(f.montantRegle||0));
        return '<tr class="clickable" data-f="'+f.id+'"><td class="mono">'+esc(f.numero)+'</td><td>'+fmtDate(f.date)+'</td><td class="num mono">'+fmtMoney(f.montantTotal)+'</td><td class="num mono">'+fmtMoney(f.montantRegle)+'</td><td class="num mono">'+fmtMoney(reste)+'</td><td>'+pill(f.statutPaiement)+"</td></tr>";
      }).join("") : '<tr class="empty-row"><td colspan="6">Aucune facture pour ce véhicule.</td></tr>')+
    "</tbody></table></div>"+
    '<h3 class="section-title">Ordres de réparation</h3>'+
    '<div class="table-wrap"><table class="grid"><thead><tr><th>N°</th><th>Ouverture</th><th>Statut</th><th class="num">Pièces</th><th class="num">Interventions</th></tr></thead><tbody>'+
      (mesOR.length ? mesOR.map(o=>
        '<tr class="clickable" data-or="'+o.id+'"><td class="mono">'+esc(o.numero)+'</td><td>'+fmtDate(o.dateOuverture)+'</td><td>'+pill(o.statut)+'</td><td class="num">'+(o.pieces||[]).length+'</td><td class="num">'+(o.interventions||[]).length+"</td></tr>"
      ).join("") : '<tr class="empty-row"><td colspan="5">Aucun ordre de réparation pour ce véhicule.</td></tr>')+
    "</tbody></table></div>";

  view.querySelector("#back").addEventListener("click", ()=>setView("vehicules"));
  view.querySelector("#editVeh").addEventListener("click", ()=>openVehiculeForm(v));
  const cmdBtn = view.querySelector("#cmdUrgente");
  if(cmdBtn) cmdBtn.addEventListener("click", async ()=>{
    const [fournisseurs, articles] = await Promise.all([getAll("fournisseurs"), getAll("articles")]);
    openCommandeForm(fournisseurs, articles, {
      urgente: true,
      vehiculeId: v.id,
      note: "Immobilisation "+v.immatriculation+" — "+(MOTIFS_INACTIVITE[v.motifInactivite]||v.motifInactivite||"motif non précisé")+(v.detailInactivite ? " : "+v.detailInactivite : "")
    });
  });
  view.querySelectorAll("[data-f]").forEach(tr=>tr.addEventListener("click", ()=>setView("facture-detail",{id:tr.getAttribute("data-f")})));
  view.querySelectorAll("[data-or]").forEach(tr=>tr.addEventListener("click", ()=>setView("atelier-detail",{id:tr.getAttribute("data-or")})));
};

VIEWS.stock = async function(view, params){
  const [articles, fournisseurs] = await Promise.all([getAll("articles"), getAll("fournisseurs")]);
  articles.sort((a,b)=>(a.reference||"").localeCompare(b.reference||""));
  const startSousSeuil = !!(params && params.filter==="sousSeuil");

  view.innerHTML =
    '<div class="view-head"><div><p class="lede">Référentiel des pièces et niveaux de stock — '+articles.length+' référence(s).</p></div>'+
      '<div class="row-actions"><button class="btn" id="importCsv">Importer CSV</button><button class="btn primary" id="newArticle">+ Nouvel article</button></div></div>'+
    '<div class="toolbar"><input type="search" id="artSearch" placeholder="Rechercher une référence, désignation, famille…">'+
      '<label class="checkbox-row" style="margin:0;"><input type="checkbox" id="onlyLow"> Sous seuil uniquement</label></div>'+
    '<div class="table-wrap"><table class="grid"><thead><tr>'+
      '<th>Référence</th><th>Désignation</th><th>Famille</th><th class="num">Stock</th><th class="num">Seuil</th><th class="num">Prix vente</th><th></th>'+
    "</tr></thead><tbody id=\"artTbody\"></tbody></table></div>";

  function draw(){
    const f = document.getElementById("artSearch").value.toLowerCase();
    const onlyLow = document.getElementById("onlyLow").checked;
    const rows = articles.filter(a=>{
      const textOk = !f || [a.reference,a.designation,a.famille].some(x=>(x||"").toLowerCase().includes(f));
      const lowOk = !onlyLow || (Number(a.stockQte)||0) <= (Number(a.stockSeuil)||0);
      return textOk && lowOk;
    });
    document.getElementById("artTbody").innerHTML = rows.length ? rows.map(a=>{
      const low = (Number(a.stockQte)||0) <= (Number(a.stockSeuil)||0);
      return '<tr>'+
        '<td class="mono clickable" data-hist="'+a.id+'">'+esc(a.reference)+'</td>'+
        '<td>'+esc(a.designation)+'</td>'+
        '<td>'+esc(a.famille||"—")+'</td>'+
        '<td class="num mono">'+(a.stockQte||0)+(low?' <span class="badge-low">bas</span>':"")+'</td>'+
        '<td class="num mono">'+(a.stockSeuil||0)+'</td>'+
        '<td class="num mono">'+fmtMoney(a.prixVente)+'</td>'+
        '<td class="row-actions"><button class="btn small" data-adj="'+a.id+'">Ajuster</button><button class="btn small ghost" data-edit="'+a.id+'">Modifier</button></td>'+
      "</tr>";
    }).join("") : '<tr class="empty-row"><td colspan="7">Aucun article ne correspond.</td></tr>';

    document.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click", ()=>openArticleForm(articles.find(a=>a.id===b.getAttribute("data-edit")), fournisseurs)));
    document.querySelectorAll("[data-adj]").forEach(b=>b.addEventListener("click", ()=>openStockAdjustForm(articles.find(a=>a.id===b.getAttribute("data-adj")))));
    document.querySelectorAll("[data-hist]").forEach(b=>b.addEventListener("click", ()=>openMouvementsHistory(articles.find(a=>a.id===b.getAttribute("data-hist")))));
  }
  document.getElementById("onlyLow").checked = startSousSeuil;
  draw();
  document.getElementById("artSearch").addEventListener("input", draw);
  document.getElementById("onlyLow").addEventListener("change", draw);
  document.getElementById("newArticle").addEventListener("click", ()=>openArticleForm(null, fournisseurs));
  document.getElementById("importCsv").addEventListener("click", ()=>openCsvImport("articles"));
};

async function openCommandeDetail(id){
  const [c, fournisseurs] = await Promise.all([getOne("commandes", id), getAll("fournisseurs")]);
  const f = fournisseurs.find(x=>x.id===c.fournisseurId);
  const lignesHtml = (c.lignes||[]).map((l,i)=>
    '<tr><td>'+esc(l.reference)+" — "+esc(l.designation)+'</td><td class="num mono">'+l.qteCommandee+'</td>'+
    '<td class="num"><input type="number" data-recv="'+i+'" value="'+(l.qteRecue||0)+'" style="width:80px;" '+(c.statut==="soldee"?"disabled":"")+'></td>'+
    '<td class="num mono">'+fmtMoney(l.prixUnitaire)+"</td></tr>"
  ).join("");
  const body =
    '<p class="muted" style="margin-top:0;">Fournisseur : <b>'+esc(f?f.nom:"—")+'</b> · Statut : '+pill(c.statut)+(c.urgente ? ' · <span class="pill impayee">Urgente</span>' : "")+"</p>"+
    (c.note ? '<p class="faint" style="margin-top:-6px;">'+esc(c.note)+"</p>" : "")+
    '<table class="lines-table"><thead><tr><th>Référence</th><th>Commandé</th><th>Reçu</th><th>P.U.</th></tr></thead><tbody>'+lignesHtml+"</tbody></table>"+
    (c.statut!=="soldee" ? '<div class="callout"><span class="lbl">Réception</span><p>Indiquez la quantité effectivement reçue par ligne, puis validez : le stock et le coût moyen sont mis à jour automatiquement.</p></div>' : "");
  const footHtml = c.statut!=="soldee"
    ? '<button class="btn ghost" id="cl">Fermer</button><button class="btn primary" id="receive">Valider la réception</button>'
    : '<button class="btn" id="cl">Fermer</button>';
  openModal("Commande "+c.numero, body, {
    wide:true, footHtml,
    onMount(back, close){
      back.querySelector("#cl").addEventListener("click", close);
      const btn = back.querySelector("#receive");
      if(btn) btn.addEventListener("click", async ()=>{
        const inputs = back.querySelectorAll("[data-recv]");
        const lignes = JSON.parse(JSON.stringify(c.lignes||[]));
        for(const inp of inputs){
          const i = Number(inp.getAttribute("data-recv"));
          const qte = Number(inp.value)||0;
          const already = lignes[i].qteRecue||0;
          const delta = qte - already;
          lignes[i].qteRecue = qte;
          if(delta!==0 && lignes[i].articleId){
            const artRef = state.db.doc("articles/"+lignes[i].articleId);
            const snap = await artRef.get();
            if(snap.exists){
              const art = snap.data();
              const oldQte = Number(art.stockQte)||0;
              const oldPrix = Number(art.prixAchat)||0;
              const nouveauPrix = delta>0 ? (((oldQte*oldPrix) + (delta*lignes[i].prixUnitaire)) / Math.max(1,(oldQte+delta))) : oldPrix;
              await artRef.update({ prixAchat: Math.round(nouveauPrix*100)/100 });
              await ajusterStock(lignes[i].articleId, delta, delta>0?"entree":"ajustement", "commande", c.numero, "Réception commande");
            }
          }
        }
        const totalCommande = lignes.reduce((s,l)=>s+l.qteCommandee,0);
        const totalRecu = lignes.reduce((s,l)=>s+(l.qteRecue||0),0);
        const statut = totalRecu<=0 ? c.statut : (totalRecu>=totalCommande ? "soldee" : "recue_partielle");
        await state.db.doc("commandes/"+c.id).update({ lignes, statut });
        await logAudit("Réception commande", c.numero, "");
        close(); toast("Réception enregistrée."); renderView();
      });
    }
  });
}
